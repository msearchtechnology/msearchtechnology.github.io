<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatDE</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --card-bg: #f0f0f0;
      --border-color: #000000;
      --input-bg: #ffffff;
      --user-msg-bg: #e2e2e2;
      --icon-color: #000000;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #ffffff;
      --card-bg: #2a2a2a;
      --border-color: #ffffff;
      --input-bg: #1e1e1e;
      --user-msg-bg: #333333;
      --icon-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      max-width: 500px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Header */
    header {
      padding: 16px 20px 8px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 15px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 800;
    }

    .btn-two-lines {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 24px;
      height: 24px;
      padding: 0;
    }

    .btn-two-lines span {
      display: block;
      width: 100%;
      height: 2px;
      background-color: var(--text-color);
      border-radius: 2px;
    }

    /* Chat Area */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 85%;
      font-size: 16px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg-bg);
      padding: 8px 16px;
      border-radius: 20px;
    }

    .message.ai {
      align-self: flex-start;
      margin-top: 5px;
      width: 100%;
    }

    .message.ai p {
      margin-bottom: 10px;
    }

    /* Message Action Buttons */
    .msg-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .msg-action-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .msg-action-btn:hover {
      opacity: 1;
    }

    .msg-action-btn svg {
      width: 16px;
      height: 16px;
      fill: var(--icon-color);
    }

    .download-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      margin-top: 5px;
    }

    .btn-download {
      background: var(--text-color);
      color: var(--bg-color);
      border: none;
      padding: 10px 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    /* Input Bar */
    .input-bar {
      flex-shrink: 0;
      padding: 10px 15px calc(15px + env(safe-area-inset-bottom, 0px));
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: var(--bg-color);
      position: sticky;
      bottom: 0;
      z-index: 10;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      width: 100%;
      border: 2px solid var(--border-color);
      border-radius: 30px;
      padding: 6px 8px 6px 15px;
      background-color: var(--input-bg);
    }

    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .btn-icon svg {
      width: 20px;
      height: 20px;
      fill: var(--icon-color);
    }

    .drawer-icon svg {
      width: 26px !important;
      height: 26px !important;
      fill: var(--icon-color) !important;
    }

    .input-wrapper input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 16px;
      padding: 8px;
      color: var(--text-color);
    }

    .btn-search {
      background: var(--text-color);
      color: var(--bg-color);
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.1s ease;
    }

    .btn-search:active {
      transform: scale(0.95);
    }

    .btn-search svg {
      width: 22px;
      height: 22px;
      fill: var(--bg-color);
    }

    /* Modals & Drawers */
    .modal-overlay, .drawer-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      z-index: 100;
    }

    .modal-overlay {
      justify-content: center;
      align-items: center;
    }

    .drawer {
      position: absolute;
      top: 0; left: 0;
      width: 80%;
      max-width: 320px;
      height: 100%;
      background: var(--bg-color);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 15px;
      box-shadow: 2px 0 10px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }

    .settings-drawer {
      position: absolute;
      top: 0; left: -100%;
      width: 80%;
      max-width: 320px;
      height: 100%;
      background: var(--bg-color);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 15px;
      box-shadow: 2px 0 10px rgba(0,0,0,0.2);
      z-index: 101;
      transition: left 0.3s ease;
    }

    .settings-drawer.open {
      left: 0;
    }

    .modal {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .modal-header {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .menu-item {
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .history-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin-top: 10px;
    }

    .history-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      opacity: 0.7;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--card-bg);
      cursor: pointer;
    }

    .chat-history-item span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .chat-action-menu {
      display: none;
      position: absolute;
      right: 30px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 10;
    }

    .chat-action-menu button {
      display: block;
      width: 100%;
      padding: 8px 12px;
      background: none;
      border: none;
      color: var(--text-color);
      text-align: left;
      cursor: pointer;
      font-size: 13px;
    }

    .chat-action-menu button:hover {
      background: var(--card-bg);
    }

    .title-field-group {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--input-bg);
      color: var(--text-color);
      outline: none;
    }

    textarea.form-control {
      resize: vertical;
      height: 80px;
    }

    .btn-add-q {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0 10px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .saved-list {
      max-height: 150px;
      overflow-y: auto;
      margin-top: 15px;
      border-top: 1px solid var(--border-color);
      padding-top: 10px;
    }

    .saved-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      background: var(--card-bg);
      margin-bottom: 5px;
      border-radius: 6px;
    }

    .saved-item-actions button {
      background: none;
      border: none;
      cursor: pointer;
      margin-left: 5px;
    }

    .action-btn {
      width: 100%;
      padding: 10px;
      background: var(--text-color);
      color: var(--bg-color);
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .search-chat-item {
      padding: 10px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
    }

    .search-chat-item .date {
      font-size: 11px;
      opacity: 0.6;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <header>
    <button class="btn-two-lines" onclick="openDrawer()" aria-label="Menu">
      <span></span>
      <span></span>
    </button>
    <h1>ChatDE</h1>
  </header>

  <main id="chat-container">
    <!-- Messages appended dynamically -->
  </main>

  <div class="input-bar">
    <div class="input-wrapper">
      <button class="btn-icon" id="btn-plus">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
      <input type="text" id="query-input" placeholder="Ask" onkeypress="handleKeyPress(event)">
      <button class="btn-search" id="action-btn" onclick="handleSearchClick()">
        <!-- Search Icon -->
        <svg id="icon-search" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <!-- Stop Square Icon -->
        <svg id="icon-stop" viewBox="0 0 24 24" style="display:none;">
          <path d="M6 6h12v12H6z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Slide Drawer Menu -->
  <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()">
    <div class="drawer" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span>Menu</span>
        <button class="btn-icon" onclick="closeDrawer()">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>

      <div class="menu-item" onclick="startNewChat()">
        <span class="drawer-icon">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </span>
        <span>New Chat</span>
      </div>

      <div class="menu-item" onclick="openSearchChatModal()">
        <span class="drawer-icon">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 11.99 14 9.5 14z"/></svg>
        </span>
        <span>Search Chat</span>
      </div>

      <div class="history-section">
        <div class="history-title">Recent</div>
        <div class="history-list" id="history-list">
          <!-- Recent saved chats -->
        </div>
      </div>

      <!-- Settings Menu Option at Bottom -->
      <div class="menu-item" style="margin-top: auto;" onclick="openSettingsDrawer()">
        <span class="drawer-icon">
          <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
        </span>
        <span>Settings</span>
      </div>
    </div>

    <!-- Secondary Settings Slide Drawer -->
    <div class="settings-drawer" id="settings-drawer" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:8px;">
          <button class="btn-icon" onclick="closeSettingsDrawer()">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          </button>
          <span>Settings</span>
        </div>
      </div>
      <div class="history-title" style="margin-top:10px;">Theme Selection</div>
      <div class="menu-item" onclick="setTheme('light')">Light Theme</div>
      <div class="menu-item" onclick="setTheme('dark')">Dark Theme</div>
    </div>
  </div>

  <!-- Main Popup Menu -->
  <div class="modal-overlay" id="main-menu">
    <div class="modal">
      <div class="modal-header">
        <span>Options</span>
        <button class="btn-icon" onclick="closeModal('main-menu')">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="menu-item" onclick="openDataModal()">Add Data</div>
    </div>
  </div>

  <!-- Search Chat Modal -->
  <div class="modal-overlay" id="search-chat-modal">
    <div class="modal">
      <div class="modal-header">
        <span>Search Chat</span>
        <button class="btn-icon" onclick="closeModal('search-chat-modal')">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <input type="text" class="form-control" id="search-chat-input" placeholder="Type to search..." oninput="filterChats()">
      <div class="saved-list" id="search-results-list" style="max-height: 220px;">
        <!-- Filtered chats rendered here -->
      </div>
    </div>
  </div>

  <!-- Add/Edit Data Modal -->
  <div class="modal-overlay" id="data-modal">
    <div class="modal">
      <div class="modal-header">
        <span id="data-modal-title">Add Data</span>
        <button class="btn-icon" onclick="closeModal('data-modal')">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div id="title-container">
        <div class="title-field-group">
          <input type="text" class="form-control title-input" placeholder="Title or Question">
          <button class="btn-add-q" onclick="addTitleField()">Add Q</button>
        </div>
      </div>
      <div style="margin-top: 10px;">
        <textarea id="about-input" class="form-control" placeholder="About"></textarea>
      </div>
      <button class="action-btn" onclick="saveData()">Save</button>

      <div class="saved-list" id="saved-list">
        <!-- Saved items go here -->
      </div>
    </div>
  </div>

  <script>
    window.HARDCODED_DATA = null;

    let db = null;
    let currentEditId = null;
    let activeChatId = null;
    let currentChatMessages = [];
    let allSavedChats = [];
    let isGenerating = false;
    let stopGeneration = false;

    function init() {
      initIndexedDB();
    }

    function initIndexedDB() {
      const request = indexedDB.open("ChatDEDB", 2);
      request.onupgradeneeded = (e) => {
        db = e.target.result;
        if (!db.objectStoreNames.contains("knowledge")) {
          db.createObjectStore("knowledge", { keyPath: "id", autoIncrement: true });
        }
        if (!db.objectStoreNames.contains("chats")) {
          db.createObjectStore("chats", { keyPath: "id" });
        }
      };
      request.onsuccess = (e) => {
        db = e.target.result;
        loadSavedData();
        loadChatHistory();
      };
    }

    document.getElementById('btn-plus').onclick = () => openModal('main-menu');

    function openDrawer() {
      document.getElementById('drawer-overlay').style.display = 'block';
      loadChatHistory();
    }

    function closeDrawer() {
      document.getElementById('drawer-overlay').style.display = 'none';
      closeSettingsDrawer();
    }

    function openSettingsDrawer() {
      document.getElementById('settings-drawer').classList.add('open');
    }

    function closeSettingsDrawer() {
      document.getElementById('settings-drawer').classList.remove('open');
    }

    function openModal(id) {
      document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
      document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
      if(id === 'data-modal') resetDataForm();
    }

    function setTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      closeSettingsDrawer();
      closeDrawer();
    }

    function addTitleField(value = "") {
      const container = document.getElementById('title-container');
      const div = document.createElement('div');
      div.className = 'title-field-group';
      div.style.marginTop = "5px";
      div.innerHTML = `
        <input type="text" class="form-control title-input" value="${value}" placeholder="Title or Question">
        <button class="btn-add-q" onclick="this.parentElement.remove()">
          <svg class="btn-icon" viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      `;
      container.appendChild(div);
    }

    function resetDataForm() {
      currentEditId = null;
      document.getElementById('data-modal-title').innerText = "Add Data";
      document.getElementById('title-container').innerHTML = `
        <div class="title-field-group">
          <input type="text" class="form-control title-input" placeholder="Title or Question">
          <button class="btn-add-q" onclick="addTitleField()">Add Q</button>
        </div>
      `;
      document.getElementById('about-input').value = "";
    }

    function openDataModal() {
      resetDataForm();
      openModal('data-modal');
      loadSavedData();
    }

    function getAllData(callback) {
      if (window.HARDCODED_DATA) {
        callback(window.HARDCODED_DATA);
        return;
      }
      if (!db) return;
      const tx = db.transaction("knowledge", "readonly");
      const store = tx.objectStore("knowledge");
      const req = store.getAll();
      req.onsuccess = () => callback(req.result);
    }

    function saveData() {
      const titleInputs = document.querySelectorAll('.title-input');
      const titles = Array.from(titleInputs).map(i => i.value.trim()).filter(v => v !== "");
      const about = document.getElementById('about-input').value.trim();

      if (titles.length === 0 || !about) {
        alert("Please fill titles and content.");
        return;
      }

      const record = { titles, about };

      if (window.HARDCODED_DATA) {
        if (currentEditId !== null) {
          window.HARDCODED_DATA[currentEditId] = record;
        } else {
          window.HARDCODED_DATA.push(record);
        }
        renderSavedListUI(window.HARDCODED_DATA);
        resetDataForm();
        return;
      }

      const tx = db.transaction("knowledge", "readwrite");
      const store = tx.objectStore("knowledge");

      if (currentEditId !== null) {
        record.id = currentEditId;
        store.put(record);
      } else {
        store.add(record);
      }

      tx.oncomplete = () => {
        resetDataForm();
        loadSavedData();
      };
    }

    function loadSavedData() {
      getAllData((data) => renderSavedListUI(data));
    }

    function renderSavedListUI(data) {
      const listEl = document.getElementById('saved-list');
      listEl.innerHTML = "";
      data.forEach((item, index) => {
        const id = item.id !== undefined ? item.id : index;
        const div = document.createElement('div');
        div.className = 'saved-item';
        div.innerHTML = `
          <span>${item.titles[0]} (${item.titles.length} Qs)</span>
          <div class="saved-item-actions">
            <button onclick="editData(${id})" class="btn-icon">
              <svg viewBox="0 0 24 24" style="width:16px;height:16px;"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            </button>
            <button onclick="deleteData(${id})" class="btn-icon">
              <svg viewBox="0 0 24 24" style="width:16px;height:16px;"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            </button>
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    function editData(id) {
      getAllData((data) => {
        const item = window.HARDCODED_DATA ? data[id] : data.find(i => i.id === id);
        if (!item) return;

        currentEditId = id;
        document.getElementById('data-modal-title').innerText = "Edit Data";
        
        const container = document.getElementById('title-container');
        container.innerHTML = "";
        item.titles.forEach((t, idx) => {
          if (idx === 0) {
            container.innerHTML += `
              <div class="title-field-group">
                <input type="text" class="form-control title-input" value="${t}" placeholder="Title or Question">
                <button class="btn-add-q" onclick="addTitleField()">Add Q</button>
              </div>`;
          } else {
            addTitleField(t);
          }
        });

        document.getElementById('about-input').value = item.about;
      });
    }

    function deleteData(id) {
      if (window.HARDCODED_DATA) {
        window.HARDCODED_DATA.splice(id, 1);
        renderSavedListUI(window.HARDCODED_DATA);
        return;
      }
      const tx = db.transaction("knowledge", "readwrite");
      tx.objectStore("knowledge").delete(id);
      tx.oncomplete = () => loadSavedData();
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') handleSearchClick();
    }

    function handleSearchClick() {
      if (isGenerating) {
        stopGeneration = true;
      } else {
        processQuery();
      }
    }

    function toggleSearchIcon(state) {
      const searchIcon = document.getElementById('icon-search');
      const stopIcon = document.getElementById('icon-stop');

      searchIcon.style.display = 'none';
      stopIcon.style.display = 'none';

      if (state === 'stop') {
        isGenerating = true;
        stopIcon.style.display = 'block';
      } else {
        isGenerating = false;
        searchIcon.style.display = 'block';
      }
    }

    function processQuery() {
      const inputEl = document.getElementById('query-input');
      const text = inputEl.value.trim();
      if (!text) return;

      if (!activeChatId) {
        activeChatId = Date.now().toString();
      }

      appendMessage(text, 'user');
      currentChatMessages.push({ text, sender: 'user' });
      inputEl.value = '';

      if (text.toLowerCase() === 'app download') {
        generateStandaloneApp();
        saveCurrentChat();
        return;
      }

      executeQuery(text);
    }

    function executeQuery(text) {
      toggleSearchIcon('stop');
      stopGeneration = false;

      getAllData((allData) => {
        const matchedParagraphs = findMatchingData(text, allData);
        let responseHTML = "";
        if (matchedParagraphs.length > 0) {
          responseHTML = matchedParagraphs.map(p => `<p>${p}</p>`).join('');
        } else {
          responseHTML = "<p>No matching information found.</p>";
        }
        appendGeminiAnimatedMessage(responseHTML, () => {
          currentChatMessages.push({ text: responseHTML, sender: 'ai' });
          saveCurrentChat();
          toggleSearchIcon('search');
        });
      });
    }

    /* Direct Exact & Multi-Topic Extraction Logic */
    function findMatchingData(userInput, dataList) {
      const cleanInput = userInput.trim().toLowerCase();
      
      // Stop/filler words list
      const fillerWords = new Set(["and", "or", "&", "aur", "evam", "tatha", "vs", "versus", "with"]);

      // Tokenize user query to extract multi-topic queries
      const tokens = cleanInput.split(/[\s,]+/).filter(t => t.length > 0);

      const matchedSet = new Set();
      const results = [];

      dataList.forEach(item => {
        let isMatched = false;

        item.titles.forEach(title => {
          const cleanTitle = title.trim().toLowerCase();

          // 1. Direct Exact Match (e.g. "google search" matches exact "google search")
          if (cleanTitle === cleanInput) {
            isMatched = true;
          }

          // 2. Direct Sub-topic / Word Sequence Match for Multi-Queries
          if (!isMatched) {
            // Check if title is explicitly present as an independent phrase or word in the user input
            const regex = new RegExp(`\\b${cleanTitle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i');
            if (regex.test(cleanInput)) {
              isMatched = true;
            }
          }
        });

        if (isMatched && !matchedSet.has(item.about)) {
          matchedSet.add(item.about);
          results.push(item.about);
        }
      });

      return results;
    }

    function appendMessage(content, sender) {
      const container = document.getElementById('chat-container');
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.innerHTML = content;
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
      return msg;
    }

    /* Typing Animation */
    function appendGeminiAnimatedMessage(fullHTML, onComplete) {
      const container = document.getElementById('chat-container');
      const msg = document.createElement('div');
      msg.className = 'message ai';
      
      const contentEl = document.createElement('div');
      contentEl.className = 'gemini-content';
      msg.appendChild(contentEl);
      
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;

      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = fullHTML;
      const textContent = tempDiv.innerText || tempDiv.textContent;
      const words = textContent.split(' ');

      let currentIndex = 0;

      function typeChunk() {
        if (stopGeneration) {
          contentEl.innerHTML = words.slice(0, currentIndex).join(' ') + '...';
          addMsgActions(msg, contentEl.innerText);
          if (onComplete) onComplete();
          return;
        }

        if (currentIndex < words.length) {
          let chunkSize = Math.floor(Math.random() * 3) + 2; 
          currentIndex = Math.min(words.length, currentIndex + chunkSize);
          contentEl.innerText = words.slice(0, currentIndex).join(' ');
          container.scrollTop = container.scrollHeight;
          setTimeout(typeChunk, Math.floor(Math.random() * 40) + 30);
        } else {
          contentEl.innerHTML = fullHTML;
          addMsgActions(msg, textContent);
          if(onComplete) onComplete();
        }
      }

      setTimeout(typeChunk, 150);
    }

    /* Action Buttons: Copy & Save */
    function addMsgActions(msgContainer, textToCopy) {
      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'msg-actions';
      
      const actionId = 'msg-act-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4);
      actionsDiv.setAttribute('id', actionId);
      actionsDiv.dataset.text = textToCopy;

      actionsDiv.innerHTML = `
        <button class="msg-action-btn" title="Copy" onclick="copyTextFromElement('${actionId}')">
          <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        </button>
        <button class="msg-action-btn" title="Save File" onclick="saveTextFileFromElement('${actionId}')">
          <svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .58l2.59-2.58L17 11.41l-5 5-5-5 1.41-1.41L11 12.58V3h2v9.58z"/></svg>
        </button>
      `;
      msgContainer.appendChild(actionsDiv);
    }

    function copyTextFromElement(actionId) {
      const el = document.getElementById(actionId);
      if (!el) return;
      const text = el.dataset.text;
      
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => alert("Copied!")).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        alert("Copied!");
      } catch (err) {
        alert("Failed to copy.");
      }
      document.body.removeChild(textArea);
    }

    function saveTextFileFromElement(actionId) {
      const el = document.getElementById(actionId);
      if (!el) return;
      const text = el.dataset.text;
      const blob = new Blob([text], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "ChatDE_Response.txt";
      a.click();
      URL.revokeObjectURL(url);
    }

    /* Chat History Management */
    function startNewChat() {
      activeChatId = null;
      currentChatMessages = [];
      document.getElementById('chat-container').innerHTML = '';
      toggleSearchIcon('search');
      closeDrawer();
    }

    function saveCurrentChat() {
      if (!db || !activeChatId || currentChatMessages.length === 0) return;
      
      const title = currentChatMessages[0].text.slice(0, 25) + "...";
      const dateStr = new Date().toLocaleDateString();

      const chatRecord = {
        id: activeChatId,
        title: title,
        date: dateStr,
        messages: currentChatMessages
      };

      const tx = db.transaction("chats", "readwrite");
      tx.objectStore("chats").put(chatRecord);
      tx.oncomplete = () => loadChatHistory();
    }

    function loadChatHistory() {
      if (!db) return;
      const tx = db.transaction("chats", "readonly");
      const store = tx.objectStore("chats");
      const req = store.getAll();
      req.onsuccess = () => {
        allSavedChats = req.result;
        renderHistoryList(allSavedChats);
      };
    }

    function renderHistoryList(chats) {
      const listEl = document.getElementById('history-list');
      listEl.innerHTML = "";
      chats.forEach(chat => {
        const div = document.createElement('div');
        div.className = 'chat-history-item';
        div.onclick = () => openSavedChat(chat.id);
        div.innerHTML = `
          <span>${chat.title}</span>
          <div style="position:relative;">
            <button class="btn-icon" onclick="toggleChatMenu(event, '${chat.id}')">
              <svg viewBox="0 0 24 24" style="width:16px;height:16px;"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
            <div class="chat-action-menu" id="menu-${chat.id}">
              <button onclick="renameChat(event, '${chat.id}')">Edit</button>
              <button onclick="deleteChat(event, '${chat.id}')">Delete</button>
            </div>
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    function toggleChatMenu(e, id) {
      e.stopPropagation();
      document.querySelectorAll('.chat-action-menu').forEach(m => m.style.display = 'none');
      const menu = document.getElementById(`menu-${id}`);
      if (menu) menu.style.display = 'block';
    }

    document.addEventListener('click', () => {
      document.querySelectorAll('.chat-action-menu').forEach(m => m.style.display = 'none');
    });

    function openSavedChat(id) {
      const chat = allSavedChats.find(c => c.id === id);
      if (!chat) return;
      activeChatId = chat.id;
      currentChatMessages = chat.messages || [];
      const container = document.getElementById('chat-container');
      container.innerHTML = '';
      currentChatMessages.forEach(msg => {
        if(msg.sender === 'user') {
          appendMessage(msg.text, msg.sender);
        } else {
          const msgEl = appendMessage(msg.text, msg.sender);
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = msg.text;
          addMsgActions(msgEl, tempDiv.innerText || tempDiv.textContent);
        }
      });
      closeDrawer();
    }

    function renameChat(e, id) {
      e.stopPropagation();
      const chat = allSavedChats.find(c => c.id === id);
      if (!chat) return;
      const newName = prompt("Edit Chat Name:", chat.title);
      if (newName && newName.trim()) {
        chat.title = newName.trim();
        const tx = db.transaction("chats", "readwrite");
        tx.objectStore("chats").put(chat);
        tx.oncomplete = () => loadChatHistory();
      }
    }

    function deleteChat(e, id) {
      e.stopPropagation();
      if (!db) return;
      const tx = db.transaction("chats", "readwrite");
      tx.objectStore("chats").delete(id);
      tx.oncomplete = () => {
        if (activeChatId === id) startNewChat();
        loadChatHistory();
      };
    }

    function openSearchChatModal() {
      closeDrawer();
      openModal('search-chat-modal');
      renderSearchResults(allSavedChats);
    }

    function filterChats() {
      const query = document.getElementById('search-chat-input').value.toLowerCase();
      const filtered = allSavedChats.filter(c => c.title.toLowerCase().includes(query));
      renderSearchResults(filtered);
    }

    function renderSearchResults(chats) {
      const listEl = document.getElementById('search-results-list');
      listEl.innerHTML = "";
      chats.forEach(chat => {
        const div = document.createElement('div');
        div.className = 'search-chat-item';
        div.onclick = () => {
          openSavedChat(chat.id);
          closeModal('search-chat-modal');
        };
        div.innerHTML = `
          <div style="font-weight:bold;">${chat.title}</div>
          <div class="date">Used on: ${chat.date}</div>
        `;
        listEl.appendChild(div);
      });
    }

    function generateStandaloneApp() {
      getAllData((data) => {
        const cloneRoot = document.documentElement.cloneNode(true);
        const cloneChat = cloneRoot.querySelector('#chat-container');
        if (cloneChat) cloneChat.innerHTML = '';
        const cloneInput = cloneRoot.querySelector('#query-input');
        if (cloneInput) cloneInput.value = '';

        let currentHTML = cloneRoot.outerHTML;

        const cleanData = data.map(({titles, about}) => ({titles, about}));
        const injectionScript = `window.HARDCODED_DATA = ${JSON.stringify(cleanData)};`;
        
        currentHTML = currentHTML.replace("window.HARDCODED_DATA = null;", injectionScript);

        const blob = new Blob([currentHTML], { type: "text/html" });
        const url = URL.createObjectURL(blob);

        const cardHTML = `
          <div class="download-card">
            <p><strong>Standalone App Ready</strong></p>
            <p style="font-size: 12px; margin-top:5px;">All data is bundled directly inside the app file.</p>
            <a href="${url}" download="ChatDE_Standalone.html">
              <button class="btn-download">Download App</button>
            </a>
          </div>
        `;
        appendMessage(cardHTML, 'ai');
      });
    }

    window.onload = init;
  </script>
</body>
