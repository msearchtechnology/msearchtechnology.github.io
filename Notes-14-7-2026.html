<html>
        <head><title>Downloaded HTML</title></head>
        <body>
            <pre style="white-space: pre-wrap; word-wrap: break-word;"><!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>AiFriend - Decentralized Wall</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #postsList { margin-top: 20px; border-top: 1px solid #ccc; }
        .post { background: #f4f4f4; padding: 10px; margin: 5px 0; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>AiFriend Wall</h1>
    <input type="text" id="postInput" placeholder="कुछ लिखें...">
    <button onclick="postData()">पोस्ट करें</button>

    <div id="postsList"></div>

    <!-- GunDB Library Load -->
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>

    <script>
        // GunDB को इनिशियलाइज़ करें
        const gun = Gun(['https://peer.gun.eco/gun']);
        const posts = gun.get('posts'); // डेटा का नोड 'posts'

        // पोस्ट सेव करने का फंक्शन
        function postData() {
            const input = document.getElementById('postInput');
            if (input.value.trim() !== "") {
                posts.set({ content: input.value, time: new Date().toLocaleTimeString() });
                input.value = ""; // इनपुट क्लियर करें
            }
        }

        // डेटा को रियल-टाइम में सुनने का फंक्शन (जैसे ही कोई पोस्ट करेगा, ये अपडेट होगा)
        posts.map().on((data) => {
            if (data) {
                const list = document.getElementById('postsList');
                const div = document.createElement('div');
                div.className = 'post';
                div.innerHTML = `<strong>${data.time}:</strong> ${data.content}`;
                list.prepend(div); // नयी पोस्ट सबसे ऊपर
            }
        });
    </script>
</body>
</html>
</pre>
        </body>
