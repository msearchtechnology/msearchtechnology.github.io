<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Custom Data Transformer App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>আমার / My Transformer AI App</h2>
        <p>अपने डेटा या सवाल को नीचे दर्ज करें:</p>
        
        <textarea id="dataInput" placeholder="अपना डेटा या टेक्स्ट यहाँ लिखें (जैसे: AI is amazing because...)"></textarea>
        <button id="generateBtn">জেনरेट करें (Generate)</button>
        
        <div id="status" class="status">मॉडल लोड हो रहा है, कृपया प्रतीक्षा करें...</div>
        <h3>आउटपुट (Output):</h3>
        <div id="output" class="output-box"></div>
    </div>

    <!-- JavaScript कोड फाइल -->
    <script type="module" src="app.js"></script>
</body>
</html>
