<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatMPT - Multi Model System</title>
  <style>
:root{
  --bg-color:#ffffff;
  --text-color:#000000;
  --card-bg:#f5f5f5;
  --border-color:#e5e5e5;
  --input-bg:#f0f0f0;
  --user-msg-bg:#f0f0f0;
  --icon-color:#000000;
  --button-bg:#ffffff;
  --button-fg:#000000;
  --menu-bg:#ffffff;
  --shadow:0 8px 30px rgba(0,0,0,.08);
}
[data-theme="dark"]{
  --bg-color:#000000;
  --text-color:#ffffff;
  --card-bg:#121212;
  --border-color:#2a2a2a;
  --input-bg:#1a1a1a;
  --user-msg-bg:#1a1a1a;
  --icon-color:#ffffff;
  --button-bg:#121212;
  --button-fg:#ffffff;
  --menu-bg:#121212;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html,body{height:100%;background:var(--bg-color)}
body{background:var(--bg-color);color:var(--text-color);height:100dvh;width:100vw;margin:0;position:relative;overflow:hidden;transition:background-color .2s,color .2s}

header{
  height:80px;
  padding:14px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:fixed;
  top:0; left:0; right:0;
  z-index:20;
  background:transparent;
  pointer-events:none;
}
.header-left, .header-right { pointer-events:auto; display:flex; align-items:center; gap:12px; }

.menu-circle-btn{
  width:52px; height:52px;
  border-radius:50%;
  border:1px solid var(--border-color);
  background:var(--button-bg);
  color:var(--button-fg);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
  transition:transform .12s ease;
  padding:0;
}
.menu-circle-btn:active{transform:scale(.94)}
.menu-lines-custom{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; width:22px; }
.menu-line-top{width:22px;height:3px;background:currentColor;border-radius:2px;}
.menu-line-bottom{width:14px;height:3px;background:currentColor;border-radius:2px;}

/* Pure Transparent Model Selector (No Box, No Floating Box) */
.model-selector-pill {
  position: relative;
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  padding: 4px 8px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-color);
}
.model-dropdown-menu {
  position: absolute;
  top: 45px;
  left: 0;
  background: var(--menu-bg);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  box-shadow: var(--shadow);
  width: 220px;
  display: none;
  z-index: 150;
  padding: 8px;
}
.model-dropdown-menu.open { display: block; }
.model-dropdown-section-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  opacity: 0.5;
  padding: 6px 8px 4px;
  font-weight: 800;
}
.model-dropdown-item {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.model-dropdown-item:hover { background: var(--card-bg); }

.action-pill-cluster{
  display:flex; align-items:center;
  background:var(--button-bg);
  padding:6px 8px; border-radius:30px;
  border:1px solid var(--border-color);
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}
.pill-btn{
  width:46px; height:44px;
  background:transparent; border:0;
  color:var(--button-fg);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; border-radius:22px;
}
.pill-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#chat-container{
  flex:1; height:100dvh;
  overflow-y:auto;
  padding:95px 20px 150px;
  display:flex; flex-direction:column; gap:20px;
  scroll-behavior:smooth;
}
#chat-container::-webkit-scrollbar{width:6px}
#chat-container::-webkit-scrollbar-thumb{background:rgba(127,127,127,.25);border-radius:10px}
.message{max-width:min(820px,90%);font-size:15px;line-height:1.6;word-wrap:break-word}
.message.user{align-self:flex-end;background:var(--user-msg-bg);padding:12px 18px;border-radius:22px 22px 4px 22px;color:var(--text-color)}
.message.ai{align-self:center;width:min(820px,100%);max-width:min(820px,100%);margin-top:2px;color:var(--text-color)}

/* Highlighting Engine */
.highlight-keyword{
  background-color:transparent;
  color:var(--text-color);
  font-weight:900;
  font-size:1.05em;
}

.msg-actions{display:flex;align-items:center;gap:8px;margin-top:10px}
.msg-action-btn{
  background:transparent; border:1px solid transparent;
  cursor:pointer; padding:6px; display:inline-flex;
  align-items:center; justify-content:center;
  color:var(--icon-color); opacity:.75; border-radius:50%;
}
.msg-action-btn:hover{opacity:1;background:var(--card-bg);border-color:var(--border-color)}
.msg-action-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;}

.input-bar{
  position:fixed; left:0; right:0; bottom:0;
  z-index:30; padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));
  background:transparent; pointer-events:none;
}
.input-wrapper{
  pointer-events:auto; width:min(840px,100%); margin:0 auto;
  display:flex; align-items:flex-end;
  border:1px solid var(--border-color); border-radius:28px;
  padding:8px 10px 8px 16px; background:var(--input-bg);
  box-shadow:0 6px 24px rgba(0,0,0,.15);
}
.btn-icon-plus{
  background:transparent; border:0; cursor:pointer; color:var(--text-color);
  display:flex; align-items:center; justify-content:center;
  padding:8px; border-radius:50%; opacity:.8; margin-bottom:2px;
}
.btn-icon-plus svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;}

.input-wrapper textarea{
  flex:1; border:0; background:transparent; outline:none;
  font-size:16px; padding:8px 12px; color:var(--text-color);
  min-width:0; resize:none; max-height:160px; height:40px; line-height:1.4;
}
.btn-search{
  background:var(--button-fg); color:var(--bg-color);
  border:0; width:44px; height:44px; border-radius:50%;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  flex-shrink:0; margin-bottom:1px;
}
.btn-search svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;}

.modal-overlay,.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:100}
.modal-overlay{justify-content:center;align-items:center}
.drawer{position:absolute;top:0;left:0;width:86%;max-width:360px;height:100%;background:var(--bg-color);border-right:1px solid var(--border-color);display:flex;flex-direction:column;padding:20px;gap:12px;box-shadow:var(--shadow)}
.settings-drawer{position:absolute;top:0;left:-100%;width:86%;max-width:360px;height:100%;background:var(--bg-color);border-right:1px solid var(--border-color);display:flex;flex-direction:column;padding:20px;gap:12px;z-index:101;transition:left .25s ease;overflow-y:auto;}
.settings-drawer.open{left:0}
.modal{background:var(--bg-color);border:1px solid var(--border-color);border-radius:22px;width:92%;max-width:480px;padding:20px;box-shadow:var(--shadow);max-height:90vh;overflow-y:auto;}
.modal-header{font-size:18px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.menu-item{padding:16px 18px;border:1px solid var(--border-color);border-radius:14px;cursor:pointer;font-weight:600;font-size:16px;display:flex;align-items:center;gap:12px;background:var(--card-bg)}

.history-section{flex:1;display:flex;flex-direction:column;overflow:hidden;margin-top:8px}
.history-title{font-size:13px;font-weight:700;margin:4px 6px 8px;opacity:.6;text-transform:uppercase;}
.history-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}

.chat-history-item{
  position:relative; display:flex; justify-content:space-between; align-items:center;
  padding:12px 14px; border-radius:12px; cursor:pointer; font-size:15px;
}
.chat-history-item:hover{background:var(--card-bg)}
.chat-history-item span.chat-title-text{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; flex:1; }

.form-control{width:100%;padding:10px 12px;border:1px solid var(--border-color);border-radius:10px;background:var(--input-bg);color:var(--text-color);outline:0;font-size:14px;margin-bottom:8px;}
textarea.form-control{resize:vertical;height:80px}
.btn-small{background:var(--card-bg);border:1px solid var(--border-color);color:var(--text-color);padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:700;font-size:12px;}
.saved-list{max-height:200px;overflow-y:auto;margin-top:12px;border-top:1px solid var(--border-color);padding-top:10px}
.saved-item{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--card-bg);margin-bottom:6px;border-radius:10px;font-size:14px;}
.action-btn{width:100%;padding:12px;background:var(--button-fg);color:var(--bg-color);border:0;border-radius:12px;font-weight:700;cursor:pointer;margin-top:10px;font-size:15px}

.kv-row { display: flex; gap: 8px; margin-bottom: 8px; }
.kv-row input { margin-bottom: 0; }

.builder-controls { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }

#toast-notification{
  position:fixed;bottom:95px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;border-radius:24px;
  font-size:14px;z-index:200;display:none;opacity:0;transition:opacity .2s;
}
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <button class="menu-circle-btn" onclick="openDrawer()" aria-label="Menu">
        <div class="menu-lines-custom">
          <span class="menu-line-top"></span>
          <span class="menu-line-bottom"></span>
        </div>
      </button>
      
      <!-- Transparent Model Selector Header -->
      <div class="model-selector-pill" onclick="toggleModelDropdown(event)">
        <span id="current-model-display"></span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        <div class="model-dropdown-menu" id="model-dropdown-menu">
          <div class="model-dropdown-section-title"></div>
          <div id="system-models-dropdown-list"></div>
          <div class="model-dropdown-section-title" style="margin-top:6px;">
            </div>
          <div id="custom-models-dropdown-list"></div>
        </div>
      </div>
    </div>
    
    <div class="header-right">
      <div class="action-pill-cluster">
        <button class="pill-btn" onclick="startNewChat()" aria-label="New Chat">
          <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="chat-container"></main>

  <div class="input-bar">
    <div class="input-wrapper">
      <button class="btn-icon-plus" id="btn-plus" onclick="openModal('main-menu')">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <textarea id="query-input" placeholder="Ask anything..." rows="1" oninput="autoResizeTextarea(this)"></textarea>
      
      <button class="btn-search" id="action-btn" onclick="handleSearchClick()">
        <svg id="icon-search" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        <svg id="icon-stop" viewBox="0 0 24 24" style="display:none;"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <!-- Main Drawer -->
  <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()">
    <div class="drawer" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span>ChatMPT</span>
        <button class="btn-icon-plus" onclick="closeDrawer()">
          <svg viewBox="0 0 24 24" style="width:20px;height:20px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="menu-item" onclick="startNewChat()"><span>New Chat</span></div>
      <div class="history-section">
        <div class="history-title">Recent Chats</div>
        <div class="history-list" id="history-list"></div>
      </div>
      <div class="menu-item" style="margin-top: auto;" onclick="openSettingsDrawer()"><span>Settings</span></div>
    </div>

    <div class="settings-drawer" id="settings-drawer" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span>Settings</span>
        <button class="btn-icon-plus" onclick="closeSettingsDrawer()">
          <svg viewBox="0 0 24 24" style="width:20px;height:20px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="menu-item" onclick="setTheme('light')">Light Theme</div>
      <div class="menu-item" onclick="setTheme('dark')">Dark Theme</div>
      <div class="menu-item" onclick="openModelManagerModal()">Add / Edit Model</div>
    </div>
  </div>

  <!-- Main Menu Modal -->
  <div class="modal-overlay" id="main-menu">
    <div class="modal">
      <div class="modal-header">
        <span>Options</span>
        <button class="btn-icon-plus" onclick="closeModal('main-menu')">
          <svg viewBox="0 0 24 24" style="width:20px;height:20px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="menu-item" onclick="openSystemDataModal()">System Model Data Engine</div>
      <div class="menu-item" style="margin-top:8px;" onclick="openCustomModelModal()">Custom Model Builder</div>
    </div>
  </div>

  <!-- System Model Data Engine Modal -->
  <div class="modal-overlay" id="system-data-modal">
    <div class="modal">
      <div class="modal-header">
        <span id="system-data-modal-title">System Model Data</span>
        <button class="btn-icon-plus" onclick="closeModal('system-data-modal')">
          <svg viewBox="0 0 24 24" style="width:20px;height:20px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <input type="text" class="form-control" id="system-title-input" placeholder="Title (e.g., Google)">
      <textarea id="system-about-input" class="form-control" placeholder="About / Content..."></textarea>
      <button class="action-btn" onclick="saveSystemData()">Save Data</button>
      
      <div class="saved-list" id="system-saved-list"></div>
    </div>
  </div>

  <!-- Custom Model Modal -->
  <div class="modal-overlay" id="custom-model-modal">
    <div class="modal">
      <div class="modal-header">
        <span id="custom-model-modal-title">Custom Model Builder</span>
        <button class="btn-icon-plus" onclick="closeModal('custom-model-modal')">
          <svg viewBox="0 0 24 24" style="width:20px;height:20px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <input type="text" class="form-control" id="custom-model-name-input" placeholder="Model Name">
      <input type="text" class="form-control" id="custom-model-desc-input" placeholder="Short Description">
      
      <!-- Multi-Title Section (+Q) -->
      <div style="margin-top:10px; border:1px solid var(--border-color); padding:10px; border-radius:10px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <strong style="font-size:13px;">Titles / Questions</strong>
          <button class="btn-small" onclick="addCustomTitleField()">+ Q</button>
        </div>
        <div id="custom-titles-container"></div>
      </div>

      <!-- Dynamic Blocks Container -->
      <div id="custom-blocks-container" style="margin-top:10px;"></div>

      <div class="builder-controls">
        <button class="btn-small" onclick="addKeyValBlock()">+ Add Key-Value</button>
        <button class="btn-small" onclick="addAboutBlock()">+ Add About</button>
      </div>

      <button class="action-btn" onclick="saveCustomModel()">Save Custom Model</button>
    </div>
  </div>

  <!-- Model Management Modal -->
  <div class="modal-overlay" id="model-manager-modal">
    <div class="modal">
      <div class="modal-header">
        <span>Manage Models</span>
        <button class="btn-icon-plus" onclick="closeModal('model-manager-modal')">
          <svg viewBox="0 0 24 24" style="width:20px;height:20px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      
      <div style="margin-bottom:12px;">
        <strong style="font-size:14px;">System Model</strong>
        <div id="system-model-mgr-item" class="saved-item" style="margin-top:6px;"></div>
      </div>

      <div>
        <strong style="font-size:14px;">Custom Models</strong>
        <button class="btn-small" style="float:right;" onclick="openCustomModelModal()">+ New</button>
        <div class="saved-list" id="custom-models-mgr-list"></div>
      </div>
    </div>
  </div>

  <div id="toast-notification">Notification</div>

  <script>
    let db = null;
    let currentSystemDataEditId = null;
    let currentCustomModelEditId = null;
    let activeChatId = null;
    let currentChatMessages = [];
    let allSavedChats = [];
    let isGenerating = false;
    let stopGeneration = false;
    
    // Active Selected Model State (Default: None selected)
    let activeSelectedModel = { type: null, id: null, name: "Select Model" };
    let systemModelName = "System Model";

    function init() {
      const savedTheme = localStorage.getItem('chatmpt_theme') || 'dark';
      setTheme(savedTheme, false);
      initIndexedDB();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast-notification');
      toast.innerText = msg; toast.style.display = 'block'; toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.style.display = 'none', 200); }, 1800);
    }

    function initIndexedDB() {
      const request = indexedDB.open("ChatmptDB_v4", 1);
      request.onupgradeneeded = (e) => {
        db = e.target.result;
        if (!db.objectStoreNames.contains("system_knowledge")) db.createObjectStore("system_knowledge", { keyPath: "id", autoIncrement: true });
        if (!db.objectStoreNames.contains("custom_models")) db.createObjectStore("custom_models", { keyPath: "id", autoIncrement: true });
        if (!db.objectStoreNames.contains("chats")) db.createObjectStore("chats", { keyPath: "id" });
        if (!db.objectStoreNames.contains("settings")) db.createObjectStore("settings", { keyPath: "key" });
      };
      request.onsuccess = (e) => {
        db = e.target.result;
        loadSettings();
        loadSystemDataList();
        loadChatHistory();
        refreshModelDropdowns();
      };
    }

    function loadSettings() {
      const tx = db.transaction("settings", "readonly");
      const req = tx.objectStore("settings").get("system_model_name");
      req.onsuccess = () => {
        if (req.result) systemModelName = req.result.value;
        refreshModelDropdowns();
      };
    }

    function saveSetting(key, value) {
      const tx = db.transaction("settings", "readwrite");
      tx.objectStore("settings").put({ key, value });
    }

    function openDrawer() { document.getElementById('drawer-overlay').style.display = 'block'; loadChatHistory(); }
    function closeDrawer() { document.getElementById('drawer-overlay').style.display = 'none'; closeSettingsDrawer(); }
    function openSettingsDrawer() { document.getElementById('settings-drawer').classList.add('open'); }
    function closeSettingsDrawer() { document.getElementById('settings-drawer').classList.remove('open'); }

    function openModal(id) {
      document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
      document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
      if(id === 'system-data-modal') resetSystemDataForm();
      if(id === 'custom-model-modal') resetCustomModelForm();
    }

    function setTheme(theme, save = true) {
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      else document.documentElement.removeAttribute('data-theme');
      if (save) localStorage.setItem('chatmpt_theme', theme);
      closeSettingsDrawer(); closeDrawer();
    }

    function toggleModelDropdown(e) {
      e.stopPropagation();
      document.getElementById('model-dropdown-menu').classList.toggle('open');
    }

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.model-selector-pill')) document.getElementById('model-dropdown-menu').classList.remove('open');
    });

    function selectModel(type, id, name) {
      activeSelectedModel = { type, id, name };
      document.getElementById('current-model-display').innerText = name;
      document.getElementById('model-dropdown-menu').classList.remove('open');
      showToast("Selected: " + name);
    }

    function refreshModelDropdowns() {
      if (!db) return;
      
      // Render System Model in Dropdown
      const sysContainer = document.getElementById('system-models-dropdown-list');
      sysContainer.innerHTML = `
        <div class="model-dropdown-item" onclick="selectModel('system', 'sys', '${systemModelName}')">
          <span>${systemModelName}</span>
        </div>`;

      // Render Custom Models
      const tx = db.transaction("custom_models", "readonly");
      const req = tx.objectStore("custom_models").getAll();
      req.onsuccess = () => {
        const customContainer = document.getElementById('custom-models-dropdown-list');
        customContainer.innerHTML = "";
        req.result.forEach(m => {
          const item = document.createElement('div');
          item.className = 'model-dropdown-item';
          item.innerHTML = `<span>${m.name}</span>`;
          item.onclick = () => selectModel('custom', m.id, m.name);
          customContainer.appendChild(item);
        });
      };
    }

    /* --- System Model Data Engine --- */
    function openSystemDataModal() {
      closeModal('main-menu');
      resetSystemDataForm();
      openModal('system-data-modal');
      loadSystemDataList();
    }

    function resetSystemDataForm() {
      currentSystemDataEditId = null;
      document.getElementById('system-data-modal-title').innerText = "System Model Data Engine";
      document.getElementById('system-title-input').value = "";
      document.getElementById('system-about-input').value = "";
    }

    function saveSystemData() {
      const title = document.getElementById('system-title-input').value.trim();
      const about = document.getElementById('system-about-input').value.trim();
      if (!title || !about) { alert("Please fill Title and About fields."); return; }

      const record = { title, about };
      const tx = db.transaction("system_knowledge", "readwrite");
      const store = tx.objectStore("system_knowledge");
      if (currentSystemDataEditId !== null) record.id = currentSystemDataEditId;
      store.put(record);
      tx.oncomplete = () => { resetSystemDataForm(); loadSystemDataList(); showToast("System data saved!"); };
    }

    function loadSystemDataList() {
      if (!db) return;
      const tx = db.transaction("system_knowledge", "readonly");
      const req = tx.objectStore("system_knowledge").getAll();
      req.onsuccess = () => {
        const listEl = document.getElementById('system-saved-list');
        listEl.innerHTML = "";
        req.result.forEach(item => {
          const div = document.createElement('div');
          div.className = 'saved-item';
          div.innerHTML = `<span>${item.title}</span><div><button class="btn-small" onclick="editSystemData(${item.id})">Edit</button> <button class="btn-small" onclick="deleteSystemData(${item.id})">Del</button></div>`;
          listEl.appendChild(div);
        });
      };
    }

    function editSystemData(id) {
      const tx = db.transaction("system_knowledge", "readonly");
      const req = tx.objectStore("system_knowledge").get(id);
      req.onsuccess = () => {
        const item = req.result; if (!item) return;
        currentSystemDataEditId = item.id;
        document.getElementById('system-data-modal-title').innerText = "Edit System Data";
        document.getElementById('system-title-input').value = item.title;
        document.getElementById('system-about-input').value = item.about;
      };
    }

    function deleteSystemData(id) {
      if (confirm("Delete this system data?")) {
        const tx = db.transaction("system_knowledge", "readwrite");
        tx.objectStore("system_knowledge").delete(id);
        tx.oncomplete = () => loadSystemDataList();
      }
    }

    /* --- Custom Model Builder Logic --- */
    function openCustomModelModal() {
      closeModal('main-menu');
      closeModal('model-manager-modal');
      resetCustomModelForm();
      openModal('custom-model-modal');
    }

    function resetCustomModelForm() {
      currentCustomModelEditId = null;
      document.getElementById('custom-model-modal-title').innerText = "Custom Model Builder";
      document.getElementById('custom-model-name-input').value = "";
      document.getElementById('custom-model-desc-input').value = "";
      document.getElementById('custom-titles-container').innerHTML = "";
      document.getElementById('custom-blocks-container').innerHTML = "";
      addCustomTitleField();
      addKeyValBlock();
    }

    function addCustomTitleField(val = "") {
      const container = document.getElementById('custom-titles-container');
      const div = document.createElement('div');
      div.className = 'kv-row';
      div.innerHTML = `<input type="text" class="form-control title-val" value="${val}" placeholder="Question / Title Topic"><button class="btn-small" onclick="this.parentElement.remove()">X</button>`;
      container.appendChild(div);
    }

    function addKeyValBlock(key = "", val = "") {
      const container = document.getElementById('custom-blocks-container');
      const div = document.createElement('div');
      div.className = 'block-node kv-block';
      div.dataset.type = "kv";
      div.style.cssText = "border:1px solid var(--border-color); padding:8px; border-radius:10px; margin-bottom:8px; background:var(--card-bg);";
      div.innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span style="font-size:11px; opacity:0.6;">Key-Value Pair</span><button class="btn-small" onclick="this.parentElement.parentElement.remove()">X</button></div>
        <div class="kv-row">
          <input type="text" class="form-control kv-key" value="${key}" placeholder="Key (e.g., founder)">
          <input type="text" class="form-control kv-val" value="${val}" placeholder="Value (e.g., Larry Page)">
        </div>`;
      container.appendChild(div);
    }

    function addAboutBlock(val = "") {
      const container = document.getElementById('custom-blocks-container');
      const div = document.createElement('div');
      div.className = 'block-node about-block';
      div.dataset.type = "about";
      div.style.cssText = "border:1px solid var(--border-color); padding:8px; border-radius:10px; margin-bottom:8px; background:var(--card-bg);";
      div.innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span style="font-size:11px; opacity:0.6;">About Content Block</span><button class="btn-small" onclick="this.parentElement.parentElement.remove()">X</button></div>
        <textarea class="form-control about-text" placeholder="Detailed about content...">${val}</textarea>`;
      container.appendChild(div);
    }

    function saveCustomModel() {
      const name = document.getElementById('custom-model-name-input').value.trim();
      const desc = document.getElementById('custom-model-desc-input').value.trim();
      
      const titleInputs = document.querySelectorAll('#custom-titles-container .title-val');
      const titles = Array.from(titleInputs).map(i => i.value.trim()).filter(v => v !== "");

      if (!name || titles.length === 0) { alert("Provide a Model Name and at least one Title."); return; }

      const blockNodes = document.querySelectorAll('#custom-blocks-container .block-node');
      let blocks = [];

      blockNodes.forEach(node => {
        if (node.dataset.type === "kv") {
          const k = node.querySelector('.kv-key').value.trim();
          const v = node.querySelector('.kv-val').value.trim();
          if (k && v) blocks.push({ type: "kv", key: k, val: v });
        } else if (node.dataset.type === "about") {
          const a = node.querySelector('.about-text').value.trim();
          if (a) blocks.push({ type: "about", val: a });
        }
      });

      const modelRecord = { name, description: desc, titles, blocks };
      const tx = db.transaction("custom_models", "readwrite");
      const store = tx.objectStore("custom_models");
      
      if (currentCustomModelEditId !== null) modelRecord.id = currentCustomModelEditId;
      store.put(modelRecord);

      tx.oncomplete = () => {
        closeModal('custom-model-modal');
        refreshModelDropdowns();
        showToast("Custom model saved!");
      };
    }

    /* --- Model Manager Modal --- */
    function openModelManagerModal() {
      closeSettingsDrawer(); closeDrawer();
      openModal('model-manager-modal');
      
      // Render System Model row
      const sysMgr = document.getElementById('system-model-mgr-item');
      sysMgr.innerHTML = `<span>${systemModelName}</span><button class="btn-small" onclick="renameSystemModel()">Rename</button>`;

      // Render Custom Models list
      const tx = db.transaction("custom_models", "readonly");
      const req = tx.objectStore("custom_models").getAll();
      req.onsuccess = () => {
        const listEl = document.getElementById('custom-models-mgr-list');
        listEl.innerHTML = "";
        req.result.forEach(m => {
          const div = document.createElement('div');
          div.className = 'saved-item';
          div.innerHTML = `<span>${m.name}</span><div><button class="btn-small" onclick="editCustomModel(${m.id})">Edit</button> <button class="btn-small" onclick="deleteCustomModel(${m.id})">Del</button></div>`;
          listEl.appendChild(div);
        });
      };
    }

    function renameSystemModel() {
      const newName = prompt("Enter new name for System Model:", systemModelName);
      if (newName && newName.trim()) {
        systemModelName = newName.trim();
        saveSetting("system_model_name", systemModelName);
        openModelManagerModal();
        refreshModelDropdowns();
        if (activeSelectedModel.type === 'system') selectModel('system', 'sys', systemModelName);
      }
    }

    function editCustomModel(id) {
      const tx = db.transaction("custom_models", "readonly");
      const req = tx.objectStore("custom_models").get(id);
      req.onsuccess = () => {
        const m = req.result; if (!m) return;
        currentCustomModelEditId = m.id;
        openModal('custom-model-modal');
        document.getElementById('custom-model-modal-title').innerText = "Edit Custom Model";
        document.getElementById('custom-model-name-input').value = m.name;
        document.getElementById('custom-model-desc-input').value = m.description || "";
        
        const titlesContainer = document.getElementById('custom-titles-container');
        titlesContainer.innerHTML = "";
        m.titles.forEach(t => addCustomTitleField(t));

        const blocksContainer = document.getElementById('custom-blocks-container');
        blocksContainer.innerHTML = "";
        m.blocks.forEach(b => {
          if (b.type === "kv") addKeyValBlock(b.key, b.val);
          else if (b.type === "about") addAboutBlock(b.val);
        });
      };
    }

    function deleteCustomModel(id) {
      if (confirm("Delete this custom model?")) {
        const tx = db.transaction("custom_models", "readwrite");
        tx.objectStore("custom_models").delete(id);
        tx.oncomplete = () => {
          openModelManagerModal();
          refreshModelDropdowns();
          if (activeSelectedModel.type === 'custom' && activeSelectedModel.id === id) {
            selectModel(null, null, "Select Model");
          }
        };
      }
    }

    /* --- Chat Execution & Highlighting Logic --- */
    function autoResizeTextarea(el) {
      el.style.height = '40px';
      el.style.height = Math.min(el.scrollHeight, 160) + 'px';
    }

    function handleSearchClick() {
      if (isGenerating) stopGeneration = true;
      else processQuery();
    }

    function toggleSearchIcon(state) {
      const searchIcon = document.getElementById('icon-search');
      const stopIcon = document.getElementById('icon-stop');
      if (state === 'stop') {
        isGenerating = true; searchIcon.style.display = 'none'; stopIcon.style.display = 'block';
      } else {
        isGenerating = false; searchIcon.style.display = 'block'; stopIcon.style.display = 'none';
      }
    }

    function processQuery() {
      const inputEl = document.getElementById('query-input');
      const text = inputEl.value.trim();
      if (!text) return;

      if (!activeSelectedModel.type) {
        alert("Please select a Model first from the top header menu!");
        return;
      }

      if (!activeChatId) activeChatId = Date.now().toString();

      appendMessage(text, 'user');
      currentChatMessages.push({ text, sender: 'user' });
      inputEl.value = ''; inputEl.style.height = '40px';

      executeQuery(text);
    }

    // Replace exact first occurrence of keyword with bold highlight
    function highlightOnce(text, keyword) {
      if (!keyword || !text) return text;
      const cleanKey = keyword.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      if (!cleanKey) return text;
      const regex = new RegExp(`(${cleanKey})`, 'i');
      return text.replace(regex, `<span class="highlight-keyword">$1</span>`);
    }

    function executeQuery(userText) {
      toggleSearchIcon('stop');
      stopGeneration = false;

      if (activeSelectedModel.type === 'system') {
        // System Model Execution: Supports Multi-Query
        const subQueries = userText.split(/and|&|,|\n/).map(q => q.trim()).filter(q => q.length > 0);
        
        const tx = db.transaction("system_knowledge", "readonly");
        const req = tx.objectStore("system_knowledge").getAll();
        req.onsuccess = () => {
          const allData = req.result;
          let responseParagraphs = [];

          subQueries.forEach(subQ => {
            const cleanSub = subQ.toLowerCase();
            const matched = allData.filter(d => d.title.toLowerCase().includes(cleanSub) || cleanSub.includes(d.title.toLowerCase()));
            
            if (matched.length > 0) {
              matched.forEach(m => {
                let processed = highlightOnce(m.about, m.title);
                responseParagraphs.push(processed);
              });
            } else {
              responseParagraphs.push(`No info found for ${subQ}.`);
            }
          });

          const finalHTML = responseParagraphs.join("<br><br>");
          const rawText = responseParagraphs.join("\n\n");

          appendAnimatedMessage(finalHTML, rawText, () => {
            currentChatMessages.push({ text: finalHTML, rawText: rawText, sender: 'ai' });
            saveCurrentChat();
            toggleSearchIcon('search');
          });
        };

      } else if (activeSelectedModel.type === 'custom') {
        // Custom Model Execution: Specific Key-Value Search vs Full Topic Dump
        const tx = db.transaction("custom_models", "readonly");
        const req = tx.objectStore("custom_models").get(activeSelectedModel.id);
        req.onsuccess = () => {
          const model = req.result;
          if (!model) {
            appendAnimatedMessage("Custom Model Data Error.", "Error", () => toggleSearchIcon('search'));
            return;
          }

          const lowerQuery = userText.toLowerCase().trim();
          let matchedTitle = model.titles.find(t => lowerQuery.includes(t.toLowerCase()) || t.toLowerCase().includes(lowerQuery));

          let outputLines = [];

          if (matchedTitle) {
            // Check for specific key matching first (e.g., "google founder")
            let specificKVMatch = null;
            model.blocks.forEach(b => {
              if (b.type === 'kv' && lowerQuery.includes(b.key.toLowerCase())) {
                specificKVMatch = b;
              }
            });

            if (specificKVMatch) {
              outputLines.push(`${matchedTitle} ${specificKVMatch.key}: ${specificKVMatch.val}`);
            } else {
              // Direct Topic Dump for Custom Model
              model.blocks.forEach(b => {
                if (b.type === 'kv') outputLines.push(`${b.key}: ${b.val}`);
                else if (b.type === 'about') outputLines.push(b.val);
              });
            }
          } else {
            outputLines.push("No relevant data found in " + model.name);
          }

          const rawText = outputLines.join("\n\n");
          let finalHTML = outputLines.join("<br><br>");
          
          if (matchedTitle) finalHTML = highlightOnce(finalHTML, matchedTitle);

          appendAnimatedMessage(finalHTML, rawText, () => {
            currentChatMessages.push({ text: finalHTML, rawText, sender: 'ai' });
            saveCurrentChat();
            toggleSearchIcon('search');
          });
        };
      }
    }

    function appendMessage(content, sender) {
      const container = document.getElementById('chat-container');
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.innerHTML = content;
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
      return msg;
    }

    async function appendAnimatedMessage(fullHTML, rawText, onComplete) {
      const container = document.getElementById('chat-container');
      const msg = document.createElement('div');
      msg.className = 'message ai';
      const contentEl = document.createElement('div');
      msg.appendChild(contentEl);
      container.appendChild(msg);

      const tokens = fullHTML.match(/<[^>]+>|[^<>\s]+|\s+/g) || [fullHTML];
      let currentString = "";

      for (let i = 0; i < tokens.length; i++) {
        if (stopGeneration) { contentEl.innerHTML = currentString; break; }
        currentString += tokens[i];
        contentEl.innerHTML = currentString;
        container.scrollTop = container.scrollHeight;
        if (!tokens[i].startsWith('<')) await new Promise(r => setTimeout(r, 20));
      }
      
      if (!stopGeneration) contentEl.innerHTML = fullHTML;
      
      addMsgActions(msg, rawText);
      container.scrollTop = container.scrollHeight;
      if (onComplete) onComplete();
    }

    function addMsgActions(msgContainer, textToCopy) {
      const actionsDiv = document.createElement('div');
      actionsDiv.className = 'msg-actions';
      const actionId = 'msg-act-' + Date.now();
      actionsDiv.setAttribute('id', actionId);
      actionsDiv.dataset.text = textToCopy;
      actionsDiv.innerHTML = `
        <button class="msg-action-btn" title="Copy" onclick="copyText('${actionId}')">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>`;
      msgContainer.appendChild(actionsDiv);
    }

    function copyText(actionId) {
      const el = document.getElementById(actionId);
      if (!el) return;
      navigator.clipboard.writeText(el.dataset.text).then(() => showToast("Copied!"));
    }

    function startNewChat() {
      activeChatId = null;
      currentChatMessages = [];
      document.getElementById('chat-container').innerHTML = '';
      toggleSearchIcon('search');
      closeDrawer();
    }

    function saveCurrentChat() {
      if (!db || !activeChatId || currentChatMessages.length === 0) return;
      const firstMsgText = currentChatMessages[0].text || "Chat";
      const title = firstMsgText.replace(/<[^>]*>?/gm, '').slice(0, 25) + "...";
      const dateStr = new Date().toLocaleDateString();

      const chatRecord = { id: activeChatId, title, date: dateStr, messages: currentChatMessages };
      const tx = db.transaction("chats", "readwrite");
      tx.objectStore("chats").put(chatRecord);
      tx.oncomplete = () => loadChatHistory();
    }

    function loadChatHistory() {
      if (!db) return;
      const tx = db.transaction("chats", "readonly");
      const req = tx.objectStore("chats").getAll();
      req.onsuccess = () => {
        allSavedChats = req.result;
        const listEl = document.getElementById('history-list');
        listEl.innerHTML = "";
        allSavedChats.forEach(chat => {
          const div = document.createElement('div');
          div.className = 'chat-history-item';
          div.onclick = () => openSavedChat(chat.id);
          div.innerHTML = `<span class="chat-title-text">${chat.title}</span>`;
          listEl.appendChild(div);
        });
      };
    }

    function openSavedChat(id) {
      const chat = allSavedChats.find(c => c.id === id); if (!chat) return;
      activeChatId = chat.id; currentChatMessages = chat.messages || [];
      const container = document.getElementById('chat-container');
      container.innerHTML = '';
      currentChatMessages.forEach(msg => {
        if (msg.sender === 'user') appendMessage(msg.text, 'user');
        else {
          const aiMsg = appendMessage(msg.text, 'ai');
          addMsgActions(aiMsg, msg.rawText || aiMsg.innerText);
        }
      });
      closeDrawer();
    }

    window.onload = init;
</script>
