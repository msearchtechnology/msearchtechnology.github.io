<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Play Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --surface-hover: #2d2d2d;
            --border-color: #2c2c2c;
            --primary-color: #8ab4f8;
            --text-primary: #e3e3e3;
            --text-secondary: #9aa0a6;
            --accent-blue: #0b57d0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Google Sans', -apple-system, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .phone-frame {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 870px;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        @media (min-width: 413px) {
            .phone-frame {
                border-radius: 32px;
                height: 92vh;
            }
        }

        /* Splash Screen */
        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .splash-logo-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            animation: pulse 1.5s infinite ease-in-out;
        }

        .splash-logo-container .fa-cloud {
            font-size: 80px;
        }

        .splash-logo-container .fa-download {
            position: absolute;
            font-size: 28px;
            color: var(--bg-color);
            top: 42%;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background-color: var(--bg-color);
            gap: 12px;
            z-index: 10;
        }

        .back-btn-top, .share-btn-top {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-title-top {
            flex: 1;
            font-size: 20px;
            font-weight: 500;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Search Bar */
        .search-bar {
            flex: 1;
            background-color: var(--surface-color);
            border-radius: 28px;
            display: flex;
            align-items: center;
            padding: 8px 14px;
            gap: 10px;
            position: relative;
        }

        .cloud-icon-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 20px;
        }

        .cloud-icon-wrapper .fa-download {
            position: absolute;
            font-size: 8px;
            color: var(--surface-color);
            top: 40%;
        }

        .loader-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 1px;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            width: 100%;
            outline: none;
            margin-left: 4px;
        }

        .search-icon-btn {
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
        }

        /* Popup Search */
        .search-popup-box {
            position: absolute;
            top: 60px;
            left: 16px;
            right: 16px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            max-height: 280px;
            overflow-y: auto;
            z-index: 50;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
        }

        .search-popup-box.active {
            display: flex;
        }

        .popup-item {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .popup-item:last-child {
            border-bottom: none;
        }

        .popup-item:hover {
            background-color: var(--surface-hover);
        }

        .popup-thumb {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            object-fit: cover;
            background-color: var(--bg-color);
        }

        .popup-title {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .main-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
            scrollbar-width: none;
        }

        .main-container::-webkit-scrollbar {
            display: none;
        }

        .page {
            display: none;
            flex-direction: column;
            padding-bottom: 30px;
        }

        .page.active {
            display: flex;
        }

        /* Home Page & Horizontal Swipe Feature */
        .sponsored-tag {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            padding: 12px 16px 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Play Store Style Horizontal Scrollable Container */
        .swipe-carousel-container {
            display: flex;
            gap: 12px;
            padding: 0 16px 12px 16px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .swipe-carousel-container::-webkit-scrollbar {
            display: none;
        }

        .featured-card {
            min-width: 85%;
            scroll-snap-align: center;
            background-color: var(--surface-color);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            flex-shrink: 0;
        }

        .featured-banner {
            width: 100%;
            height: 160px;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .featured-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .featured-info {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .featured-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            object-fit: cover;
        }

        .featured-details {
            flex: 1;
        }

        .featured-details h3 {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .featured-details .developer {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            cursor: pointer;
        }

        .featured-details .meta {
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .install-btn {
            background-color: var(--primary-color);
            color: #040e18;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px 8px 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 500;
        }

        .app-list {
            display: flex;
            flex-direction: column;
        }

        .app-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            gap: 14px;
            cursor: pointer;
        }

        .app-item:hover {
            background-color: var(--surface-hover);
        }

        .app-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            object-fit: cover;
            background-color: var(--surface-color);
        }

        .app-details {
            flex: 1;
        }

        .app-details h4 {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .app-details .category {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .app-details .stats {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Company Profile UI */
        .company-banner-container {
            width: 100%;
            height: 180px;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
        }

        .company-banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .company-header-section {
            padding: 20px 16px 16px 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .company-text-info {
            flex: 1;
            padding-right: 12px;
        }

        .company-title {
            font-size: 24px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .company-description {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.45;
        }

        .company-round-logo {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: var(--surface-color);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .company-round-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .featured-app-container {
            display: flex;
            gap: 12px;
            padding: 0 16px;
            overflow-x: auto;
            scrollbar-width: none;
            margin-bottom: 16px;
        }

        .featured-app-container::-webkit-scrollbar {
            display: none;
        }

        .screenshot-card {
            width: 150px;
            height: 260px;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .screenshot-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .single-app-row {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 14px;
        }

        .app-icon-large {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            object-fit: cover;
            background-color: var(--surface-color);
        }

        .all-apps-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 16px 12px 16px;
        }

        .all-apps-title {
            font-size: 20px;
            font-weight: 500;
        }

        .circle-arrow-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: var(--surface-hover);
            color: var(--text-primary);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
        }

        .company-grid-item {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 140px;
            cursor: pointer;
        }

        .company-grid-icon {
            width: 110px;
            height: 110px;
            border-radius: 24px;
            object-fit: cover;
        }

        .company-grid-title {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .company-grid-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Forms & Inputs */
        .settings-form {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .form-group input, .form-group textarea, .form-group select {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 14px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .file-input-wrapper {
            background-color: var(--surface-color);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 20px;
            padding: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        .hardcode-btn {
            background-color: #2e7d32;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
            height: 60px;
            z-index: 10;
        }

        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 11px;
            flex: 1;
        }

        .nav-item.active {
            color: var(--primary-color);
        }

        .action-btn-small {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
        }

        .delete-btn {
            color: #ff5252;
            border-color: #4a1f1f;
        }

        .empty-placeholder {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-secondary);
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- 0. SPLASH SCREEN -->
        <div id="splash-screen">
            <div class="splash-logo-container">
                <i class="fa-solid fa-cloud"></i>
                <i class="fa-solid fa-download"></i>
            </div>
        </div>

        <header id="app-header">
            <button class="back-btn-top" id="header-back" style="display: none;" onclick="goBack()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div id="header-title" class="page-title-top" style="display: none;"></div>
            
            <div class="search-bar" id="header-search">
                <div class="cloud-icon-wrapper">
                    <i class="fa-solid fa-cloud"></i>
                    <i class="fa-solid fa-download"></i>
                </div>
                <span class="loader-title">LOADER</span>
                <input type="text" id="search-input" placeholder="Search..." oninput="performSearch()" onclick="performSearch()">
                <div class="search-icon-btn" onclick="performSearch()">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>

            <button class="share-btn-top" id="header-share" style="display: none;">
                <i class="fa-solid fa-share-nodes"></i>
            </button>
            <button class="back-btn-top" id="header-settings-btn" onclick="switchPage('settings')">
                <i class="fa-solid fa-gear"></i>
            </button>
        </header>

        <!-- Live Search Results Popup Box -->
        <div class="search-popup-box" id="search-popup"></div>

        <div class="main-container" onclick="closeSearchPopup()">
            <!-- 1. HOME PAGE -->
            <div id="page-home" class="page active">
                <div class="sponsored-tag">
                    <span>Featured & Suggested</span>
                </div>
                
                <!-- Hand Swipe Scrollable App Banner Slider -->
                <div class="swipe-carousel-container" id="home-featured-box"></div>
                
                <div class="section-header">
                    <div class="section-title">All Applications</div>
                </div>
                <div class="app-list" id="home-app-list"></div>
            </div>

            <!-- 2. COMPANY PROFILE PAGE -->
            <div id="page-company" class="page">
                <div class="company-banner-container">
                    <img id="company-banner-img" class="company-banner-img" src="" alt="Company Banner">
                </div>

                <div class="company-header-section">
                    <div class="company-text-info">
                        <div class="company-title" id="company-name"></div>
                        <div class="company-description" id="company-about"></div>
                    </div>
                    <div class="company-round-logo">
                        <img id="company-round-logo-img" src="" alt="Logo">
                    </div>
                </div>

                <div class="section-header" style="padding-top: 10px;">
                    <div class="section-title">Featured app</div>
                </div>

                <div class="featured-app-container" id="company-screenshots"></div>

                <div class="single-app-row" id="company-featured-app-row" style="cursor: pointer;">
                    <img id="comp-feat-icon" class="app-icon-large" src="" alt="">
                    <div class="app-details">
                        <h4 id="comp-feat-title" style="font-size: 16px; font-weight: 500;"></h4>
                        <div class="category" id="comp-feat-cat" style="margin-top: 2px;"></div>
                        <div class="stats" id="comp-feat-stats" style="margin-top: 4px;"></div>
                    </div>
                </div>

                <div class="all-apps-header">
                    <div class="all-apps-title">All apps</div>
                    <button class="circle-arrow-btn">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>

                <div id="company-all-apps-container" style="display: flex; overflow-x: auto; padding: 0 8px; scrollbar-width: none;"></div>
            </div>

            <!-- 3. APP DETAIL PAGE -->
            <div id="page-detail" class="page">
                <div style="padding: 16px; display: flex; gap: 16px; align-items: flex-start;">
                    <img id="detail-icon" class="app-icon-large" src="" alt="" style="width: 72px; height: 72px;">
                    <div style="flex: 1;">
                        <h2 id="detail-title" style="font-size: 20px; font-weight: 500; margin-bottom: 4px;"></h2>
                        <div id="detail-company" style="color: var(--primary-color); font-size: 14px; cursor: pointer; margin-bottom: 6px;" onclick="openCompanyFromDetail()"></div>
                        <div id="detail-meta" style="font-size: 12px; color: var(--text-secondary);">Ready to Install</div>
                    </div>
                </div>
                <div style="padding: 0 16px 16px 16px;">
                    <button class="install-btn" id="detail-install-btn" style="width: 100%; padding: 12px; font-size: 15px;">Install</button>
                </div>
                <div class="section-title" style="padding: 12px 16px 6px 16px;">About this app</div>
                <p id="detail-about" style="padding: 0 16px 16px 16px; font-size: 14px; color: var(--text-secondary); line-height: 1.5;"></p>
                <div class="section-title" style="padding: 12px 16px 6px 16px;">Screenshots</div>
                <div class="featured-app-container" id="detail-screenshots"></div>
            </div>

            <!-- 4. SETTINGS / APP & COMPANY MANAGEMENT PAGE -->
            <div id="page-settings" class="page">
                <div class="section-title" style="padding: 16px 16px 8px 16px;">Permanent Download & Standalone Export</div>
                <div style="padding: 0 16px 16px 16px; display: flex; flex-direction: column; gap: 10px;">
                    <button class="hardcode-btn" onclick="exportPermanentHardcodedApp()">
                        <i class="fa-solid fa-download"></i> Download Permanent App File
                    </button>
                </div>

                <hr style="border-color: var(--border-color); margin: 0 16px;">

                <div class="section-title" style="padding: 16px 16px 8px 16px;">Data Backup & Share</div>
                <div style="padding: 0 16px 16px 16px; display: flex; gap: 10px;">
                    <button class="action-btn-small" style="flex: 1; padding: 10px;" onclick="exportStoreData()">Export JSON</button>
                    <label class="action-btn-small" style="flex: 1; padding: 10px; text-align: center; cursor: pointer;">
                        Import JSON
                        <input type="file" id="inp-import-data" accept=".json" style="display: none;" onchange="importStoreData(this)">
                    </label>
                </div>

                <hr style="border-color: var(--border-color); margin: 0 16px;">

                <!-- Manage Companies Section (NEW) -->
                <div class="section-title" style="padding: 16px 16px 8px 16px;">Manage Companies</div>
                <div class="app-list" id="manage-company-list"></div>

                <hr style="border-color: var(--border-color); margin: 16px;">

                <div class="section-title" style="padding: 0 16px 8px 16px;">Manage Published Apps</div>
                <div class="app-list" id="manage-app-list"></div>

                <hr style="border-color: var(--border-color); margin: 16px;">

                <div class="section-title" id="form-title" style="padding: 0 16px 8px 16px;">Publish / Update App</div>
                <form class="settings-form" onsubmit="saveApp(event)" id="app-form">
                    <div class="form-group">
                        <label>1. App Name</label>
                        <input type="text" id="inp-name" required placeholder="e.g. My App">
                    </div>

                    <div class="form-group">
                        <label>2. App Logo (Icon)</label>
                        <label class="file-input-wrapper">
                            <span id="label-logo">Select Logo Image</span>
                            <input type="file" id="inp-logo" accept="image/*" onchange="updateFileLabel(this, 'label-logo')">
                        </label>
                    </div>

                    <div class="form-group">
                        <label>3. Main Custom Image / Screenshots (Multiple)</label>
                        <label class="file-input-wrapper">
                            <span id="label-screenshots">Select Main Banner / Screenshots</span>
                            <input type="file" id="inp-screenshots" accept="image/*" multiple onchange="updateFileLabel(this, 'label-screenshots')">
                        </label>
                    </div>

                    <div class="form-group">
                        <label>4. App About / Description</label>
                        <textarea id="inp-app-about" required placeholder="App description..."></textarea>
                    </div>

                    <hr style="border-color: var(--border-color); margin: 8px 0;">

                    <div class="form-group">
                        <label>5. Select Company</label>
                        <select id="select-company" onchange="toggleCompanyFields()">
                            <option value="NEW">+ Create New Company Profile</option>
                        </select>
                    </div>

                    <div id="new-company-fields">
                        <div class="form-group" style="margin-top: 10px;">
                            <label>Company Name</label>
                            <input type="text" id="inp-company-name" placeholder="e.g. My Studio">
                        </div>
                        <div class="form-group" style="margin-top: 10px;">
                            <label>Company Top Banner Image (Large)</label>
                            <label class="file-input-wrapper">
                                <span id="label-company-banner">Select Banner Image</span>
                                <input type="file" id="inp-company-banner" accept="image/*" onchange="updateFileLabel(this, 'label-company-banner')">
                            </label>
                        </div>
                        <div class="form-group" style="margin-top: 10px;">
                            <label>Company Round Logo Image (Corner Logo)</label>
                            <label class="file-input-wrapper">
                                <span id="label-company-logo">Select Round Logo</span>
                                <input type="file" id="inp-company-logo" accept="image/*" onchange="updateFileLabel(this, 'label-company-logo')">
                            </label>
                        </div>
                        <div class="form-group" style="margin-top: 10px;">
                            <label>Company Description / About</label>
                            <textarea id="inp-company-about" placeholder="Company profile description..."></textarea>
                        </div>
                    </div>

                    <hr style="border-color: var(--border-color); margin: 8px 0;">

                    <div class="form-group">
                        <label>6. Upload App Package File (.apk / .html / .zip)</label>
                        <label class="file-input-wrapper">
                            <span id="label-app-file">Select APK or App file</span>
                            <input type="file" id="inp-app-file" accept=".apk,.html,.zip" onchange="updateFileLabel(this, 'label-app-file')">
                        </label>
                    </div>

                    <button type="submit" class="submit-btn" id="submit-btn">Publish App</button>
                    <button type="button" class="submit-btn" id="cancel-btn" style="background-color: transparent; border: 1px solid var(--border-color); color: #fff; display:none;" onclick="resetForm()">Cancel Edit</button>
                </form>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <bottom-nav>
            <button class="nav-item active" id="nav-home" onclick="switchPage('home')">
                <i class="fa-solid fa-house" style="font-size: 16px;"></i>
                <span>Home</span>
            </button>
            <button class="nav-item" id="nav-settings" onclick="switchPage('settings')">
                <i class="fa-solid fa-circle-plus" style="font-size: 16px;"></i>
                <span>Manage</span>
            </button>
        </bottom-nav>
    </div>

    <!-- Hardcoded Initial Data Holder -->
    <script id="hardcoded-data-store" type="application/json">
        null
    </script>

    <script>
        // IndexedDB Configuration for Local Storage
        let db;
        const dbName = "PocketPlayStoreDB";

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains('store')) {
                        db.createObjectStore('store');
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve();
                };
                request.onerror = (e) => reject(e);
            });
        }

        function saveDataToDB() {
            return new Promise((resolve, reject) => {
                if(!db) return resolve();
                const tx = db.transaction('store', 'readwrite');
                const store = tx.objectStore('store');
                store.put(companies, 'companies');
                store.put(apps, 'apps');
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e);
            });
        }

        function loadDataFromDB() {
            return new Promise((resolve, reject) => {
                if(!db) return resolve();
                const tx = db.transaction('store', 'readonly');
                const store = tx.objectStore('store');
                const reqComp = store.get('companies');
                const reqApps = store.get('apps');

                tx.oncomplete = () => {
                    if (reqComp.result && reqComp.result.length > 0) companies = reqComp.result;
                    if (reqApps.result && reqApps.result.length > 0) apps = reqApps.result;
                    resolve();
                };
                tx.onerror = (e) => reject(e);
            });
        }

        let companies = [];
        let apps = [];

        let historyStack = [];
        let currentActivePage = 'home';
        let activeCompanyIdx = null;
        let editingAppId = null;

        function updateFileLabel(input, labelId) {
            const label = document.getElementById(labelId);
            if (input.files && input.files.length > 0) {
                label.textContent = input.files.length === 1 ? input.files[0].name : `${input.files.length} files selected`;
            }
        }

        function toggleCompanyFields() {
            const select = document.getElementById('select-company');
            const newCompFields = document.getElementById('new-company-fields');
            newCompFields.style.display = (select.value === 'NEW') ? 'block' : 'none';
        }

        function populateCompanyDropdown() {
            const select = document.getElementById('select-company');
            select.innerHTML = '<option value="NEW">+ Create New Company Profile</option>';
            companies.forEach((comp, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = comp.name;
                select.appendChild(opt);
            });
            toggleCompanyFields();
        }

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                if(!file) resolve('');
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function switchPage(pageId, pushHistory = true) {
            closeSearchPopup();
            if (pushHistory && currentActivePage !== pageId) {
                historyStack.push(currentActivePage);
            }
            currentActivePage = pageId;

            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${pageId}`).classList.add('active');

            const headerBack = document.getElementById('header-back');
            const headerSearch = document.getElementById('header-search');
            const headerTitle = document.getElementById('header-title');
            const headerShare = document.getElementById('header-share');

            if (pageId === 'home') {
                headerBack.style.display = 'none';
                headerSearch.style.display = 'flex';
                headerTitle.style.display = 'none';
                headerShare.style.display = 'none';
                renderHome();
            } else if (pageId === 'company') {
                const comp = companies[activeCompanyIdx];
                headerBack.style.display = 'flex';
                headerSearch.style.display = 'none';
                headerTitle.style.display = 'block';
                headerTitle.textContent = comp ? comp.name : "Company";
                headerShare.style.display = 'flex';
            } else if (pageId === 'detail') {
                headerBack.style.display = 'flex';
                headerSearch.style.display = 'none';
                headerTitle.style.display = 'none';
                headerShare.style.display = 'flex';
            } else if (pageId === 'settings') {
                headerBack.style.display = 'flex';
                headerSearch.style.display = 'none';
                headerTitle.style.display = 'block';
                headerTitle.textContent = "Developer Console";
                headerShare.style.display = 'none';
                renderManageCompanies();
                renderManageApps();
            }

            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(pageId === 'home') document.getElementById('nav-home').classList.add('active');
            if(pageId === 'settings') document.getElementById('nav-settings').classList.add('active');

            document.querySelector('.main-container').scrollTop = 0;
        }

        function goBack() {
            if (historyStack.length > 0) {
                const prevPage = historyStack.pop();
                switchPage(prevPage, false);
            } else {
                switchPage('home', false);
            }
        }

        /* Render Home with Touch-Swipe Horizontal Carousel */
        function renderHome() {
            const featBox = document.getElementById('home-featured-box');
            const listContainer = document.getElementById('home-app-list');

            featBox.innerHTML = '';
            listContainer.innerHTML = '';

            if (apps.length === 0) {
                featBox.innerHTML = `
                    <div class="empty-placeholder">
                        <i class="fa-solid fa-box-open" style="font-size: 36px; margin-bottom: 10px;"></i>
                        <p>No apps published yet.<br>Click "Manage" below to add your first app.</p>
                    </div>
                `;
                return;
            }

            // Swipe Cards Horizontal Container
            apps.forEach(app => {
                const comp = companies[app.companyIndex];
                const customBanner = (app.screenshots && app.screenshots.length > 0) ? app.screenshots[0] : app.logo;

                const card = document.createElement('div');
                card.className = 'featured-card';
                card.innerHTML = `
                    <div class="featured-banner">
                        <img src="${customBanner}" alt="Featured Custom Image">
                    </div>
                    <div class="featured-info">
                        <img class="featured-icon" src="${app.logo}" alt="">
                        <div class="featured-details">
                            <h3>${app.name}</h3>
                            <div class="developer" onclick="event.stopPropagation(); openCompany(${app.companyIndex})">${comp ? comp.name : 'Developer'}</div>
                            <div class="meta">${app.stats}</div>
                        </div>
                        <button class="install-btn" onclick="event.stopPropagation(); downloadOrInstall('${app.id}')">Install</button>
                    </div>
                `;
                card.onclick = () => openDetail(app.id);
                featBox.appendChild(card);
            });

            // Vertical Apps List
            apps.forEach(app => {
                const item = document.createElement('div');
                item.className = 'app-item';
                item.innerHTML = `
                    <img class="app-icon" src="${app.logo}" alt="">
                    <div class="app-details">
                        <h4>${app.name}</h4>
                        <div class="category">${app.category}</div>
                        <div class="stats">${app.stats}</div>
                    </div>
                `;
                item.onclick = () => openDetail(app.id);
                listContainer.appendChild(item);
            });
        }

        /* LIVE POPUP SEARCH */
        function performSearch() {
            const q = document.getElementById('search-input').value.trim().toLowerCase();
            const popup = document.getElementById('search-popup');
            popup.innerHTML = '';

            const matches = apps.filter(a => a.name.toLowerCase().includes(q));

            if (matches.length > 0) {
                matches.forEach(app => {
                    const item = document.createElement('div');
                    item.className = 'popup-item';
                    item.innerHTML = `
                        <img class="popup-thumb" src="${app.logo}" alt="">
                        <div class="popup-title">${app.name}</div>
                    `;
                    item.onclick = (e) => {
                        e.stopPropagation();
                        openDetail(app.id);
                        closeSearchPopup();
                    };
                    popup.appendChild(item);
                });
                popup.classList.add('active');
            } else {
                if (q !== '') {
                    popup.innerHTML = '<div style="padding: 12px; font-size: 13px; color: var(--text-secondary); text-align: center;">No matching apps found</div>';
                    popup.classList.add('active');
                } else {
                    popup.classList.remove('active');
                }
            }
        }

        function closeSearchPopup() {
            const popup = document.getElementById('search-popup');
            popup.classList.remove('active');
        }

        function openCompany(compIndex) {
            activeCompanyIdx = compIndex;
            const comp = companies[compIndex];
            if (!comp) return;

            document.getElementById('company-banner-img').src = comp.banner;
            document.getElementById('company-name').textContent = comp.name;
            document.getElementById('company-about').textContent = comp.about;
            document.getElementById('company-round-logo-img').src = comp.logo;

            const companyApps = apps.filter(a => a.companyIndex == compIndex);

            const scContainer = document.getElementById('company-screenshots');
            scContainer.innerHTML = '';

            if (companyApps.length > 0) {
                // FIXED FEATURED APP: Shows latest updated or added app first
                const featApp = companyApps[companyApps.length - 1];
                
                featApp.screenshots.forEach(sc => {
                    const scCard = document.createElement('div');
                    scCard.className = 'screenshot-card';
                    scCard.innerHTML = `<img src="${sc}" alt="Screenshot">`;
                    scContainer.appendChild(scCard);
                });

                document.getElementById('comp-feat-icon').src = featApp.logo;
                document.getElementById('comp-feat-title').textContent = featApp.name;
                document.getElementById('comp-feat-cat').textContent = featApp.category;
                document.getElementById('comp-feat-stats').textContent = featApp.stats;
                document.getElementById('company-featured-app-row').onclick = () => openDetail(featApp.id);
            }

            const allAppsContainer = document.getElementById('company-all-apps-container');
            allAppsContainer.innerHTML = '';

            companyApps.forEach(app => {
                const gridItem = document.createElement('div');
                gridItem.className = 'company-grid-item';
                gridItem.innerHTML = `
                    <img class="company-grid-icon" src="${app.logo}" alt="">
                    <div class="company-grid-title">${app.name}</div>
                    <div class="company-grid-meta">${app.stats.split('·')[0]} ★</div>
                `;
                gridItem.onclick = () => openDetail(app.id);
                allAppsContainer.appendChild(gridItem);
            });

            switchPage('company');
        }

        function openDetail(appId) {
            const app = apps.find(a => a.id === appId);
            if (!app) return;

            const comp = companies[app.companyIndex];

            document.getElementById('detail-icon').src = app.logo;
            document.getElementById('detail-title').textContent = app.name;
            document.getElementById('detail-company').textContent = comp ? comp.name : 'Developer';
            document.getElementById('detail-company').dataset.companyIdx = app.companyIndex;
            document.getElementById('detail-about').textContent = app.appAbout;

            const scContainer = document.getElementById('detail-screenshots');
            scContainer.innerHTML = '';
            app.screenshots.forEach(sc => {
                const scCard = document.createElement('div');
                scCard.className = 'screenshot-card';
                scCard.innerHTML = `<img src="${sc}" alt="Screenshot">`;
                scContainer.appendChild(scCard);
            });

            document.getElementById('detail-install-btn').onclick = () => downloadOrInstall(app.id);

            switchPage('detail');
        }

        function openCompanyFromDetail() {
            const idx = document.getElementById('detail-company').dataset.companyIdx;
            if(idx !== undefined && idx !== "") openCompany(parseInt(idx));
        }

        /* MANAGE COMPANIES FEATURE (NEW) */
        function renderManageCompanies() {
            const list = document.getElementById('manage-company-list');
            list.innerHTML = '';

            if (companies.length === 0) {
                list.innerHTML = '<div style="padding: 12px; color: var(--text-secondary); text-align: center;">No companies added yet.</div>';
                return;
            }

            companies.forEach((comp, idx) => {
                const item = document.createElement('div');
                item.className = 'app-item';
                item.innerHTML = `
                    <img class="app-icon" src="${comp.logo}" alt="" style="border-radius: 50%;">
                    <div class="app-details">
                        <h4>${comp.name}</h4>
                    </div>
                    <button class="action-btn-small delete-btn" onclick="event.stopPropagation(); deleteCompany(${idx})">Delete</button>
                `;
                list.appendChild(item);
            });
        }

        async function deleteCompany(compIndex) {
            if(confirm("Are you sure you want to delete this company? All apps under this company will also be removed.")) {
                companies.splice(compIndex, 1);
                
                // Re-assign index for remaining apps & remove deleted company apps
                apps = apps.filter(a => a.companyIndex !== compIndex);
                apps.forEach(a => {
                    if (a.companyIndex > compIndex) {
                        a.companyIndex -= 1;
                    }
                });

                await saveDataToDB();
                populateCompanyDropdown();
                renderManageCompanies();
                renderManageApps();
                renderHome();
            }
        }

        function renderManageApps() {
            const list = document.getElementById('manage-app-list');
            list.innerHTML = '';

            if (apps.length === 0) {
                list.innerHTML = '<div style="padding: 16px; color: var(--text-secondary); text-align: center;">No apps published yet.</div>';
                return;
            }

            apps.forEach(app => {
                const item = document.createElement('div');
                item.className = 'app-item';
                item.innerHTML = `
                    <img class="app-icon" src="${app.logo}" alt="">
                    <div class="app-details">
                        <h4>${app.name}</h4>
                    </div>
                    <button class="action-btn-small" onclick="event.stopPropagation(); editApp('${app.id}')">Edit</button>
                    <button class="action-btn-small delete-btn" onclick="event.stopPropagation(); deleteApp('${app.id}')">Delete</button>
                `;
                list.appendChild(item);
            });
        }

        function editApp(appId) {
            const app = apps.find(a => a.id === appId);
            if (!app) return;

            editingAppId = appId;
            document.getElementById('form-title').textContent = "Edit App: " + app.name;
            document.getElementById('inp-name').value = app.name;
            document.getElementById('inp-app-about').value = app.appAbout;
            document.getElementById('select-company').value = app.companyIndex;
            toggleCompanyFields();

            document.getElementById('submit-btn').textContent = "Update App";
            document.getElementById('cancel-btn').style.display = "block";
        }

        async function deleteApp(appId) {
            if(confirm("Are you sure you want to delete this app?")) {
                apps = apps.filter(a => a.id !== appId);
                await saveDataToDB();
                renderManageApps();
                renderHome();
            }
        }

        function resetForm() {
            editingAppId = null;
            document.getElementById('app-form').reset();
            document.getElementById('form-title').textContent = "Publish / Update App";
            document.getElementById('submit-btn').textContent = "Publish App";
            document.getElementById('cancel-btn').style.display = "none";
            toggleCompanyFields();
        }

        async function saveApp(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;

            try {
                const logoFile = document.getElementById('inp-logo').files[0];
                const scFiles = document.getElementById('inp-screenshots').files;
                const appFile = document.getElementById('inp-app-file').files[0];

                let existingApp = editingAppId ? apps.find(a => a.id === editingAppId) : null;

                let logoUrl = logoFile ? await readFileAsDataURL(logoFile) : (existingApp ? existingApp.logo : '');

                let screenshotsUrls = [];
                if (scFiles && scFiles.length > 0) {
                    for (let i = 0; i < scFiles.length; i++) {
                        screenshotsUrls.push(await readFileAsDataURL(scFiles[i]));
                    }
                } else if (existingApp) {
                    screenshotsUrls = existingApp.screenshots;
                }

                let fileDataUrl = appFile ? await readFileAsDataURL(appFile) : (existingApp ? existingApp.fileData : '');
                let fileName = appFile ? appFile.name : (existingApp ? existingApp.fileName : 'app.apk');

                const compSelect = document.getElementById('select-company');
                let compIndex;

                if (compSelect.value === 'NEW') {
                    const compName = document.getElementById('inp-company-name').value || "Independent Developer";
                    const compBannerFile = document.getElementById('inp-company-banner').files[0];
                    const compLogoFile = document.getElementById('inp-company-logo').files[0];

                    const compBannerUrl = compBannerFile ? await readFileAsDataURL(compBannerFile) : logoUrl;
                    const compLogoUrl = compLogoFile ? await readFileAsDataURL(compLogoFile) : logoUrl;
                    const compAbout = document.getElementById('inp-company-about').value || "Developer profile";

                    companies.push({
                        id: 'comp_' + Date.now(),
                        name: compName,
                        banner: compBannerUrl,
                        logo: compLogoUrl,
                        about: compAbout
                    });
                    compIndex = companies.length - 1;
                } else {
                    compIndex = parseInt(compSelect.value);
                }

                if (existingApp) {
                    existingApp.name = document.getElementById('inp-name').value;
                    existingApp.logo = logoUrl;
                    existingApp.screenshots = screenshotsUrls;
                    existingApp.appAbout = document.getElementById('inp-app-about').value;
                    existingApp.companyIndex = compIndex;
                    existingApp.fileData = fileDataUrl;
                    existingApp.fileName = fileName;

                    // Move updated app to last index so it becomes the new Featured App for the company
                    apps = apps.filter(a => a.id !== existingApp.id);
                    apps.push(existingApp);
                } else {
                    apps.push({
                        id: 'app_' + Date.now(),
                        name: document.getElementById('inp-name').value,
                        logo: logoUrl,
                        category: companies[compIndex].name + " · Application",
                        stats: "5.0 ★ · New",
                        companyIndex: compIndex,
                        appAbout: document.getElementById('inp-app-about').value,
                        screenshots: screenshotsUrls,
                        fileData: fileDataUrl,
                        fileName: fileName
                    });
                }

                await saveDataToDB();
                populateCompanyDropdown();
                resetForm();
                renderManageCompanies();
                renderManageApps();
                renderHome();
                alert("App saved successfully!");

            } catch (err) {
                console.error(err);
            } finally {
                submitBtn.disabled = false;
            }
        }

        function downloadOrInstall(appId) {
            const app = apps.find(a => a.id === appId);
            if (!app) return;
            if (app.fileData) {
                const a = document.createElement('a');
                a.href = app.fileData;
                a.download = app.fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } else {
                alert("No file linked to " + app.name);
            }
        }

        function exportStoreData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ companies, apps }));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "store_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importStoreData(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.companies && data.apps) {
                        companies = data.companies;
                        apps = data.apps;
                        await saveDataToDB();
                        populateCompanyDropdown();
                        renderHome();
                        renderManageCompanies();
                        renderManageApps();
                        alert("Store data imported successfully!");
                    } else {
                        alert("Invalid JSON data format.");
                    }
                } catch (err) {
                    alert("Failed to parse JSON file.");
                }
            };
            reader.readAsText(file);
        }

        function exportPermanentHardcodedApp() {
            const fullHTML = document.documentElement.outerHTML;
            const payload = JSON.stringify({ companies, apps });

            const updatedHTML = fullHTML.replace(
                /<script id="hardcoded-data-store" type="application\/json">[\s\S]*?<\/script>/,
                `<script id="hardcoded-data-store" type="application/json">${payload}<\/script>`
            );

            const blob = new Blob([updatedHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);

            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = url;
            downloadAnchor.download = "PocketPlayStore_Hardcoded.html";
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);
            URL.revokeObjectURL(url);
        }

        function loadHardcodedData() {
            try {
                const storeElement = document.getElementById('hardcoded-data-store');
                if (storeElement && storeElement.textContent.trim() !== 'null') {
                    const hardcoded = JSON.parse(storeElement.textContent);
                    if (hardcoded && hardcoded.companies && hardcoded.apps) {
                        companies = hardcoded.companies;
                        apps = hardcoded.apps;
                        return true;
                    }
                }
            } catch (e) {
                console.error("Failed to parse hardcoded data", e);
            }
            return false;
        }

        // Initialize Store
        window.addEventListener('DOMContentLoaded', async () => {
            const loadedFromHardcoded = loadHardcodedData();
            await initDB();
            
            if (!loadedFromHardcoded) {
                await loadDataFromDB();
            } else {
                await saveDataToDB();
            }

            populateCompanyDropdown();
            switchPage('home', false);

            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 500);
            }, 2000);
        });
    </script>
</body>
</html>
