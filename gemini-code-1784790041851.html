<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORIGINELS</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --sub-text: #555555;
            --border-color: #e5e5e5;
            --card-bg: #f9f9f9;
            --logo-color: #bb1919;
            --drawer-bg: #f7f7f7;
            --btn-bg: #111111;
            --btn-text: #ffffff;
            --bio-bg: #f4f6f8;
        }

        body.dark-theme {
            --bg-color: #121212;
            --text-color: #f1f1f1;
            --sub-text: #aaaaaa;
            --border-color: #2a2a2a;
            --card-bg: #1e1e1e;
            --drawer-bg: #181818;
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --bio-bg: #1a1e24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.2s, color 0.2s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 40px;
        }

        /* BBC Style Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 2px solid var(--border-color);
            background: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            padding: 4px;
        }

        .icon-btn svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
        }

        .logo-text {
            color: var(--logo-color);
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            text-decoration: none;
            cursor: pointer;
        }

        /* Search & Navigation */
        .search-container {
            display: none;
            padding: 16px;
            background: var(--drawer-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .search-container.active {
            display: block;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 14px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            outline: none;
            border-radius: 4px;
        }

        .search-box button {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 12px 18px;
            cursor: pointer;
            border-radius: 4px;
        }

        .search-box button svg {
            width: 20px;
            height: 20px;
            fill: var(--btn-text);
        }

        .category-menu {
            list-style: none;
        }

        .category-menu li {
            padding: 14px 10px;
            border-bottom: 1px solid var(--border-color);
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-menu li svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Main Container */
        main {
            max-width: 650px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        .filter-badge {
            display: inline-block;
            background: var(--btn-bg);
            color: var(--btn-text);
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        /* Images (Original Aspect Ratio) */
        .single-thumbnail-box {
            margin-bottom: 12px;
            position: relative;
            cursor: pointer;
            display: inline-block;
            width: 100%;
        }

        .single-thumbnail-box img {
            width: 100%;
            height: auto;
            max-height: 480px;
            object-fit: contain;
            background-color: rgba(0,0,0,0.03);
            border-radius: 6px;
            display: block;
            border: 1px solid var(--border-color);
        }

        .image-count-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
        }

        /* Article Cards in Feed */
        .article-hero, .article-list-item {
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .article-hero h2 a, .article-list-item h3 a, .article-text-only h2 a {
            color: var(--text-color);
            text-decoration: none;
            cursor: pointer;
        }

        .article-hero h2 a:hover, .article-list-item h3 a:hover, .article-text-only h2 a:hover {
            color: var(--logo-color);
            text-decoration: underline;
        }

        .article-hero h2 { font-size: 26px; line-height: 1.35; margin-bottom: 10px; font-weight: 800; }
        .article-hero p { font-size: 16px; color: var(--sub-text); line-height: 1.5; margin-bottom: 10px; }
        .article-list-item h3 { font-size: 21px; line-height: 1.35; margin-bottom: 8px; font-weight: 700; }
        .article-list-item p { font-size: 15px; color: var(--sub-text); line-height: 1.5; margin-bottom: 10px; }

        .meta-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
        .meta { font-size: 13px; color: var(--sub-text); }
        .meta span { margin-right: 8px; }
        .meta .cat-name { font-weight: bold; color: var(--text-color); }

        .article-actions { display: flex; gap: 12px; }
        .action-icon-btn {
            background: none; border: none; cursor: pointer; color: var(--sub-text);
            display: flex; align-items: center; gap: 4px; font-size: 12px;
        }
        .action-icon-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .article-text-only {
            padding: 20px; margin-bottom: 28px; border-left: 4px solid var(--logo-color);
            border-top: 1px solid var(--border-color); border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color); background: var(--card-bg); border-radius: 4px;
        }

        /* Detail View Page (Headline Click Feature) */
        .detail-view { display: none; }
        .detail-view.active { display: block; }

        .back-btn {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .detail-content h1 {
            font-size: 30px;
            line-height: 1.3;
            margin-bottom: 16px;
            font-weight: 900;
        }

        .detail-full-text {
            font-size: 18px;
            line-height: 1.7;
            color: var(--text-color);
            margin-bottom: 30px;
        }

        /* Founder / Company Bio Box */
        .bio-box {
            background: var(--bio-bg);
            border-left: 5px solid var(--logo-color);
            padding: 20px;
            border-radius: 6px;
            margin-top: 30px;
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .bio-box h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: var(--logo-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bio-box p {
            font-size: 15px;
            line-height: 1.6;
            color: var(--sub-text);
        }

        /* Lightbox Modal */
        .lightbox-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px); z-index: 2000;
            justify-content: center; align-items: center;
        }
        .lightbox-modal.active { display: flex; }
        .lightbox-content { position: relative; max-width: 92%; max-height: 85vh; }
        .lightbox-content img { max-width: 100%; max-height: 85vh; object-fit: contain; }
        .lightbox-btn {
            position: absolute; background: rgba(255, 255, 255, 0.2); color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3); font-size: 24px; width: 46px; height: 46px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%;
        }
        .lightbox-prev { left: -55px; } .lightbox-next { right: -55px; }
        .lightbox-close { top: 20px; right: 20px; position: fixed; }

        /* Admin Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .admin-card {
            background: var(--bg-color); color: var(--text-color); width: 92%; max-width: 520px;
            padding: 22px; border-radius: 8px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border-color);
        }
        .admin-card h3 { margin-bottom: 15px; font-size: 18px; border-bottom: 2px solid var(--text-color); padding-bottom: 6px; }
        .theme-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        .theme-btn { flex: 1; padding: 10px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); cursor: pointer; font-weight: bold; border-radius: 4px; }
        .theme-btn.active { background: var(--btn-bg); color: var(--btn-text); }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); font-size: 15px; border-radius: 4px; }
        .btn-submit { background: var(--btn-bg); color: var(--btn-text); border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 15px; border-radius: 4px; }
        .btn-close { background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 10px; width: 100%; cursor: pointer; margin-top: 8px; font-size: 14px; border-radius: 4px; }
        .manage-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--border-color); font-size: 14px; }
        .manage-actions { display: flex; gap: 6px; }
        .btn-action { background: var(--btn-bg); color: var(--btn-text); border: none; padding: 5px 10px; font-size: 12px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <button class="icon-btn" id="menuToggle" aria-label="Toggle Menu">
                <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
        </div>
        
        <a class="logo-text" onclick="goHome()">ORIGINELS</a>
        
        <div class="header-right">
            <button class="icon-btn" onclick="goHome()" aria-label="Home">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </button>
        </div>
    </header>

    <!-- Search Bar & Menu -->
    <div class="search-container" id="searchContainer">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search articles">
            <button onclick="handleSearch()" aria-label="Search">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
        </div>
        <ul class="category-menu" id="categoryMenuList"></ul>
    </div>

    <!-- Main Content Area -->
    <main>
        <!-- Home Feed -->
        <div id="homeView">
            <div id="filterStatus"></div>
            <div id="articlesContainer"></div>
        </div>

        <!-- Detail Article Page (Headline Click Target) -->
        <div id="detailView" class="detail-view">
            <button class="back-btn" onclick="goHome()">Back to Home</button>
            <div class="detail-content" id="detailContentContainer"></div>
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div class="lightbox-modal" id="lightboxModal">
        <button class="lightbox-btn lightbox-close" onclick="closeLightbox()">✕</button>
        <button class="lightbox-btn lightbox-prev" onclick="navigateLightbox(-1)">❮</button>
        <div class="lightbox-content">
            <img id="lightboxImage" src="" alt="Fullscreen View">
        </div>
        <button class="lightbox-btn lightbox-next" onclick="navigateLightbox(1)">❯</button>
    </div>

    <!-- Admin Panel -->
    <div class="modal-overlay" id="adminModal">
        <div class="admin-card">
            <h3>Settings & Theme</h3>
            <div class="theme-selector">
                <button class="theme-btn" id="lightBtn" onclick="setTheme('light')">Light Theme</button>
                <button class="theme-btn" id="darkBtn" onclick="setTheme('dark')">Dark Theme</button>
            </div>

            <h3 id="formHeading">Add / Edit Article</h3>
            <form id="articleForm">
                <input type="hidden" id="editingArticleId" value="">
                <div class="form-group">
                    <label>Article Headline</label>
                    <input type="text" id="postTitle" placeholder="Enter headline..." required>
                </div>
                <div class="form-group">
                    <label>Short Summary (Feed Preview)</label>
                    <textarea id="postAbout" rows="2" placeholder="Short text shown in home feed..."></textarea>
                </div>
                <div class="form-group">
                    <label>Full Article Content</label>
                    <textarea id="postFullBio" rows="5" placeholder="Detailed article text when headline is clicked..."></textarea>
                </div>
                <div class="form-group">
                    <label>Founder / Company Biography (Optional Box)</label>
                    <textarea id="postFounderBio" rows="3" placeholder="e.g. Founded in 2010 by John Doe. Headquartered in New York..."></textarea>
                </div>
                <div class="form-group">
                    <label>Upload Images (Multiple supported)</label>
                    <input type="file" id="postImage" accept="image/*" multiple>
                </div>
                <div class="form-group">
                    <label>Category Name</label>
                    <input type="text" id="postCategory" placeholder="e.g. Tech, Business, World" required>
                </div>
                <div class="form-group">
                    <label>Date / Time Stamp</label>
                    <input type="text" id="postDate" placeholder="e.g. 10 mins ago" required>
                </div>
                <div class="form-group">
                    <label>Layout Type</label>
                    <select id="postLayout">
                        <option value="hero">Main Top Banner</option>
                        <option value="standard">Standard Article</option>
                        <option value="text-only">Text Only Article</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">Save Article</button>
            </form>

            <div class="manage-section" style="margin-top: 20px;">
                <h3 style="font-size: 15px;">Manage Articles</h3>
                <div id="manageList"></div>
            </div>

            <button type="button" class="btn-close" onclick="closeAdminModal()">Close Panel</button>
        </div>
    </div>

    <script>
        

        let articles = JSON.parse(localStorage.getItem('news_articles')) || initialArticles;
        let currentCategory = 'All';

        let currentLightboxImages = [];
        let currentLightboxIndex = 0;

        const menuToggle = document.getElementById('menuToggle');
        const searchContainer = document.getElementById('searchContainer');
        const searchInput = document.getElementById('searchInput');
        const categoryMenuList = document.getElementById('categoryMenuList');
        const articlesContainer = document.getElementById('articlesContainer');
        const adminModal = document.getElementById('adminModal');
        const articleForm = document.getElementById('articleForm');
        const filterStatus = document.getElementById('filterStatus');
        const manageList = document.getElementById('manageList');
        const editingArticleId = document.getElementById('editingArticleId');
        const homeView = document.getElementById('homeView');
        const detailView = document.getElementById('detailView');
        const detailContentContainer = document.getElementById('detailContentContainer');

        function setTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark-theme');
                document.getElementById('darkBtn').classList.add('active');
                document.getElementById('lightBtn').classList.remove('active');
            } else {
                document.body.classList.remove('dark-theme');
                document.getElementById('lightBtn').classList.add('active');
                document.getElementById('darkBtn').classList.remove('active');
            }
            localStorage.setItem('news_theme', theme);
        }

        setTheme(localStorage.getItem('news_theme') || 'light');

        menuToggle.addEventListener('click', () => searchContainer.classList.toggle('active'));

        function goHome() {
            detailView.classList.remove('active');
            homeView.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleSearch() {
            const query = searchInput.value.trim().toLowerCase();
            if (query === 'edit') {
                resetForm();
                renderManageList();
                adminModal.classList.add('active');
                searchInput.value = '';
                return;
            }

            if (!query) return;

            goHome();
            const matchedResults = articles.filter(a => 
                a.title.toLowerCase().includes(query) || 
                (a.about && a.about.toLowerCase().includes(query)) ||
                a.category.toLowerCase().includes(query)
            );

            filterStatus.innerHTML = `<div class="filter-badge">Results for: "${query}" (${matchedResults.length})</div>`;
            renderArticleList(matchedResults);
            searchContainer.classList.remove('active');
        }

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });

        function closeAdminModal() {
            adminModal.classList.remove('active');
            resetForm();
        }

        const arrowSvg = `<svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>`;

        function renderCategories() {
            const categories = ['All', ...new Set(articles.map(a => a.category))];
            categoryMenuList.innerHTML = categories.map(cat => `
                <li onclick="showCategory('${cat}')">
                    <span>${cat}</span>
                    ${arrowSvg}
                </li>
            `).join('');
        }

        function showCategory(cat) {
            currentCategory = cat;
            goHome();
            filterStatus.innerHTML = cat === 'All' ? '' : `<div class="filter-badge">Category: ${cat}</div>`;
            renderArticles();
            searchContainer.classList.remove('active');
        }

        function renderArticles() {
            const filtered = currentCategory === 'All' 
                ? articles 
                : articles.filter(a => a.category.toLowerCase() === currentCategory.toLowerCase());
            
            renderArticleList(filtered);
        }

        function shareArticle(title) {
            if (navigator.share) {
                navigator.share({ title: title, url: window.location.href }).catch(() => {});
            } else {
                alert("Link copied!");
            }
        }

        function renderArticleList(list) {
            if (list.length === 0) {
                articlesContainer.innerHTML = '<p style="padding: 20px 0; color: var(--sub-text);">No articles found.</p>';
                return;
            }

            articlesContainer.innerHTML = list.map(item => {
                const imagesArray = item.images || (item.image ? [item.image] : []);
                
                let thumbnailHtml = '';
                if (imagesArray.length > 0) {
                    thumbnailHtml = `
                        <div class="single-thumbnail-box" onclick="openLightbox(${item.id}, 0)">
                            <img src="${imagesArray[0]}" alt="Article Image">
                            ${imagesArray.length > 1 ? `<div class="image-count-badge">📷 1/${imagesArray.length}</div>` : ''}
                        </div>
                    `;
                }

                const shareBtnHtml = `
                    <div class="article-actions">
                        <button class="action-icon-btn" onclick="shareArticle('${item.title.replace(/'/g, "\\'")}')">
                            <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                            Share
                        </button>
                    </div>
                `;

                if (item.layout === 'hero') {
                    return `
                        <article class="article-hero">
                            ${thumbnailHtml}
                            <h2><a onclick="openArticleDetail(${item.id})">${item.title}</a></h2>
                            ${item.about ? `<p>${item.about}</p>` : ''}
                            <div class="meta-row">
                                <div class="meta"><span>${item.date}</span> | <span class="cat-name">${item.category}</span></div>
                                ${shareBtnHtml}
                            </div>
                        </article>
                    `;
                } else {
                    return `
                        <article class="article-list-item">
                            <h3><a onclick="openArticleDetail(${item.id})">${item.title}</a></h3>
                            ${item.about ? `<p>${item.about}</p>` : ''}
                            ${thumbnailHtml}
                            <div class="meta-row">
                                <div class="meta"><span>${item.date}</span> | <span class="cat-name">${item.category}</span></div>
                                ${shareBtnHtml}
                            </div>
                        </article>
                    `;
                }
            }).join('');
        }

        /* FUNCTION TO OPEN ARTICLE + BIO WHEN CLICKING HEADLINE */
        function openArticleDetail(id) {
            const article = articles.find(a => a.id === id);
            if (!article) return;

            let imagesArray = article.images || (article.image ? [article.image] : []);
            let galleryHtml = '';
            if (imagesArray.length > 0) {
                galleryHtml = `
                    <div class="single-thumbnail-box" onclick="openLightbox(${article.id}, 0)" style="margin-bottom: 20px;">
                        <img src="${imagesArray[0]}" alt="Detail Image">
                        ${imagesArray.length > 1 ? `<div class="image-count-badge">📷 1/${imagesArray.length}</div>` : ''}
                    </div>
                `;
            }

            let bioHtml = '';
            if (article.founderBio && article.founderBio.trim() !== "") {
                bioHtml = `
                    <div class="bio-box">
                        <h3>Details</h3>
                        <p>${article.founderBio.replace(/\n/g, '<br>')}</p>
                    </div>
                `;
            }

            detailContentContainer.innerHTML = `
                ${galleryHtml}
                <h1>${article.title}</h1>
                <div class="meta" style="margin-bottom: 20px;">
                    <span>${article.date}</span> | <span class="cat-name">${article.category}</span>
                </div>
                <div class="detail-full-text">
                    ${article.fullBio ? article.fullBio.replace(/\n/g, '<br>') : (article.about || 'No full text available.')}
                </div>
                ${bioHtml}
            `;

            homeView.style.display = 'none';
            detailView.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /* Lightbox Functions */
        function openLightbox(articleId, imageIndex) {
            const article = articles.find(a => a.id === articleId);
            if (!article || !article.images || article.images.length === 0) return;

            currentLightboxImages = article.images;
            currentLightboxIndex = imageIndex;
            updateLightboxImage();
            document.getElementById('lightboxModal').classList.add('active');
        }

        function updateLightboxImage() {
            document.getElementById('lightboxImage').src = currentLightboxImages[currentLightboxIndex];
        }

        function navigateLightbox(direction) {
            currentLightboxIndex += direction;
            if (currentLightboxIndex < 0) currentLightboxIndex = currentLightboxImages.length - 1;
            else if (currentLightboxIndex >= currentLightboxImages.length) currentLightboxIndex = 0;
            updateLightboxImage();
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').classList.remove('active');
        }

        /* Edit and Manage Functions */
        function editArticle(id) {
            const articleToEdit = articles.find(a => a.id === id);
            if (!articleToEdit) return;

            editingArticleId.value = articleToEdit.id;
            document.getElementById('postTitle').value = articleToEdit.title;
            document.getElementById('postAbout').value = articleToEdit.about || '';
            document.getElementById('postFullBio').value = articleToEdit.fullBio || '';
            document.getElementById('postFounderBio').value = articleToEdit.founderBio || '';
            document.getElementById('postCategory').value = articleToEdit.category;
            document.getElementById('postDate').value = articleToEdit.date;
            document.getElementById('postLayout').value = articleToEdit.layout || 'standard';

            document.getElementById('formHeading').innerText = "Edit Article";
            document.getElementById('submitBtn').innerText = "Update Article";

            adminModal.scrollTop = 0;
        }

        function resetForm() {
            editingArticleId.value = '';
            articleForm.reset();
            document.getElementById('formHeading').innerText = "Add Article";
            document.getElementById('submitBtn').innerText = "Save Article";
        }

        function deleteArticle(id) {
            articles = articles.filter(a => a.id !== id);
            localStorage.setItem('news_articles', JSON.stringify(articles));
            renderCategories();
            renderArticles();
            renderManageList();
            goHome();
        }

        function renderManageList() {
            if (articles.length === 0) {
                manageList.innerHTML = '<p style="font-size:13px; color:var(--sub-text);">No articles available.</p>';
                return;
            }
            manageList.innerHTML = articles.map(item => `
                <div class="manage-item">
                    <span style="font-weight:bold; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.title}</span>
                    <div class="manage-actions">
                        <button class="btn-action" onclick="editArticle(${item.id})">Edit</button>
                        <button class="btn-action" onclick="deleteArticle(${item.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        articleForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const editId = editingArticleId.value;
            const title = document.getElementById('postTitle').value;
            const about = document.getElementById('postAbout').value;
            const fullBio = document.getElementById('postFullBio').value;
            const founderBio = document.getElementById('postFounderBio').value;
            const category = document.getElementById('postCategory').value.trim();
            const date = document.getElementById('postDate').value;
            const layout = document.getElementById('postLayout').value;
            const imageInput = document.getElementById('postImage');

            const files = Array.from(imageInput.files);
            let uploadedImages = [];

            if (files.length > 0) {
                const readAsBase64 = (file) => new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
                uploadedImages = await Promise.all(files.map(readAsBase64));
            }

            if (editId) {
                const index = articles.findIndex(a => a.id == editId);
                if (index !== -1) {
                    articles[index].title = title;
                    articles[index].about = about;
                    articles[index].fullBio = fullBio;
                    articles[index].founderBio = founderBio;
                    articles[index].category = category;
                    articles[index].date = date;
                    articles[index].layout = layout;
                    
                    if (uploadedImages.length > 0) {
                        articles[index].images = uploadedImages;
                    }
                }
            } else {
                const newArticle = {
                    id: Date.now(),
                    title,
                    about,
                    fullBio,
                    founderBio,
                    images: uploadedImages,
                    category,
                    date,
                    layout
                };
                articles.unshift(newArticle);
            }

            localStorage.setItem('news_articles', JSON.stringify(articles));

            renderCategories();
            renderArticles();
            renderManageList();
            closeAdminModal();
            goHome();
        });

        renderCategories();
        renderArticles();
    </script>
</body>
</html>
