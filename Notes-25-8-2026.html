<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Personal AI</title>

<style>
:root {
    --bg: #212121;
    --sidebar: #171717;
    --input: #2f2f2f;
    --border: #444;
    --text: #ececec;
    --muted: #a0a0a0;
    --green: #10a37f;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* APP */

.app {
    display: flex;
    height: 100vh;
    width: 100%;
    overflow: hidden;
}

/* SIDEBAR */

.sidebar {
    width: 260px;
    background: var(--sidebar);
    border-right: 1px solid #292929;
    display: flex;
    flex-direction: column;
    padding: 12px;
}

.new-chat {
    width: 100%;
    padding: 13px;
    border: 1px solid #444;
    background: transparent;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
}

.new-chat:hover {
    background: #2a2a2a;
}

.sidebar-title {
    margin: 25px 8px 10px;
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
}

.data-box {
    background: #222;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 10px;
}

.data-box textarea {
    width: 100%;
    height: 150px;
    background: transparent;
    color: white;
    border: none;
    outline: none;
    resize: none;
    font-size: 13px;
}

.save-data {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 7px;
    background: var(--green);
    color: white;
    cursor: pointer;
}

.sidebar-bottom {
    margin-top: auto;
    color: #888;
    font-size: 12px;
    padding: 8px;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

/* HEADER */

.header {
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid #333;
    position: relative;
    flex-shrink: 0;
}

.header-title {
    font-size: 17px;
    font-weight: 600;
}

.header-menu {
    position: absolute;
    right: 18px;
    font-size: 20px;
    color: #aaa;
    cursor: pointer;
}

/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    scroll-behavior: smooth;
}

.chat-inner {
    max-width: 850px;
    margin: auto;
    padding: 30px 20px 160px;
}

/* WELCOME */

.welcome {
    min-height: 55vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.welcome-content h1 {
    font-size: 34px;
    margin-bottom: 12px;
}

.welcome-content p {
    color: var(--muted);
    font-size: 15px;
}

/* MESSAGE */

.message {
    display: flex;
    gap: 14px;
    margin: 28px 0;
    animation: messageIn .35s ease;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.avatar {
    width: 32px;
    height: 32px;
    min-width: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: bold;
}

.user-avatar {
    background: #555;
}

.ai-avatar {
    background: var(--green);
}

.message-content {
    line-height: 1.7;
    font-size: 15px;
    max-width: 760px;
    white-space: pre-wrap;
}

/* TYPING */

.typing {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 8px 0;
}

.dot {
    width: 7px;
    height: 7px;
    background: #aaa;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
}

.dot:nth-child(2) {
    animation-delay: .15s;
}

.dot:nth-child(3) {
    animation-delay: .3s;
}

@keyframes bounce {
    0%, 60%, 100% {
        transform: translateY(0);
    }

    30% {
        transform: translateY(-6px);
    }
}

/* INPUT AREA */

.input-wrapper {
    position: fixed;
    bottom: 0;
    left: 260px;
    right: 0;
    background: linear-gradient(
        transparent,
        var(--bg) 35%
    );
    padding: 30px 20px 20px;
}

.input-container {
    max-width: 850px;
    margin: auto;
}

.input-box {
    display: flex;
    align-items: flex-end;
    background: var(--input);
    border: 1px solid #555;
    border-radius: 18px;
    padding: 10px 12px;
    box-shadow: 0 5px 25px rgba(0,0,0,.25);
}

.input-box:focus-within {
    border-color: #777;
}

#question {
    flex: 1;
    background: transparent;
    color: white;
    border: none;
    outline: none;
    resize: none;
    max-height: 180px;
    min-height: 25px;
    font-size: 15px;
    line-height: 1.5;
    padding: 5px 8px;
}

.send {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    border: none;
    background: white;
    color: #222;
    cursor: pointer;
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.send:hover {
    background: #ddd;
}

.send:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.disclaimer {
    text-align: center;
    color: #777;
    font-size: 11px;
    margin-top: 8px;
}

/* MOBILE */

@media (max-width: 700px) {

    .sidebar {
        display: none;
    }

    .header {
        height: 54px;
    }

    .chat-inner {
        padding: 20px 15px 150px;
    }

    .welcome-content h1 {
        font-size: 27px;
    }

    .input-wrapper {
        left: 0;
        padding: 20px 12px 12px;
    }

    .input-box {
        border-radius: 16px;
    }

    .message-content {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <button class="new-chat" onclick="newChat()">
            ＋ New chat
        </button>

        <div class="sidebar-title">
            Personal Data
        </div>

        <div class="data-box">

            <textarea
                id="personalData"
                placeholder="Enter your personal information here...

Example:
My name is Rahul.
I live in Assam.
I am a web developer.
I like JavaScript.
My favorite color is blue.
I want to learn AI."
            ></textarea>

            <button
                class="save-data"
                onclick="savePersonalData()"
            >
                Save data
            </button>

        </div>

        <div class="sidebar-bottom">
            Personal AI • Local data
        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <!-- HEADER -->

        <header class="header">

            <div class="header-title">
                Personal AI
            </div>

            <div class="header-menu">
                ⋯
            </div>

        </header>


        <!-- CHAT -->

        <section class="chat" id="chat">

            <div class="chat-inner" id="chatInner">

                <div class="welcome" id="welcome">

                    <div class="welcome-content">

                        <h1>
                            How can I help you?
                        </h1>

                        <p>
                            Ask anything about your personal data.
                        </p>

                    </div>

                </div>

            </div>

        </section>


        <!-- INPUT -->

        <div class="input-wrapper">

            <div class="input-container">

                <div class="input-box">

                    <textarea
                        id="question"
                        rows="1"
                        placeholder="Message Personal AI..."
                        oninput="resizeInput(this)"
                        onkeydown="handleKey(event)"
                    ></textarea>

                    <button
                        class="send"
                        id="send"
                        onclick="sendMessage()"
                    >
                        ↑
                    </button>

                </div>

                <div class="disclaimer">
                    Personal AI can make mistakes. Check important information.
                </div>

            </div>

        </div>

    </main>

</div>


<script>

/* =========================
   DATA
========================= */

let personalData =
    localStorage.getItem("personalAIData") || "";

document.getElementById("personalData").value =
    personalData;


/* =========================
   SAVE DATA
========================= */

function savePersonalData() {

    personalData =
        document.getElementById("personalData").value.trim();

    localStorage.setItem(
        "personalAIData",
        personalData
    );

    alert("Personal data saved.");
}


/* =========================
   NEW CHAT
========================= */

function newChat() {

    document.getElementById("chatInner").innerHTML = `

        <div class="welcome" id="welcome">

            <div class="welcome-content">

                <h1>
                    How can I help you?
                </h1>

                <p>
                    Ask anything about your personal data.
                </p>

            </div>

        </div>

    `;

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(text, type) {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const chatInner =
        document.getElementById("chatInner");

    const message =
        document.createElement("div");

    message.className = "message";

    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar " +
        (type === "user"
            ? "user-avatar"
            : "ai-avatar");

    avatar.textContent =
        type === "user"
            ? "U"
            : "AI";

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    content.textContent = text;

    message.appendChild(avatar);
    message.appendChild(content);

    chatInner.appendChild(message);

    document.getElementById("chat").scrollTop =
        document.getElementById("chat").scrollHeight;

    return content;
}


/* =========================
   FIND RELATED DATA
========================= */

function findRelatedData(question) {

    if (!personalData) {
        return [];
    }

    const questionWords =
        question
        .toLowerCase()
        .replace(/[^\w\s]/g, "")
        .split(/\s+/)
        .filter(word => word.length > 2);

    const sentences =
        personalData
        .split(/[.!?\n]+/)
        .map(x => x.trim())
        .filter(Boolean);

    let results = [];

    sentences.forEach(sentence => {

        const words =
            sentence
            .toLowerCase()
            .replace(/[^\w\s]/g, "")
            .split(/\s+/);

        let score = 0;

        questionWords.forEach(word => {

            if (words.includes(word)) {
                score++;
            }

        });

        if (score > 0) {

            results.push({
                sentence: sentence,
                score: score
            });

        }

    });

    results.sort(
        (a, b) => b.score - a.score
    );

    return results.slice(0, 5);
}


/* =========================
   AI ANSWER
========================= */

function generateAnswer(question) {

    if (!personalData) {

        return "Please add your personal data first.";

    }

    const related =
        findRelatedData(question);

    if (related.length === 0) {

        return "I couldn't find related information in your personal data.";

    }

    let answer =
        "Based on your personal data:\n\n";

    related.forEach(item => {

        answer +=
            "• " +
            item.sentence +
            "\n";

    });

    return answer;
}


/* =========================
   TYPING ANIMATION
========================= */

function showTyping() {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    const chatInner =
        document.getElementById("chatInner");

    const message =
        document.createElement("div");

    message.className =
        "message";

    message.id =
        "typingMessage";

    message.innerHTML = `

        <div class="avatar ai-avatar">
            AI
        </div>

        <div class="message-content">

            <div class="typing">

                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>

            </div>

        </div>

    `;

    chatInner.appendChild(message);

    document.getElementById("chat").scrollTop =
        document.getElementById("chat").scrollHeight;
}


/* =========================
   SEND MESSAGE
========================= */

function sendMessage() {

    const input =
        document.getElementById("question");

    const question =
        input.value.trim();

    if (!question) {
        return;
    }

    addMessage(
        question,
        "user"
    );

    input.value = "";

    resizeInput(input);

    document.getElementById("send").disabled =
        true;

    showTyping();

    setTimeout(() => {

        const typing =
            document.getElementById("typingMessage");

        if (typing) {
            typing.remove();
        }

        const answer =
            generateAnswer(question);

        typeAnswer(answer);

        document.getElementById("send").disabled =
            false;

    }, 800);
}


/* =========================
   TYPE ANSWER
========================= */

function typeAnswer(text) {

    const content =
        addMessage("", "ai");

    let index = 0;

    const speed = 15;

    function type() {

        if (index < text.length) {

            content.textContent +=
                text.charAt(index);

            index++;

            document.getElementById("chat").scrollTop =
                document.getElementById("chat").scrollHeight;

            setTimeout(type, speed);

        }

    }

    type();
}


/* =========================
   ENTER KEY
========================= */

function handleKey(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }
}


/* =========================
   AUTO RESIZE
========================= */

function resizeInput(element) {

    element.style.height = "auto";

    element.style.height =
        Math.min(
            element.scrollHeight,
            180
        ) + "px";
}

</script>

</body>
</html>
