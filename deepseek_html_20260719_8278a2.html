<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OpenCLOCK</title>
    <style>
        /* ─── EASY COLOR CONFIG (ORIGINAL) ─── */
        :root {
            --logo-circle-bg: #000000;
            --sq-12-oclock: #ff3b30;
            --sq-1-30-oclock: #ff2d55;
            --sq-3-oclock: #af52de;
            --sq-4-30-oclock: #5856d6;
            --sq-6-oclock: #007aff;
            --sq-7-30-oclock: #34c759;
            --sq-9-oclock: #ffcc00;
            --sq-10-30-oclock: #ff9500;
        }

        * {
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }

        /* ─── SPLASH (ORIGINAL LOGO & ANIMATION) ─── */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }
        .splash-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
        }
        .splash-circle {
            width: 60px;
            height: 60px;
            transform-origin: center;
            animation: spinCircle 1.3s ease forwards;
        }
        .splash-text {
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
            opacity: 0;
            max-width: 0;
            overflow: hidden;
            white-space: nowrap;
            transition: max-width 0.8s ease, opacity 0.6s ease;
        }
        .reveal-active .splash-text {
            opacity: 1;
            max-width: 300px;
            margin-left: 15px;
        }
        @keyframes spinCircle {
            0% { transform: scale(0.2) rotate(0deg); opacity: 0; }
            60% { transform: scale(1.1) rotate(240deg); opacity: 1; }
            100% { transform: scale(1) rotate(360deg); opacity: 1; }
        }

        /* ─── HEADER (ORIGINAL) ─── */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #111;
            z-index: 10;
        }
        .menu-icon,
        .search-icon {
            width: 24px;
            height: 24px;
            stroke: #fff;
            cursor: pointer;
            fill: none;
        }
        header h3 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* ─── SLIDE MENU ─── */
        #slide-menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 8000;
            display: none;
            backdrop-filter: blur(2px);
        }
        #slide-menu {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100dvh;
            background: #121315;
            z-index: 8001;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2c2d30;
        }
        #slide-menu.open {
            left: 0;
        }
        .slide-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 25px 20px 20px;
            border-bottom: 1px solid #222;
        }
        .slide-header .splash-circle {
            width: 40px;
            height: 40px;
            animation: none;
            transform: none;
        }
        .slide-header h2 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
        }
        .menu-btn {
            background: transparent;
            border: none;
            color: #fff;
            text-align: left;
            padding: 15px 20px;
            font-size: 1.05rem;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .menu-btn:hover {
            background: #1a1c1e;
        }
        .recent-label {
            font-size: 0.85rem;
            color: #888;
            margin: 15px 20px 5px;
            font-weight: 700;
            text-transform: uppercase;
        }
        #chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .chat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 8px;
            margin: 0 10px;
        }
        .chat-item:hover {
            background: #1a1c1e;
        }
        .chat-item span {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ccc;
            font-size: 0.95rem;
        }
        .chat-delete-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 5px;
            font-weight: bold;
        }
        .chat-delete-btn:hover {
            color: #ff3b30;
        }
        .menu-footer {
            border-top: 1px solid #222;
            padding: 10px 0;
        }

        /* ─── FULL SCREEN OVERLAYS (FILE & DATABASE) ─── */
        .feature-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 7500;
            display: none;
            flex-direction: column;
        }
        .feature-header {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #222;
            background: #0d0e10;
        }
        .feature-header h3 {
            margin: 0;
            flex: 1;
            text-align: center;
            font-size: 1.2rem;
        }
        .feature-back {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 5px;
        }

        /* File Manager Interface */
        #file-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .add-file-section {
            background: #161719;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #2c2d30;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .file-input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .file-input-group label {
            font-size: 0.85rem;
            color: #aaa;
            font-weight: 600;
        }
        .file-input-group input {
            background: #000;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }
        .add-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .saved-file-card {
            background: #161719;
            border: 1px solid #2c2d30;
            padding: 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .saved-file-card img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            background: #222;
        }
        .saved-file-info {
            flex: 1;
            overflow: hidden;
        }
        .saved-file-name {
            font-weight: 600;
            font-size: 1.05rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .download-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* Database Manager Interface */
        #db-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 20px;
        }
        .db-box-main {
            background: #161719;
            border: 1px solid #2c2d30;
            border-radius: 20px;
            padding: 40px 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }
        .db-year {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #222;
            color: #888;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 10px;
            font-weight: bold;
        }
        .db-number {
            font-size: 3.5rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 5px;
        }
        .db-text {
            font-size: 1.2rem;
            color: #aaa;
            font-weight: 600;
        }
        .db-action-row {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }
        .db-btn-dl {
            flex: 1;
            background: #007aff;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
        }
        .db-btn-del {
            flex: 1;
            background: #ff3b30;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
        }

        /* Chat File Card */
        .chat-file-card {
            background: #202124;
            border: 1px solid #3c4043;
            padding: 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            width: max-content;
            max-width: 100%;
        }
        .chat-file-card img {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .chat-file-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
            margin-right: 10px;
        }

        .install-banner {
            display: none;
            position: fixed;
            top: 15px;
            left: 5%;
            right: 5%;
            background: #1e1f22;
            border: 1px solid #3c4043;
            padding: 12px 18px;
            border-radius: 16px;
            z-index: 1000;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .install-text {
            font-size: 0.95rem;
            font-weight: 500;
        }
        .install-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        img, .user-msg img, .ai-msg img, .wiki-cover-img, .card-thumb, .preview-container img, .gallery-img {
            animation: none !important;
            transition: none !important;
            transform: none !important;
        }

        /* ─── CHAT (ORIGINAL) ─── */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 140px;
            scroll-behavior: smooth;
        }
        .user-msg {
            background: #2f3032;
            color: #fff;
            padding: 12px 24px;
            border-radius: 25px;
            align-self: flex-end;
            max-width: 75%;
            word-wrap: break-word;
            font-size: 1.05rem;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
        }
        .user-msg img {
            max-width: 180px;
            border-radius: 12px;
            display: block;
            cursor: pointer;
        }
        .ai-msg {
            color: #fff;
            padding: 5px 10px;
            align-self: flex-start;
            max-width: 90%;
            font-size: 1.1rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            display: flex;
            flex-direction: column;
        }
        .ai-msg img {
            max-width: 100%;
            max-height: 280px;
            border-radius: 16px;
            display: block;
            margin-bottom: 12px;
            cursor: pointer;
            border: 1px solid #222;
        }

        /* ─── FALLBACK MESSAGE ─── */
        .ai-msg.fallback-msg {
            background: #1a1a1c;
            border: 1px solid #333;
            border-radius: 18px;
            padding: 16px 22px;
            font-size: 1rem;
            color: #bbb;
            max-width: 85%;
        }
        .ai-msg.fallback-msg strong {
            color: #fff;
        }
        .ai-msg.fallback-msg .hint {
            color: #888;
            font-size: 0.9rem;
            margin-top: 8px;
            display: block;
        }

        /* ─── CHAT INPUT (ORIGINAL) ─── */
        .input-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px 20px 25px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.95) 25%, #000 100%);
            z-index: 5;
        }
        .input-container {
            background: #000;
            border-radius: 35px;
            display: flex;
            align-items: center;
            padding: 6px 10px;
            border: 1.5px solid #fff;
            max-width: 650px;
            margin: 0 auto;
        }
        input[type="text"] {
            background: transparent;
            border: none;
            color: #fff;
            flex: 1;
            padding: 12px 15px;
            outline: none;
            font-size: 1.1rem;
            min-width: 0;
        }
        .icon-btn {
            background: none;
            border: none;
            color: #80868b;
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .icon-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }
        #sendBtn {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        /* ─── MODALS & SEARCH PAD OVERLAY & OTHERS (ALL ORIGINAL) ─── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #202124;
            padding: 25px;
            border-radius: 15px;
            width: 85%;
            max-width: 400px;
            border: 1px solid #444;
        }
        .modal-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #111;
            border: 1px solid #555;
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }
        .modal-input:focus {
            border-color: #888;
        }
        textarea.modal-input {
            font-family: inherit;
            resize: none;
        }
        .preview-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .preview-container img {
            max-height: 120px;
            border-radius: 8px;
            border: 1px solid #555;
            cursor: pointer;
        }

        #search-device-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 500;
            display: none;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .search-pad-header {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 650px;
            width: 100%;
            margin: 10px auto 15px;
            flex-wrap: wrap;
        }
        .search-pad-container {
            flex: 1;
            background: #000;
            border-radius: 35px;
            display: flex;
            align-items: center;
            padding: 6px 15px;
            border: 1.5px solid #fff;
            min-width: 150px;
        }
        .search-pad-container input {
            background: transparent;
            border: none;
            color: #fff;
            padding: 10px 5px;
            font-size: 1.1rem;
            outline: none;
            width: 100%;
        }
        #edit-mode-status {
            display: none;
            text-align: center;
            color: #ff3b30;
            font-weight: bold;
            font-size: 0.95rem;
            border: 1px dashed #ff3b30;
            padding: 5px;
            border-radius: 10px;
            max-width: 650px;
            margin: 0 auto 15px;
        }
        #create-new-btn {
            display: none;
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            margin: 0 auto 15px;
            width: max-content;
            font-size: 1rem;
        }

        #search-results-feed {
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .clean-data-card {
            background: #121315;
            border: 1px solid #232528;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
        }
        .card-main-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .card-thumb {
            width: 55px;
            height: 55px;
            border-radius: 10px;
            object-fit: cover;
            background: #202124;
            flex-shrink: 0;
            border: 1px solid #333;
            cursor: pointer;
        }
        .card-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            flex: 1;
        }
        .card-title {
            font-weight: 700;
            font-size: 1.15rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-desc {
            font-size: 0.95rem;
            color: #9aa0a6;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        #wiki-detail-view {
            display: none;
            background: #1c1c1e;
            border-radius: 20px;
            overflow-y: auto;
            max-height: 85vh;
            -webkit-overflow-scrolling: touch;
            max-width: 650px;
            width: 90%;
            margin: 20px auto;
            flex-direction: column;
            position: relative;
            border: 1px solid #2c2c2e;
        }

        #advanced-form-card {
            display: none;
            background: #161719;
            border: 1px solid #2c2d30;
            border-radius: 16px;
            padding: 20px;
            max-width: 650px;
            width: 100%;
            margin: 0 auto 20px;
            box-sizing: border-box;
            flex-direction: column;
            gap: 15px;
        }
        .form-image-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: #0d0e10;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #232528;
            width: 110px;
            position: relative;
        }
        .form-image-slot img {
            width: 90px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #333;
            cursor: pointer;
        }
        .form-image-slot .no-img-placeholder {
            width: 90px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #121315;
            border-radius: 8px;
            border: 1px dashed #444;
            font-size: 0.8rem;
            color: #666;
            text-align: center;
        }

        #gallery-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 6000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #gallery-overlay .gallery-close {
            position: absolute;
            top: 20px;
            right: 24px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(12px);
        }
        #gallery-overlay .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 2.2rem;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(8px);
            transition: background 0.2s;
        }
        #gallery-overlay .gallery-arrow.left {
            left: 16px;
        }
        #gallery-overlay .gallery-arrow.right {
            right: 16px;
        }
        #gallery-overlay .gallery-img-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
            box-sizing: border-box;
        }
        #gallery-overlay .gallery-img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }
        #gallery-overlay .gallery-counter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 18px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .row-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .row-controls .row-hide-btn {
            background: #2a1a1a;
            color: #ff453a;
            border: 1px solid #4a2a2a;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }
        .row-controls .row-hide-btn.unhide {
            background: #1a2a1a;
            color: #34c759;
            border: 1px solid #2a4a2a;
        }
    </style>
</head>
<body>

    <!-- SPLASH -->

    <!-- SEARCH PAD OVERLAY -->

            </div>

            <div style="display:flex;flex-direction:column;gap:6px;margin-top:10px;"><label style="font-size:0.9rem;color:#aaa;font-weight:600;">About</label><textarea id="form-about" style="background:#000;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;font-size:0.95rem;outline:none;font-family:inherit;resize:none;" rows="4" placeholder="Write detailed info..."></textarea></div>

            <div style="display:flex;gap:10px;margin-top:15px;">

    <!-- GALLERY OVERLAY -->
    <div id="gallery-overlay" onclick="if(event.target===this)closeGallery()">
        <button class="gallery-close" onclick="closeGallery()">✕</button>
        <button class="gallery-arrow left" onclick="galleryNavigate(-1)">‹</button>
        <button class="gallery-arrow right" onclick="galleryNavigate(1)">›</button>
        <div class="gallery-img-container"><img id="gallery-main-img" src="" alt="" /></div>
        <div class="gallery-counter" id="gallery-counter">1 / 1</div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const searchBox = document.getElementById('searchBox');

        let db = {};
        let editModeActive = false;
        let lastImageForEdit = null;
        let lastQuery = "";
        let currentContext = null;

        let animationTimeout = null;
        let isAnimating = false;
        let currentTypingText = "";
        let currentTypingIndex = 0;
        let currentTypingElement = null;

        let pendingChatImage = null;

        // ─── FILE DOWNLOAD COMMANDS ───
        const fileCommands = ["download", "file", "install"];

        // ─── GALLERY STATE ───
        let galleryImages = [];
        let galleryIndex = 0;

        // ─── CHAT SESSIONS STATE ───
        let currentChatId = localStorage.getItem('oc_current_chat') || Date.now().toString();

        // ─── INDEXEDDB ───
        let dbInstance = null;
        const DB_NAME = "OpenClockDB";
        const STORE_NAME = "dataStore";

        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = function(e) {
            if (!e.target.result.objectStoreNames.contains(STORE_NAME)) {
                e.target.result.createObjectStore(STORE_NAME);
            }
        };
        req.onsuccess = function(e) {
            dbInstance = e.target.result;
            loadAllDataFromDB();
        };

        function loadAllDataFromDB() {
            if (!dbInstance) return;
            const tx = dbInstance.transaction([STORE_NAME], "readonly");
            const cursorReq = tx.objectStore(STORE_NAME).openCursor();
            db = {};
            cursorReq.onsuccess = function(event) {
                const cursor = event.target.result;
                if (cursor) {
                    db[cursor.key] = cursor.value;
                    cursor.continue();
                } else {
                    updateDbCount();
                    renderFileList();
                }
            };
        }

        function persistData(key, value) {
            if (dbInstance) {
                dbInstance.transaction([STORE_NAME], "readwrite").objectStore(STORE_NAME).put(value, key).onsuccess =
                () => {
                    updateDbCount();
                };
            }
        }

        function clearLocalDatabase() {
            if (confirm("🚨 Clear complete local app database store?")) {
                dbInstance.transaction([STORE_NAME], "readwrite").objectStore(STORE_NAME).clear().onsuccess = function() {
                    db = {};
                    chatContainer.innerHTML = "";
                    updateDbCount();
                    renderFileList();
                    alert("🗑️ All data wiped out safely.");
                };
            }
        }

        // ─── CHAT SAVING (with metadata for chat names) ───
        function saveChatHistory() {
            let chats = JSON.parse(localStorage.getItem('oc_chats') || '{}');
            let meta = JSON.parse(localStorage.getItem('oc_chats_meta') || '{}');

            chats[currentChatId] = chatContainer.innerHTML;
            localStorage.setItem('oc_chats', JSON.stringify(chats));

            // Extract first user message as chat title
            const container = document.createElement('div');
            container.innerHTML = chatContainer.innerHTML;
            const userMsgs = container.querySelectorAll('.user-msg');
            if (userMsgs.length > 0) {
                const firstUserMsg = userMsgs[0];
                let textDiv = firstUserMsg.querySelector('div:not(:has(img))');
                if (!textDiv) {
                    if (firstUserMsg.querySelector('img')) {
                        meta[currentChatId] = '📷 Image';
                    } else {
                        meta[currentChatId] = 'Chat ' + new Date(parseInt(currentChatId)).toLocaleTimeString();
                    }
                } else {
                    let name = textDiv.innerText.trim();
                    if (name.length > 40) name = name.substring(0, 38) + '…';
                    meta[currentChatId] = name || 'Chat ' + new Date(parseInt(currentChatId)).toLocaleTimeString();
                }
            } else {
                meta[currentChatId] = 'Chat ' + new Date(parseInt(currentChatId)).toLocaleTimeString();
            }

            localStorage.setItem('oc_chats_meta', JSON.stringify(meta));
            localStorage.setItem('oc_current_chat', currentChatId);
            renderChatList();
        }

        function renderChatList() {
            const list = document.getElementById('chat-list');
            list.innerHTML = "";
            let chats = JSON.parse(localStorage.getItem('oc_chats') || '{}');
            let meta = JSON.parse(localStorage.getItem('oc_chats_meta') || '{}');

            const ids = Object.keys(chats).sort((a, b) => parseInt(b) - parseInt(a));

            for (let id of ids) {
                const div = document.createElement('div');
                div.className = 'chat-item';
                const displayName = meta[id] || 'Chat ' + new Date(parseInt(id)).toLocaleTimeString();
                div.innerHTML = `
                    <span onclick="loadChat('${id}')">${displayName}</span>
                    <button class="chat-delete-btn" onclick="deleteChat('${id}', event)">⋮</button>
                `;
                list.appendChild(div);
            }
        }

        function loadChat(id) {
            let chats = JSON.parse(localStorage.getItem('oc_chats') || '{}');
            if (chats[id]) {
                currentChatId = id;
                chatContainer.innerHTML = chats[id];
                chatContainer.scrollTo({ top: chatContainer.scrollHeight });
                localStorage.setItem('oc_current_chat', currentChatId);
                toggleSlideMenu();
            }
        }

        function deleteChat(id, event) {
            event.stopPropagation();
            if (confirm("Delete this chat?")) {
                let chats = JSON.parse(localStorage.getItem('oc_chats') || '{}');
                let meta = JSON.parse(localStorage.getItem('oc_chats_meta') || '{}');
                delete chats[id];
                delete meta[id];
                localStorage.setItem('oc_chats', JSON.stringify(chats));
                localStorage.setItem('oc_chats_meta', JSON.stringify(meta));
                if (currentChatId === id) {
                    chatContainer.innerHTML = '';
                    currentChatId = Date.now().toString();
                }
                renderChatList();
            }
        }

        function startNewChat() {
            currentChatId = Date.now().toString();
            chatContainer.innerHTML = '';
            saveChatHistory();
            toggleSlideMenu();
        }

        // ─── SLIDE MENU ───
        function toggleSlideMenu() {
            const menu = document.getElementById('slide-menu');
            const overlay = document.getElementById('slide-menu-overlay');
            if (menu.classList.contains('open')) {
                menu.classList.remove('open');
                overlay.style.display = 'none';
            } else {
                menu.classList.add('open');
                overlay.style.display = 'block';
                renderChatList();
            }
        }

        // ─── OPENCLOCK FILE INTERFACE ───
        function openFileInterface() {
            document.getElementById('file-interface').style.display = 'flex';
            toggleSlideMenu();
            renderFileList();
        }

        function closeFileInterface() { document.getElementById('file-interface').style.display = 'none'; }

        function addCustomFile() {
            const thumbInput = document.getElementById('file-thumb').files[0];
            const nameInput = document.getElementById('file-name').value.trim();
            const dataInput = document.getElementById('file-data').files[0];

            if (!thumbInput || !nameInput || !dataInput) { alert("Please fill Thumbnail, Name and Upload a File!"); return; }

            const key = "file_" + nameInput.toLowerCase().replace(/\s+/g, '_');

            const readerThumb = new FileReader();
            readerThumb.onload = (e) => {
                const thumbB64 = e.target.result;
                const readerData = new FileReader();
                readerData.onload = (ev) => {
                    const dataB64 = ev.target.result;
                    const fileObj = {
                        type: 'custom_file',
                        id: key,
                        name: nameInput,
                        thumb: thumbB64,
                        data: dataB64,
                        filename: dataInput.name
                    };
                    db[key] = fileObj;
                    persistData(key, fileObj);

                    document.getElementById('file-thumb').value = "";
                    document.getElementById('file-name').value = "";
                    document.getElementById('file-data').value = "";
                    renderFileList();
                };
                readerData.readAsDataURL(dataInput);
            };
            readerThumb.readAsDataURL(thumbInput);
        }

        function renderFileList() {
            const list = document.getElementById('saved-files-list');
            if (!list) return;
            list.innerHTML = "";
            for (let key in db) {
                if (db[key] && db[key].type === 'custom_file') {
                    const f = db[key];
                    const div = document.createElement('div');
                    div.className = 'saved-file-card';
                    div.innerHTML = `
                        <img src="${f.thumb}" alt="thumb"/>
                        <div class="saved-file-info"><div class="saved-file-name">${f.name}</div></div>
                        <button class="download-btn" onclick="downloadCustomFile('${key}')">Download</button>
                    `;
                    list.appendChild(div);
                }
            }
        }

        function downloadCustomFile(key) {
            const f = db[key];
            if (f && f.data) {
                const a = document.createElement('a');
                a.href = f.data;
                a.download = f.filename || f.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        }

        // ─── OPENCLOCK DATABASE INTERFACE ───
        function openDbInterface() {
            updateDbCount();
            document.getElementById('db-interface').style.display = 'flex';
            toggleSlideMenu();
        }

        function closeDbInterface() { document.getElementById('db-interface').style.display = 'none'; }

        function updateDbCount() {
            const count = Object.keys(db).length;
            const el = document.getElementById('db-total-count');
            if (el) el.innerText = count;
        }

        function exportDatabase() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", "openclock_database.json");
            document.body.appendChild(a);
            a.click();

        // ─── GALLERY ───
        function openGallery(images, startIdx) {

            const overlay = document.getElementById('gallery-overlay');

        function updateGalleryImage() {
            const img = document.getElementById('gallery-main-img');
            if (galleryImages.length > 0 && galleryIndex >= 0 && galleryIndex < galleryImages.length) { img.src =
                    galleryImages[galleryIndex]; }
            document.getElementById('gallery-counter').textContent = (galleryIndex + 1) + ' / ' + galleryImages.length;
            document.querySelector('.gallery-arrow.left').style.visibility = galleryImages.length > 1 ? 'visible' :
            'hidden';
            document.querySelector('.gallery-arrow.right').style.visibility = galleryImages.length > 1 ? 'visible' :
                'hidden';

        function galleryNavigate(dir) {

                if (container) {
                    const imgs = container.querySelectorAll('img');

                    if (idx !== -1 && urls.length > 0) { e.stopPropagation();
                        openGallery(urls, idx); return; }
                }
                if (target.classList && target.classList.contains('card-thumb')) {
                    const card = target.closest('.clean-data-card');

        function performPadSearch(e) {
            const raw = e.target.value.trim();
            const query = raw.toLowerCase();
            const feed = document.getElementById('search-results-feed');
            const wiki = document.getElementById('wiki-detail-view');
            feed.innerHTML = "";
            wiki.style.display = 'none';
            if (query === 'edit') { e.target.value = '';
                toggleEditMode(); return; }
            if (!query && !editModeActive) return;

            for (let key in db) {
                const item = db[key];
                if (!item || item.type === 'custom_file') continue;
                let title = key;
                let desc = "";
                let qs = "";
                if (typeof item === 'object') { title = item.title || item.name || key;
                    desc = item.shortDesc || item.about || item.text || "";
                    if (item.questions) qs = item.questions.join(" "); } else { desc = item; }
                const searchStr = (title + " " + desc + " " + qs).toLowerCase();
                if (!query || searchStr.includes(query)) {
                    const card = document.createElement('div');
                    card.className = 'clean-data-card';
                    card.dataset.key = key;
                    card.onclick = () => { showSearchWikiCard(key, item); };
                    const imgs = (item && typeof item === 'object') ? (item.images || (item.src ? [item.src] : [])) :
                    [];
                    let thumb = "";
                    if (imgs.length > 0) thumb = `<img class="card-thumb" src="${imgs[0]}" alt="" />`;
                    let controls = "";
                    if (editModeActive) {
                        controls =
                            `<div style="display:flex;gap:10px;margin-top:5px;flex-wrap:wrap;"><button style="background:#007aff;color:#fff;border:none;padding:6px 14px;border-radius:8px;font-weight:bold;cursor:pointer;" onclick="event.stopPropagation();editCard('${key}')">Edit</button><button style="background:#ff3b30;color:#fff;border:none;padding:6px 14px;border-radius:8px;font-weight:bold;cursor:pointer;" onclick="event.stopPropagation();deleteCard('${key}')">Delete</button></div>`;
                    }
                    card.innerHTML =
                        `<div class="card-main-info">${thumb}<div class="card-details"><div class="card-title">${title.toUpperCase()}</div><div class="card-desc">${desc}</div></div></div>${controls}`;
                    feed.appendChild(card);
                }
            }
        }

        function showSearchWikiCard(key, item) {
            document.getElementById('search-results-feed').innerHTML = "";
            const view = document.getElementById('wiki-detail-view');
            const allImgs = (item && typeof item === 'object') ? (item.images || (item.src ? [item.src] : [])) : [];
            const hiddenRows = (item && item.hiddenRows) ? item.hiddenRows : [];
            let gridHtml = "";
            let visibleRows = [];
            if (item.rows && item.rows.length > 0) {
                if (editModeActive) { visibleRows = item.rows; } else { visibleRows = item.rows.filter(r => !hiddenRows
                        .includes(r.key)); }
                if (visibleRows.length > 0) {
                    gridHtml =
                        `<div style="display:grid;grid-template-columns:auto 1fr auto;gap:6px 15px;background:#242426;padding:15px;border-radius:12px;margin-bottom:15px;border:1px solid #2c2c2e;">`;
                    visibleRows.forEach(r => { const isHidden = hiddenRows.includes(r.key);
                        gridHtml +=

                    gridHtml += `</div>`;
                }
            }
            let heading = key;
            let sub = "";
            let about = "";
            if (typeof item === 'object') { heading = item.title || item.name || key;
                sub = item.shortDesc || '';
                about = item.about || item.text || ''; } else { about = item; }
            let thumbs = "";
            if (allImgs.length > 0) {
                thumbs = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">`;
                allImgs.forEach((src, idx) => { thumbs +=
                        `<img src="${src}" style="width:60px;height:60px;border-radius:8px;object-fit:cover;border:1px solid #333;cursor:pointer;" onclick="event.stopPropagation();openGallery(allImgs,${idx})" />`; });
                thumbs += `</div>`;
            }
            view.innerHTML =
                `<button style="position:absolute;top:15px;right:15px;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;z-index:10;" onclick="document.getElementById('wiki-detail-view').style.display='none'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg></button>${allImgs.length > 0 ? `<img src="${allImgs[0]}" style="width:100%;height:200px;object-fit:cover;border-bottom:1px solid #2c2c2e;cursor:pointer;" onclick="openGallery(allImgs,0)" />` : `<div style="height:20px;"></div>`}<div style="padding:20px 20px 10px 20px;"><h2 style="font-size:1.75rem;font-weight:800;color:#fff;margin:0 0 5px 0;">${heading.toUpperCase()}</h2>${sub ? `<p style="font-size:1rem;color:#8e8e93;margin:0 0 15px 0;">${sub}</p>` : ''}${thumbs}${gridHtml}</div>${about ? `<div style="font-size:1rem;line-height:1.6;color:#d1d1d6;white-space:pre-wrap;padding:0 20px 20px 20px;">${about}</div>` : ''}`;
            view.style.display = 'flex';
            view.dataset.images = JSON.stringify(allImgs);
        }

        function toggleRowHide(key, rowKey) {
            const item = db[key];
            if (!item) return;

        // ─── EDIT & ADVANCED FORM ───
        function editCard(key) {

                            .getElementById('padSearchInput') });

        function hideAdvancedForm() { document.getElementById('advanced-form-card').style.display = 'none'; }

        function addNewImageSlot(base64Val = "") {
            const container = document.getElementById('form-images-container');
            const div = document.createElement('div');
            div.className = 'form-image-slot';
            const imgHtml = base64Val ?
                `<img src="${base64Val}" alt="" onclick="openGallery(['${base64Val}'],0)" />` :
                `<div class="no-img-placeholder">No Image</div>`;
            div.innerHTML =
                `${imgHtml}<input type="file" accept="image/*" style="display:none;" onchange="handleSlotImageUpload(event,this)" /><input type="hidden" class="slot-image-data" value="${base64Val}" /><div style="display:flex;gap:5px;width:100%;"><button type="button" style="background:#444;color:#fff;border:none;padding:4px;border-radius:4px;font-size:0.72rem;flex:1;cursor:pointer;" onclick="this.parentElement.parentElement.querySelector('input[type=file]').click()">Upload</button><button type="button" style="background:#3a1515;color:#ff453a;border:none;padding:4px;border-radius:4px;font-size:0.72rem;cursor:pointer;" onclick="this.parentElement.parentElement.remove()">X</button></div>`;
            container.appendChild(div);

        function handleSlotImageUpload(e, inputEl) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => { const base64 = ev.target.result; const slot = inputEl.parentElement; slot
                    .querySelector('.slot-image-data').value = base64; let img = slot.querySelector('img'); if (!img) { img =
                        document.createElement('img'); const ph = slot.querySelector('.no-img-placeholder'); if (ph) ph
                            .replaceWith(img);
                        else slot.insertBefore(img, slot.firstChild); } img.src = base64;
                    img.onclick = function() { openGallery([base64], 0); }; };
            reader.readAsDataURL(file);
        }

        function toggleFormRowHide(btn) {

        function saveAdvancedData() {
            const title = document.getElementById('form-title').value.trim();
            const shortDesc = document.getElementById('form-short-desc').value.trim();
            const about = document.getElementById('form-about').value.trim();
            const editId = document.getElementById('form-edit-id').value;
            if (!title || !about) { alert("Title and About are required!"); return; }
            const targetId = editId || title.toLowerCase();
            const images = [];
            document.querySelectorAll('.slot-image-data').forEach(inp => { if (inp.value) images.push(inp.value); });
            const questions = [];
            document.querySelectorAll('.q-input').forEach(inp => { const v = inp.value.trim().toLowerCase(); if (v) questions
                    .push(v); });
            const rows = [];
            const hiddenRows = [];
            document.querySelectorAll('.form-row-item').forEach(rowItem => { const kInp = rowItem.querySelector(
                    '.row-key'); const vInp = rowItem.querySelector('.row-val'); const k = kInp ? kInp.value.trim() :
                    ''; const v = vInp ? vInp.value.trim() : ''; if (k && v) { rows.push({ key: k, val: v }); if (
                        rowItem.dataset.hidden === "true") { hiddenRows.push(k); } } });
            const dataObj = { type: 'advanced', id: targetId, title: title, shortDesc: shortDesc, src: images[0] || '',
                images: images, questions: questions, rows: rows, hiddenRows: hiddenRows, about: about, text: about };

            performPadSearch({ target: document.getElementById('padSearchInput') });

        function handleImageUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            const file = files[0];
            const reader = new FileReader();
            reader.onload = function(e) { pendingChatImage = e.target.result;

        function clearChatImagePreview() { pendingChatImage = null;
            document.getElementById('chat-image-preview-container').style.display = 'none';
            document.getElementById('chat-image-preview').src = ''; }

        function setButtonState(anim) {
            const btn = document.getElementById('sendBtn');
            isAnimating = anim;
            btn.innerHTML = anim ?
                `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><rect x="8" y="8" width="8" height="8" fill="currentColor" rx="1"/></svg>` :
                `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M8 16l8-8M11 8h5v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
        }

        function stopAnimation(manual = false) {
            if (animationTimeout) { clearTimeout(animationTimeout);
                animationTimeout = null; }
            setButtonState(false);
            isAnimating = false;
            if (manual && currentTypingElement) { currentTypingElement.textContent = currentTypingText.substring(0,
                    currentTypingIndex) + ".";
                chatContainer.scrollTop = chatContainer.scrollHeight;
                saveChatHistory(); }
        }

        function handleSendClick() { if (isAnimating) stopAnimation(true);
            else sendMessage(); }

        function animateText(el, text, speed = 40, start = 0) {
            if (start === 0) { stopAnimation(false);
                el.textContent = ""; }
            setButtonState(true);
            isAnimating = true;
            currentTypingText = text;
            currentTypingElement = el;
            currentTypingIndex = start;

            function type() {
                if (currentTypingIndex < currentTypingText.length) { el.textContent = currentTypingText.substring(0,
                        currentTypingIndex + 1);
                    currentTypingIndex++;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    animationTimeout = setTimeout(type, speed); } else { setButtonState(false);
                    isAnimating = false;
                    saveChatHistory(); }
            }
            type();
        }

        function sendMessage() {
            const query = searchBox.value.trim();
            if (!query && !pendingChatImage) return;
            stopAnimation(false);
            const userDiv = document.createElement('div');
            userDiv.className = 'user-msg';
            if (pendingChatImage) { const img = document.createElement('img');
                img.src = pendingChatImage;
                userDiv.appendChild(img);
                lastImageForEdit = pendingChatImage; }
            if (query) { const textDiv = document.createElement('div');
                textDiv.innerText = query;
                if (pendingChatImage) textDiv.style.marginTop = "8px";
                userDiv.appendChild(textDiv);
                lastQuery = query; }
            chatContainer.appendChild(userDiv);
            searchBox.value = '';
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
            const imageToSend = pendingChatImage;
            clearChatImagePreview();
            saveChatHistory();
            setTimeout(() => { triggerChatResponse(query, imageToSend); }, 400);
        }

        // ─── IMPROVED MATCHING ENGINE ───
        function triggerChatResponse(rawKey, imageSrc = null) {
            let queryVal = rawKey ? rawKey.trim().toLowerCase() : "";

            // ─── FILE DOWNLOAD CHECK ───
            const words = queryVal.split(" ");
            if (words.length > 1 && fileCommands.includes(words[0])) {
                const targetName = words.slice(1).join(' ');
                let foundFile = null;
                for (let key in db) {
                    if (db[key].type === 'custom_file' && db[key].name.toLowerCase() === targetName) {
                        foundFile = { key: key, data: db[key] };
                        break;
                    }
                }
                if (foundFile) {
                    const aiDiv = document.createElement('div');
                    aiDiv.className = 'ai-msg';
                    aiDiv.innerHTML = `
                        <div class="chat-file-card">
                            <img src="${foundFile.data.thumb}" alt="thumb"/>
                            <div class="chat-file-name">${foundFile.data.name}</div>
                            <button class="download-btn" onclick="downloadCustomFile('${foundFile.key}')">Download</button>
                        </div>
                    `;
                    chatContainer.appendChild(aiDiv);
                    chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
                    saveChatHistory();
                    return;
                }
            }

            // ─── HANDLE "image" / "images" commands ───
            let showImage = false,
                showText = true,
                showAllImages = false;
            if (queryVal.endsWith(" all") || queryVal.endsWith(" details") || queryVal.endsWith(" detail")) {
                showAllImages = true;
                showImage = true;
                showText = true;
                queryVal = queryVal.replace(/ (all|details|detail)$/, "").trim();
            } else if (queryVal.endsWith(" image") || queryVal.endsWith(" img")) {
                showImage = true;
                showText = false;
                showAllImages = false;
                queryVal = queryVal.replace(/ (image|img)$/, "").trim();
            } else if (queryVal.endsWith(" images")) {
                showImage = true;
                showText = false;
                showAllImages = true;
                queryVal = queryVal.replace(/ images$/, "").trim();
            }

            // ─── TRY TO MATCH ───
            let matched = null;

            // 1. If image was sent, try to find the item that contains that image
            if (imageSrc) {
                for (let key in db) {
                    const item = db[key];
                    if (item && (item.src === imageSrc || (item.images && item.images.includes(imageSrc)))) {
                        matched = item;
                        currentContext = item;
                        break;
                    }
                }
                if (!matched) {
                    // still show the image but with a generic message
                    matched = { type: 'unknown_img', text: "Image received! I couldn't find its details in the database." };
                }
            }

            // 2. If no match yet, use token-based scoring
            if (!matched && queryVal) {
                // remove stop words (common English and Hindi/Urdu words)
                const stopWords = new Set(['what', 'is', 'are', 'was', 'were', 'the', 'a', 'an', 'of', 'to', 'for', 'with', 'on',
                    'at', 'from', 'by', 'in', 'about', 'as', 'into', 'like', 'through', 'after', 'over', 'between', 'out',
                    'during', 'without', 'under', 'up', 'down', 'off', 'over', 'under', 'further', 'then', 'once', 'here',
                    'there', 'when', 'where', 'why', 'how', 'all', 'any', 'both', 'each', 'few', 'more', 'most', 'other',
                    'some', 'such', 'no', 'nor', 'not', 'only', 'own', 'same', 'so', 'than', 'too', 'very', 'sure', 'then',
                    'now', 'but', 'or', 'and', 'yet', 'for', 'nor', 'on', 'at', 'to', 'by', 'in', 'with', 'without', 'via',
                    'per', 'plus', 'minus', 'times', 'divide', 'equal', 'ma', 'ka', 'ki', 'ke', 'ko', 'se', 'mein', 'par',
                    'tum', 'aap', 'hum', 'woh', 'ye', 'vah'
                ]);
                const tokens = queryVal.split(/\s+/).filter(t => t.length > 1 && !stopWords.has(t));

                if (tokens.length === 0) {
                    // fallback: use the whole query as one token
                    tokens.push(queryVal);
                }

                let bestScore = 0;
                let bestItem = null;
                let bestKey = null;

                for (let key in db) {
                    const item = db[key];
                    if (item.type === 'custom_file') continue; // skip files for text search

                    let score = 0;
                    let title = (item.title || item.name || key).toLowerCase();
                    let about = (item.about || item.text || "").toLowerCase();
                    let questions = (item.questions || []).map(q => q.toLowerCase());
                    let rows = (item.rows || []);

                    // Check exact match on title or key (high priority)
                    for (let tok of tokens) {
                        if (title === tok || key.toLowerCase() === tok) {
                            score += 10;
                        }
                    }

                    // Check partial matches
                    for (let tok of tokens) {
                        if (title.includes(tok)) score += 3;
                        if (about.includes(tok)) score += 2;
                        if (questions.some(q => q.includes(tok))) score += 3;
                        for (let r of rows) {
                            if (r.key.toLowerCase().includes(tok)) score += 3;
                            if (r.val.toLowerCase().includes(tok)) score += 2;
                        }
                    }

                    // Bonus if any token appears in the beginning of title
                    for (let tok of tokens) {
                        if (title.startsWith(tok)) score += 2;
                    }

                    if (score > bestScore) {
                        bestScore = score;
                        bestItem = item;
                        bestKey = key;
                    }
                }

                if (bestItem && bestScore > 0) {
                    matched = bestItem;
                    currentContext = bestItem;
                }
            }

            // 3. If still no match, and we have a context, check for row values
            if (!matched && currentContext && queryVal) {
                const ctx = currentContext;
                if (ctx.rows) {
                    for (let r of ctx.rows) {
                        if (r.key.toLowerCase() === queryVal || queryVal.includes(r.key.toLowerCase())) {
                            matched = { type: 'row', text: r.val };
                            break;
                        }
                    }
                }
                if (!matched && (queryVal === "image" || queryVal === "img")) {
                    matched = ctx;
                    showImage = true;
                    showText = false;
                    showAllImages = false;
                } else if (!matched && queryVal === "images") {
                    matched = ctx;
                    showImage = true;
                    showText = false;
                    showAllImages = true;
                }
            }

            // ─── FALLBACK: if still no match ───
            if (!matched) {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'ai-msg fallback-msg';
                const displayQuery = rawKey || 'that';
                const fallbackText =
                    `I couldn't find anything about "<strong>${displayQuery}</strong>" in the database.`;
                const hint =
                    `💡 You can add data using the <strong>🔍 Search</strong> icon → type <strong>"edit"</strong> to open Edit Mode, then create a new entry. Or use the <strong>OpenCLOCK File</strong> or <strong>OpenCLOCK Database</strong> from the menu.`;
                aiDiv.innerHTML = `${fallbackText}<span class="hint">${hint}</span>`;
                chatContainer.appendChild(aiDiv);
                chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
                saveChatHistory();
                return;
            }

            // ─── RENDER RESPONSE ───
            const aiDiv = document.createElement('div');
            aiDiv.className = 'ai-msg';
            chatContainer.appendChild(aiDiv);

            const allImgs = (matched.images && matched.images.length) ? matched.images : (matched.src ? [matched.src] : []);
            let toShow = [];
            if (showImage && allImgs.length > 0) { toShow = showAllImages ? allImgs : [allImgs[0]]; }
            toShow.forEach(src => { const img = document.createElement('img');
                img.src = src;
                aiDiv.appendChild(img); });

            if (showText) {
                let ans = matched.text || matched.about || matched;
                if (typeof ans !== 'string') ans = JSON.stringify(ans);
                if (matched.type === 'row' || matched.type === 'relation' || matched.type === 'unknown_img') { ans = matched
                        .text || ''; }
                const span = document.createElement('span');
                aiDiv.appendChild(span);
                chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
                animateText(span, ans);
            } else {
                chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
                saveChatHistory();
            }
        }

        window.openGallery = openGallery;
    </script>
</body>
