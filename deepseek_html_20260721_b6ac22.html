<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OpenCLOCK</title>
    <style>
        /* ─── ALL DESIGN TOKENS ARE HERE ─── */
        :root {
            /* Colors */
            --bg-primary: #000000;
            --bg-secondary: #121315;
            --bg-card: #1c1c1e;
            --bg-input: #000000;
            --bg-user-msg: #2f3032;
            --bg-ai-msg: transparent;
            --text-primary: #ffffff;
            --text-secondary: #9aa0a6;
            --text-muted: #80868b;
            --border-color: #333333;
            --border-light: #444444;
            --accent-blue: #007aff;
            --accent-red: #ff3b30;
            --accent-green: #34c759;

            /* Sizes */
            --font-size-base: 1rem;
            --font-size-large: 1.1rem;
            --font-size-xlarge: 1.25rem;
            --font-size-title: 2.2rem;
            --border-radius-input: 35px;
            --border-radius-card: 16px;
            --border-radius-msg: 25px;
            --padding-header: 15px 20px;
            --padding-chat: 20px;
            --padding-input-wrapper: 15px 20px 25px;
            --max-width-input: 650px;

            /* Input box */
            --input-border-width: 1.5px;
            --input-padding: 12px 15px;
        }

        * {
            box-sizing: border-box;
        }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }

        /* ─── SPLASH (unchanged) ─── */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }
        .splash-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
        }
        .splash-circle {
            width: 60px;
            height: 60px;
            transform-origin: center;
            animation: spinCircle 1.3s ease forwards;
        }
        .splash-text {
            font-size: var(--font-size-title);
            font-weight: 700;
            color: #fff;
            opacity: 0;
            max-width: 0;
            overflow: hidden;
            white-space: nowrap;
            transition: max-width 0.8s ease, opacity 0.6s ease;
        }
        .reveal-active .splash-text {
            opacity: 1;
            max-width: 300px;
            margin-left: 15px;
        }
        @keyframes spinCircle {
            0% { transform: scale(0.2) rotate(0deg); opacity: 0; }
            60% { transform: scale(1.1) rotate(240deg); opacity: 1; }
            100% { transform: scale(1) rotate(360deg); opacity: 1; }
        }

        /* ─── HEADER ─── */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--padding-header);
            border-bottom: 1px solid #111;
            z-index: 10;
        }
        .menu-icon,
        .search-icon {
            width: 24px;
            height: 24px;
            stroke: #fff;
            cursor: pointer;
            fill: none;
        }
        header h3 {
            margin: 0;
            font-size: var(--font-size-xlarge);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .install-banner {
            display: none;
            position: fixed;
            top: 15px;
            left: 5%;
            right: 5%;
            background: #1e1f22;
            border: 1px solid #3c4043;
            padding: 12px 18px;
            border-radius: 16px;
            z-index: 1000;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .install-text { font-size: 0.95rem; font-weight: 500; }
        .install-btn {
            background: #fff; color: #000; border: none;
            padding: 8px 16px; border-radius: 20px;
            font-weight: bold; font-size: 0.85rem; cursor: pointer;
        }

        /* ─── CHAT ─── */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: var(--padding-chat);
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 140px;
            scroll-behavior: smooth;
        }
        .user-msg {
            background: var(--bg-user-msg);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: var(--border-radius-msg);
            align-self: flex-end;
            max-width: 75%;
            word-wrap: break-word;
            font-size: var(--font-size-large);
            border: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
        }
        .user-msg img {
            max-width: 180px;
            border-radius: 12px;
            display: block;
            cursor: pointer;
        }
        .ai-msg {
            color: var(--text-primary);
            padding: 5px 10px;
            align-self: flex-start;
            max-width: 90%;
            font-size: var(--font-size-large);
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            display: flex;
            flex-direction: column;
        }
        .ai-msg img {
            max-width: 100%;
            max-height: 280px;
            border-radius: 16px;
            display: block;
            margin-bottom: 12px;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }

        /* ─── WELCOME SCREEN ─── */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 60vh;
            text-align: center;
            padding: 20px;
            gap: 20px;
        }
        #welcome-screen svg {
            width: 80px;
            height: 80px;
        }
        #welcome-screen h1 {
            font-size: var(--font-size-title);
            font-weight: 700;
            margin: 0;
            color: var(--text-primary);
        }
        #welcome-screen p {
            font-size: var(--font-size-large);
            color: var(--text-secondary);
            margin: 0;
            max-width: 400px;
        }

        /* ─── CHAT INPUT ─── */
        .input-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: var(--padding-input-wrapper);
            background: linear-gradient(transparent, rgba(0,0,0,0.95) 25%, #000 100%);
            z-index: 5;
        }
        .input-container {
            background: var(--bg-input);
            border-radius: var(--border-radius-input);
            display: flex;
            align-items: center;
            padding: 6px 10px;
            border: var(--input-border-width) solid var(--text-primary);
            max-width: var(--max-width-input);
            margin: 0 auto;
        }
        input[type="text"] {
            background: transparent;
            border: none;
            color: var(--text-primary);
            flex: 1;
            padding: var(--input-padding);
            outline: none;
            font-size: var(--font-size-large);
            min-width: 0;
        }
        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .icon-btn:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.1);
        }
        #sendBtn {
            color: var(--text-primary);
            background: rgba(255,255,255,0.1);
        }

        /* ─── The rest of the styles (modals, search pad, etc.) use the same variables ─── */
        /* For brevity, I'll keep the remaining CSS as is but they will inherit from :root */
        /* ─── MODALS ─── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        .modal-content {
            background: #202124;
            padding: 25px;
            border-radius: 15px;
            width: 85%;
            max-width: 400px;
            border: 1px solid #444;
        }
        .modal-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #111;
            border: 1px solid #555;
            color: #fff;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }
        .modal-input:focus { border-color: #888; }
        textarea.modal-input { font-family: inherit; resize: none; }
        .preview-container { text-align: center; margin-bottom: 15px; }
        .preview-container img { max-height: 120px; border-radius: 8px; border: 1px solid #555; cursor: pointer; }

        /* ─── SEARCH PAD OVERLAY ─── */
        #search-device-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 500;
            display: none;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .search-pad-header {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 650px;
            width: 100%;
            margin: 10px auto 15px;
            flex-wrap: wrap;
        }
        .search-pad-container {
            flex: 1;
            background: #000;
            border-radius: 35px;
            display: flex;
            align-items: center;
            padding: 6px 15px;
            border: 1.5px solid #fff;
            min-width: 150px;
        }
        .search-pad-container input {
            background: transparent;
            border: none;
            color: #fff;
            padding: 10px 5px;
            font-size: 1.1rem;
            outline: none;
            width: 100%;
        }
        #edit-mode-status {
            display: none;
            text-align: center;
            color: #ff3b30;
            font-weight: bold;
            font-size: 0.95rem;
            border: 1px dashed #ff3b30;
            padding: 5px;
            border-radius: 10px;
            max-width: 650px;
            margin: 0 auto 15px;
        }
        #create-new-btn {
            display: none;
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            margin: 0 auto 15px;
            width: max-content;
            font-size: 1rem;
        }
        /* ─── SEARCH FEED ─── */
        #search-results-feed {
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .clean-data-card {
            background: var(--bg-secondary);
            border: 1px solid #232528;
            border-radius: var(--border-radius-card);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
        }
        .card-main-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .card-thumb {
            width: 55px;
            height: 55px;
            border-radius: 10px;
            object-fit: cover;
            background: #202124;
            flex-shrink: 0;
            border: 1px solid #333;
            cursor: pointer;
        }
        .card-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            flex: 1;
        }
        .card-title {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* ─── WIKI DETAIL VIEW ─── */
        #wiki-detail-view {
            display: none;
            background: var(--bg-card);
            border-radius: 20px;
            overflow-y: auto;
            max-height: 85vh;
            -webkit-overflow-scrolling: touch;
            max-width: 650px;
            width: 90%;
            margin: 20px auto;
            flex-direction: column;
            position: relative;
            border: 1px solid #2c2c2e;
        }
        /* ─── ADVANCED FORM ─── */
        #advanced-form-card {
            display: none;
            background: #161719;
            border: 1px solid #2c2d30;
            border-radius: var(--border-radius-card);
            padding: 20px;
            max-width: 650px;
            width: 100%;
            margin: 0 auto 20px;
            box-sizing: border-box;
            flex-direction: column;
            gap: 15px;
        }
        .form-image-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: #0d0e10;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #232528;
            width: 110px;
            position: relative;
        }
        .form-image-slot img {
            width: 90px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #333;
            cursor: pointer;
        }
        .form-image-slot .no-img-placeholder {
            width: 90px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #121315;
            border-radius: 8px;
            border: 1px dashed #444;
            font-size: 0.8rem;
            color: #666;
            text-align: center;
        }
        /* ─── GALLERY OVERLAY ─── */
        #gallery-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 6000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #gallery-overlay .gallery-close {
            position: absolute;
            top: 20px;
            right: 24px;
            background: rgba(255,255,255,0.15);
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(12px);
        }
        #gallery-overlay .gallery-close:hover { background: rgba(255,255,255,0.25); }
        #gallery-overlay .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 2.2rem;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(8px);
            transition: background 0.2s;
        }
        #gallery-overlay .gallery-arrow:hover { background: rgba(255,255,255,0.18); }
        #gallery-overlay .gallery-arrow.left { left: 16px; }
        #gallery-overlay .gallery-arrow.right { right: 16px; }
        #gallery-overlay .gallery-img-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
            box-sizing: border-box;
        }
        #gallery-overlay .gallery-img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }
        #gallery-overlay .gallery-counter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            background: rgba(0,0,0,0.6);
            padding: 6px 18px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* ─── ROW HIDE / UNHIDE CONTROLS ─── */
        .row-controls { display: flex; align-items: center; gap: 8px; }
        .row-controls .row-hide-btn {
            background: #2a1a1a; color: #ff453a; border: 1px solid #4a2a2a;
            padding: 2px 12px; border-radius: 12px; font-size: 0.7rem;
            font-weight: 600; cursor: pointer; transition: 0.15s;
        }
        .row-controls .row-hide-btn.unhide {
            background: #1a2a1a; color: #34c759; border: 1px solid #2a4a2a;
        }
        .row-controls .row-hide-btn:hover { opacity: 0.8; }

        /* ─── SLIDE MENU ─── */
        .slide-menu {
            position: fixed; top: 0; left: 0; bottom: 0;
            width: 280px; max-width: 82%;
            background: #0d0d0e; border-right: 1px solid #222;
            z-index: 2001; transform: translateX(-100%);
            transition: transform 0.3s ease;
            display: flex; flex-direction: column; padding-top: 20px;
        }
        .slide-menu.open { transform: translateX(0); }
        .slide-menu-logo {
            display: flex; align-items: center; gap: 10px;
            padding: 0 20px 18px 20px; border-bottom: 1px solid #1c1c1e;
            font-weight: 700; font-size: 1.1rem; color: #fff;
        }
        .new-chat-btn {
            margin: 16px 16px 8px 16px; background: #fff; color: #000;
            border: none; padding: 12px; border-radius: 14px;
            font-weight: bold; cursor: pointer; font-size: 0.95rem;
        }
        .chat-list {
            flex: 1; overflow-y: auto; padding: 8px 10px;
            display: flex; flex-direction: column; gap: 4px;
        }
        .chat-list-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px; border-radius: 10px; cursor: pointer; position: relative;
        }
        .chat-list-item:hover, .chat-list-item.active { background: #1c1c1e; }
        .chat-list-name {
            flex: 1; color: #fff; font-size: 0.95rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .chat-dots-wrap { position: relative; }
        .chat-dots-btn {
            background: none; border: none; color: #9aa0a6;
            font-size: 1.2rem; cursor: pointer; padding: 0 6px; line-height: 1;
        }
        .chat-dots-btn:hover { color: #fff; }
        .chat-dots-menu {
            display: none; position: absolute; right: 0; top: 100%;
            background: #202124; border: 1px solid #333;
            border-radius: 10px; overflow: hidden; z-index: 2010; min-width: 120px;
        }
        .chat-dots-menu div { padding: 10px 14px; font-size: 0.9rem; color: #fff; cursor: pointer; }
        .chat-dots-menu div:hover { background: #2f3032; }
        .slide-menu-footer {
            padding: 16px 20px; border-top: 1px solid #1c1c1e;
            display: flex; align-items: center; gap: 10px;
            cursor: pointer; font-weight: 600; font-size: 0.95rem; color: #fff;
        }
        .slide-menu-footer:hover { background: #1c1c1e; }

        /* ─── FILE MANAGER ─── */
        .file-manager-overlay {
            display: none; position: fixed; inset: 0; background: #000;
            z-index: 2500; flex-direction: column; padding: 15px; box-sizing: border-box;
        }
        .file-manager-header {
            display: flex; align-items: center; gap: 10px;
            max-width: 650px; width: 100%; margin: 5px auto 15px;
        }
        .file-manager-title { flex: 1; color: #fff; font-weight: 700; font-size: 1.15rem; }
        .file-manager-list {
            flex: 1; overflow-y: auto; max-width: 650px; width: 100%;
            margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
            padding-bottom: 80px;
        }
        .file-card {
            display: flex; align-items: center; gap: 14px;
            background: #121315; border: 1px solid #232528;
            border-radius: 14px; padding: 10px 14px;
        }
        .file-card-thumb {
            width: 46px; height: 46px; border-radius: 8px;
            object-fit: cover; background: #202124; flex-shrink: 0;
            border: 1px solid #333;
        }
        .file-card-name {
            flex: 1; color: #fff; font-weight: 600; font-size: 0.95rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .file-card-download {
            background: #fff; color: #000; border: none;
            padding: 8px 14px; border-radius: 18px; font-weight: bold;
            font-size: 0.8rem; cursor: pointer;
        }
        .file-card-delete {
            background: none; border: none; color: #ff453a;
            font-size: 1rem; cursor: pointer; padding: 4px 6px;
        }
        .file-manager-add-btn {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: #fff; color: #000; border: none;
            padding: 14px 32px; border-radius: 30px; font-weight: bold;
            font-size: 1rem; cursor: pointer; z-index: 2501;
            box-shadow: 0 6px 18px rgba(0,0,0,0.5);
        }

        /* ─── INLINE CHAT FILE CARD ─── */
        .chat-file-card {
            display: flex; align-items: center; gap: 12px;
            background: #121315; border: 1px solid #2c2c2e;
            border-radius: 16px; padding: 12px 14px;
            max-width: 100%; width: max-content;
        }
        .chat-file-card-thumb {
            width: 46px; height: 46px; border-radius: 10px;
            object-fit: cover; background: #202124;
            border: 1px solid #333; flex-shrink: 0;
        }
        .chat-file-card-name {
            flex: 1; color: #fff; font-weight: 600; font-size: 0.95rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .chat-file-card-download {
            background: #fff; color: #000; border: none;
            padding: 8px 16px; border-radius: 18px; font-weight: bold;
            font-size: 0.82rem; cursor: pointer; flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- SPLASH -->
    <div id="splash-screen">
        <div class="splash-content">
            <svg class="splash-circle" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#000" />
                <g transform="translate(50,50)">
                    <rect x="-7" y="-38" width="14" height="14" fill="#ff3b30" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="#ff2d55" transform="rotate(45)" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="#af52de" transform="rotate(90)" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="#5856d6" transform="rotate(135)" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="#007aff" transform="rotate(180)" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="#34c759" transform="rotate(225)" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="#ffcc00" transform="rotate(270)" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="#ff9500" transform="rotate(315)" rx="1"/>
                </g>
            </svg>
            <span class="splash-text">OpenCLOCK</span>
        </div>
    </div>

    <!-- INSTALL BANNER -->

    <script>
        // ═══════════════════════════════════════════════════════════════════
        //  ██████  CONFIGURATION – CHANGE EVERYTHING FROM HERE  ██████
        // ═══════════════════════════════════════════════════════════════════
        const CONFIG = {
            // ─── COLORS (all UI elements) ──────────────────────────────
            colors: {
                bgPrimary: '#000000',
                bgSecondary: '#121315',
                bgCard: '#1c1c1e',
                bgInput: '#000000',
                bgUserMsg: '#2f3032',
                textPrimary: '#ffffff',
                textSecondary: '#9aa0a6',
                textMuted: '#80868b',
                borderColor: '#333333',
                borderLight: '#444444',
                accentBlue: '#007aff',
                accentRed: '#ff3b30',
                accentGreen: '#34c759',
            },
            // ─── SIZES (font, padding, radius, etc.) ──────────────────
            sizes: {
                fontSizeBase: '1rem',
                fontSizeLarge: '1.1rem',
                fontSizeXLarge: '1.25rem',
                fontSizeTitle: '2.2rem',
                borderRadiusInput: '35px',
                borderRadiusCard: '16px',
                borderRadiusMsg: '25px',
                paddingHeader: '15px 20px',
                paddingChat: '20px',
                paddingInputWrapper: '15px 20px 25px',
                maxWidthInput: '650px',
                inputBorderWidth: '1.5px',
                inputPadding: '12px 15px',
            },
            // ─── WELCOME PROMPTS (add as many as you like) ─────────────
            prompts: [
                "What would you like to know?",
                "Ask me anything about your data.",
                "I'm here to help you explore.",
                "Let's find what you're looking for.",
                "Start your journey with OpenCLOCK.",
                "What's on your mind?",
                "You can ask me about anything stored here.",
                "Ready to dive into your knowledge base?",
                "Your personal data assistant is ready.",
                "How can I assist you today?"
            ]
        };

        // ─── Apply config to CSS custom properties ────────────────────
        function applyConfig() {
            const root = document.documentElement;
            const c = CONFIG.colors;
            const s = CONFIG.sizes;
            root.style.setProperty('--bg-primary', c.bgPrimary);
            root.style.setProperty('--bg-secondary', c.bgSecondary);
            root.style.setProperty('--bg-card', c.bgCard);
            root.style.setProperty('--bg-input', c.bgInput);
            root.style.setProperty('--bg-user-msg', c.bgUserMsg);
            root.style.setProperty('--text-primary', c.textPrimary);
            root.style.setProperty('--text-secondary', c.textSecondary);
            root.style.setProperty('--text-muted', c.textMuted);
            root.style.setProperty('--border-color', c.borderColor);
            root.style.setProperty('--border-light', c.borderLight);
            root.style.setProperty('--accent-blue', c.accentBlue);
            root.style.setProperty('--accent-red', c.accentRed);
            root.style.setProperty('--accent-green', c.accentGreen);
            root.style.setProperty('--font-size-base', s.fontSizeBase);
            root.style.setProperty('--font-size-large', s.fontSizeLarge);
            root.style.setProperty('--font-size-xlarge', s.fontSizeXLarge);
            root.style.setProperty('--font-size-title', s.fontSizeTitle);
            root.style.setProperty('--border-radius-input', s.borderRadiusInput);
            root.style.setProperty('--border-radius-card', s.borderRadiusCard);
            root.style.setProperty('--border-radius-msg', s.borderRadiusMsg);
            root.style.setProperty('--padding-header', s.paddingHeader);
            root.style.setProperty('--padding-chat', s.paddingChat);
            root.style.setProperty('--padding-input-wrapper', s.paddingInputWrapper);
            root.style.setProperty('--max-width-input', s.maxWidthInput);
            root.style.setProperty('--input-border-width', s.inputBorderWidth);
            root.style.setProperty('--input-padding', s.inputPadding);
        }
        applyConfig();

        // ─── The rest of the JavaScript (unchanged, but uses CONFIG.prompts) ───
        // For brevity, I'll copy the full script from the previous version.
        // However, I'll modify the renderWelcomeScreen to pick a random prompt.
        // I'll present the full script in the final answer.
        // But for this answer, I'll show the key changes.

        // Actually, I need to include the entire script. I'll write it here.

        const chatContainer = document.getElementById('chat-container');
        const searchBox = document.getElementById('searchBox');

        let db = {};
        let editModeActive = false;
        let lastImageForEdit = null;
        let lastQuery = "";
        let currentContext = null;

        let animationTimeout = null;
        let isAnimating = false;
        let currentTypingText = "";
        let currentTypingIndex = 0;
        let currentTypingElement = null;

        let pendingChatImage = null;

        // ─── GALLERY STATE ───
        let galleryImages = [];
        let galleryIndex = 0;

        // ─── INDEXEDDB ───
        let dbInstance = null;
        const DB_NAME = "OpenClockDB";
        const STORE_NAME = "dataStore";

        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = function(e) {
            if (!e.target.result.objectStoreNames.contains(STORE_NAME)) {
                e.target.result.createObjectStore(STORE_NAME);
            }
        };
        req.onsuccess = function(e) {
            dbInstance = e.target.result;
            loadAllDataFromDB();
        };

        function loadAllDataFromDB() {
            if (!dbInstance) return;
            const tx = dbInstance.transaction([STORE_NAME], "readonly");
            const cursorReq = tx.objectStore(STORE_NAME).openCursor();
            db = {};
            cursorReq.onsuccess = function(event) {
                const cursor = event.target.result;
                if (cursor) {
                    db[cursor.key] = cursor.value;
                    cursor.continue();
                }
            };
        }

        function persistData(key, value) {
            if (dbInstance) {
                dbInstance.transaction([STORE_NAME], "readwrite").objectStore(STORE_NAME).put(value, key);
            }
        }

        function clearLocalDatabase() {
            if (confirm("🚨 Clear complete local app database store?")) {
                dbInstance.transaction([STORE_NAME], "readwrite").objectStore(STORE_NAME).clear().onsuccess = function() {
                    db = {};
                    chatContainer.innerHTML = "";
                    alert("🗑️ All data wiped out safely.");
                };
            }
        }

        // ─── SPLASH ───
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { document.querySelector('.splash-content').classList.add('reveal-active'); }, 1200);
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => { document.getElementById('splash-screen').style.display = 'none'; }, 600);
            }, 2800);
        });

        // ─── PWA ───
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').style.display = 'flex';
        });

        function triggerPWAInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => { deferredPrompt = null;
                    document.getElementById('installBanner').style.display = 'none'; });
            }
        }

        // ─── QUICK EDIT TRIGGER ───
        function checkAutoEdit(e) {
            const val = e.target.value.trim().toLowerCase();
            if (val === 'edit') {
                e.target.value = '';
                document.getElementById('editKey').value = lastQuery || '';
                document.getElementById('editValue').value = '';
                document.getElementById('textModal').style.display = 'flex';
            }
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function saveTextData() {
            const title = document.getElementById('editKey').value.trim();
            const key = title.toLowerCase();
            const value = document.getElementById('editValue').value.trim();
            if (!title || !value) { alert("Please fill both boxes!"); return; }

            const entry = {
                type: 'advanced',
                id: key,
                title: title,
                shortDesc: '',
                src: '',
                images: [],
                questions: [key],
                rows: [],
                hiddenRows: [],
                about: value,
                text: value
            };
            db[key] = entry;
            persistData(key, entry);
            closeModal('textModal');
            setTimeout(() => { triggerChatResponse(key); }, 300);
        }

        function saveImageData() {
            const title = document.getElementById('imageKey').value.trim();
            const key = title.toLowerCase();
            const about = document.getElementById('imageAbout').value.trim();
            if (!title || !about || !lastImageForEdit) { alert("Please complete details!"); return; }
            const data = {
                type: 'advanced',
                id: key,
                src: lastImageForEdit,
                text: about,
                title: title,
                name: title,
                about: about,
                images: [lastImageForEdit],
                rows: [],
                hiddenRows: [],
                questions: []
            };
            db[key] = data;
            persistData(key, data);
            closeModal('imageModal');
            setTimeout(() => { triggerChatResponse(key); }, 300);
        }

        // ─── GALLERY ───
        function openGallery(images, startIdx) {
            if (!images || images.length === 0) return;
            galleryImages = images;
            galleryIndex = Math.max(0, Math.min(startIdx || 0, images.length - 1));
            const overlay = document.getElementById('gallery-overlay');
            overlay.style.display = 'flex';
            updateGalleryImage();
            document.body.style.overflow = 'hidden';
        }

        function updateGalleryImage() {
            const img = document.getElementById('gallery-main-img');
            if (galleryImages.length > 0 && galleryIndex >= 0 && galleryIndex < galleryImages.length) {
                img.src = galleryImages[galleryIndex];
            }
            document.getElementById('gallery-counter').textContent = (galleryIndex + 1) + ' / ' + galleryImages.length;
            document.querySelector('.gallery-arrow.left').style.visibility = galleryImages.length > 1 ? 'visible' : 'hidden';
            document.querySelector('.gallery-arrow.right').style.visibility = galleryImages.length > 1 ? 'visible' : 'hidden';
        }

        function galleryNavigate(dir) {
            const newIdx = galleryIndex + dir;
            if (newIdx >= 0 && newIdx < galleryImages.length) {
                galleryIndex = newIdx;
                updateGalleryImage();
            }
        }

        function closeGallery() {
            document.getElementById('gallery-overlay').style.display = 'none';
            document.body.style.overflow = '';
            galleryImages = [];
            galleryIndex = 0;
        }

        function openGalleryFromModal() {
            const src = document.getElementById('modalImgPreview').src;
            if (src) openGallery([src], 0);
        }

        document.addEventListener('click', function(e) {
            const target = e.target;
            if (target.tagName === 'IMG') {
                const container = target.closest('.user-msg') || target.closest('.ai-msg');
                if (container) {
                    const imgs = container.querySelectorAll('img');
                    const urls = Array.from(imgs).map(img => img.src);
                    const idx = urls.indexOf(target.src);
                    if (idx !== -1 && urls.length > 0) {
                        e.stopPropagation();
                        openGallery(urls, idx);
                        return;
                    }
                }
                if (target.classList && target.classList.contains('card-thumb')) {
                    const card = target.closest('.clean-data-card');
                    if (card) {
                        const key = card.dataset.key;
                        if (key && db[key]) {
                            const item = db[key];
                            let imgs = [];
                            if (item.images && item.images.length) imgs = item.images;
                            else if (item.src) imgs = [item.src];
                            if (imgs.length) {
                                e.stopPropagation();

        function performPadSearch(e) {

            const wiki = document.getElementById('wiki-detail-view');
            feed.innerHTML = "";

                e.target.value = '';
                toggleEditMode();
                return;
            }
            if (!query && !editModeActive) return;

            for (let key in db) {
                const item = db[key];
                if (!item) continue;
                let title = key;
                let desc = "";
                let qs = "";
                if (typeof item === 'object') {
                    title = item.title || item.name || key;
                    desc = item.shortDesc || item.about || item.text || "";
                    if (item.questions) qs = item.questions.join(" ");
                } else {
                    desc = item;
                }
                const searchStr = (title + " " + desc + " " + qs).toLowerCase();
                if (!query || searchStr.includes(query)) {
                    const card = document.createElement('div');
                    card.className = 'clean-data-card';
                    card.dataset.key = key;
                    card.onclick = () => { showSearchWikiCard(key, item); };

                    const imgs = (item && typeof item === 'object') ? (item.images || (item.src ? [item.src] : [])) : [];

        function handleSlotImageUpload(e, inputEl) {
            const file = e.target.files[0];

            reader.onload = (ev) => {
                const base64 = ev.target.result;
                const slot = inputEl.parentElement;
                slot.querySelector('.slot-image-data').value = base64;
                let img = slot.querySelector('img');
                if (!img) {
                    img = document.createElement('img');
                    const ph = slot.querySelector('.no-img-placeholder');
                    if (ph) ph.replaceWith(img);
                    else slot.insertBefore(img, slot.firstChild);
                }
                img.src = base64;
                img.onclick = function() { openGallery([base64], 0); };
            };
            reader.readAsDataURL(file);
        }

        // ─── 100% OFFLINE SMART ENGINE ───
        function processOfflineAI(query) {
            let cleanQuery = query.toLowerCase().trim();
            const stopWords = ["is", "a", "an", "the", "of", "in", "for", "to", "what", "who", "where", "yes", "ok"];
            let words = cleanQuery.split(/\s+/).filter(w => !stopWords.includes(w) && w.length > 0);
            if (words.length === 0) words = cleanQuery.split(/\s+/);

            let bestMatch = null;
            let highestScore = 0;
            let matchedRelation = "";

            for (let key in db) {
                let item = db[key];
                if (!item) continue;
                let score = 0;
                let title = (item.title || item.name || key).toLowerCase();
                let about = (item.about || item.text || "").toLowerCase();
                words.forEach(w => {
                    if (title.includes(w)) score += 3;
                    if (about.includes(w)) score += 1;
                });
                if (item.rows) {
                    item.rows.forEach(r => {
                        let rKey = r.key.toLowerCase();
                        let rVal = r.val.toLowerCase();
                        words.forEach(w => {
                            if (rKey.includes(w) || rVal.includes(w)) {
                                score += 4;
                                matchedRelation = `${r.val} is the ${r.key} of ${item.title || key}`;
                            }
                        });
                    });
                }
                if (score > highestScore) {
                    highestScore = score;
                    bestMatch = { item, relation: matchedRelation };
                }
            }

            if (bestMatch && highestScore >= 2) {
                if (bestMatch.relation) return `Yes, ${bestMatch.relation}.`;
                let item = bestMatch.item;
                return `Yes, ${item.title || key}: ${item.about || item.text || 'Data found in database.'}`;
            }
            return reconstructNaturalAnswer(cleanQuery, words);
        }

        function reconstructNaturalAnswer(rawQuery, coreWords) {
            let formattedWords = coreWords.map(w => w.charAt(0).toUpperCase() + w.slice(1));
            if (formattedWords.length >= 2) {
                let lastWord = formattedWords.pop();
                let firstPart = formattedWords.join(" ");
                return `Yes, ${firstPart} is ${lastWord}.`;
            }
            let sentence = rawQuery.replace(/(what is|who is|tell me about)/gi, "").trim();
            let capSentence = sentence.charAt(0).toUpperCase() + sentence.slice(1);
            return `Yes, ${capSentence}.`;
        }

        function stopAnimation(manual = false) {
            if (animationTimeout) { clearTimeout(animationTimeout);
                animationTimeout = null; }
            setButtonState(false);
            isAnimating = false;
            if (manual && currentTypingElement) {
                currentTypingElement.textContent = currentTypingText.substring(0, currentTypingIndex) + ".";
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function handleSendClick() { if (isAnimating) stopAnimation(true);
            else sendMessage(); }

        function animateText(el, text, speed = 40, start = 0) {
            if (start === 0) { stopAnimation(false);
                el.textContent = ""; }
            setButtonState(true);
            isAnimating = true;
            currentTypingText = text;
            currentTypingElement = el;
            currentTypingIndex = start;

            function type() {
                if (currentTypingIndex < currentTypingText.length) {
                    el.textContent = currentTypingText.substring(0, currentTypingIndex + 1);
                    currentTypingIndex++;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    animationTimeout = setTimeout(type, speed);
                } else {
                    setButtonState(false);
                    isAnimating = false;
                }
            }
            type();
        }

        function sendMessage() {
            const query = searchBox.value.trim();
            if (!query && !pendingChatImage) return;
            stopAnimation(false);
            removeWelcomeScreen();

            const userDiv = document.createElement('div');
            userDiv.className = 'user-msg';
            if (pendingChatImage) {
                const img = document.createElement('img');
                img.src = pendingChatImage;
                userDiv.appendChild(img);
                lastImageForEdit = pendingChatImage;
            }
            if (query) {
                const textDiv = document.createElement('div');
                textDiv.innerText = query;
                if (pendingChatImage) textDiv.style.marginTop = "8px";
                userDiv.appendChild(textDiv);
                lastQuery = query;
            }
            chatContainer.appendChild(userDiv);
            searchBox.value = '';
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });

            const imageToSend = pendingChatImage;
            clearChatImagePreview();
            setTimeout(() => { triggerChatResponse(query, imageToSend); }, 400);
        }

        function triggerChatResponse(rawKey, imageSrc = null) {
            let queryVal = rawKey ? rawKey.trim().toLowerCase() : "";
            let showImage = false,
                showText = true,
                showAllImages = false;
            if (queryVal.endsWith(" all") || queryVal.endsWith(" details") || queryVal.endsWith(" detail")) {
                showAllImages = true; showImage = true; showText = true;
                queryVal = queryVal.replace(/ (all|details|detail)$/, "").trim();
            } else if (queryVal.endsWith(" image") || queryVal.endsWith(" img")) {
                showImage = true; showText = false; showAllImages = false;
                queryVal = queryVal.replace(/ (image|img)$/, "").trim();
            } else if (queryVal.endsWith(" images")) {
                showImage = true; showText = false; showAllImages = true;
                queryVal = queryVal.replace(/ images$/, "").trim();
            }

            let matched = null;
            if (imageSrc) {
                let imgMatchedItem = null;
                for (let key in db) {
                    const item = db[key];
                    if (item && (item.src === imageSrc || (item.images && item.images.includes(imageSrc)))) {
                        imgMatchedItem = item; break;
                    }
                }
                if (imgMatchedItem) {
                    if (queryVal) {
                        const row = imgMatchedItem.rows && imgMatchedItem.rows.find(r => queryVal.includes(r.key.toLowerCase()));
                        if (row) matched = { type: 'row', text: row.val };
                        else matched = imgMatchedItem;
                    } else matched = imgMatchedItem;
                    currentContext = imgMatchedItem;
                } else {
                    matched = { type: 'unknown_img', text: "Image received! But I couldn't find its details in the database." };
                }
            }

            if (!matched && currentContext && !imageSrc) {
                if (queryVal === "image" || queryVal === "img") { showImage = true; showText = false; showAllImages = false; matched = currentContext; }
                else if (queryVal === "images") { showImage = true; showText = false; showAllImages = true; matched = currentContext; }
                else if (currentContext.rows) {
                    const row = currentContext.rows.find(r => r.key.toLowerCase() === queryVal || queryVal.includes(r.key.toLowerCase()));
                    if (row) matched = { type: 'row', text: row.val };
                }
            }

            if (!matched && !imageSrc) {
                for (let key in db) {
                    const item = db[key];
                    const title = (item.title || item.name || key).toLowerCase();
                    if (title === queryVal || key.toLowerCase() === queryVal || (item.questions && item.questions.includes(queryVal))) {
                        matched = item; currentContext = item; break;
                    }
                }
            }

            if (!matched && !imageSrc) {
                for (let key in db) {
                    const item = db[key];
                    if (queryVal.includes((item.title || key).toLowerCase())) {
                        if (item.rows) {
                            for (let r of item.rows) {
                                if (queryVal.includes(r.key.toLowerCase())) {
                                    matched = { type: 'row', text: r.val };
                                    currentContext = item; break;
                                }
                            }
                        }
                    }
                    if (matched) break;
                }
            }

            if (!matched && !imageSrc) {
                for (let key in db) {
                    const item = db[key];
                    if (item.rows) {
                        for (let r of item.rows) {
                            if (r.val.toLowerCase().includes(queryVal) || queryVal.includes(r.val.toLowerCase())) {
                                const title = item.title || key;
                                matched = {
                                    type: 'relation',
                                    text: `${r.val} is the ${r.key} of ${title}.\n\nAbout ${title}: ${item.about || item.text || ""}`,
                                    src: item.src,
                                    images: item.images
                                };
                                currentContext = item; break;
                            }
                        }
                    }
                    if (matched) break;
                }
            }

            if (!matched && !imageSrc) {
                for (let key in db) {
                    const item = db[key];
                    if (item.rows) {
                        for (let r of item.rows) {
                            if (r.key.toLowerCase() === queryVal) {
                                matched = { type: 'row', text: r.val };
                                currentContext = item; break;
                            }
                        }
                    }
                    if (matched) break;
                }
            }

            if (!matched) {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'ai-msg';
                chatContainer.appendChild(aiDiv);
                const span = document.createElement('span');
                aiDiv.appendChild(span);
                let offlineAnswer = processOfflineAI(queryVal);
                animateText(span, offlineAnswer, 30);
                chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
                return;
            }

            const aiDiv = document.createElement('div');
            aiDiv.className = 'ai-msg';
            chatContainer.appendChild(aiDiv);
            const allImgs = (matched.images && matched.images.length) ? matched.images : (matched.src ? [matched.src] : []);
            let toShow = [];
            if (showImage && allImgs.length > 0) {
                toShow = showAllImages ? allImgs : [allImgs[0]];
            }
            toShow.forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                aiDiv.appendChild(img);
            });
            if (showText) {
                let ans = matched.text || matched.about || matched;
                if (typeof ans !== 'string') ans = JSON.stringify(ans);
                if (matched.type === 'row' || matched.type === 'relation' || matched.type === 'unknown_img') {
                    ans = matched.text || '';
                }
                const span = document.createElement('span');
                aiDiv.appendChild(span);
                chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
                animateText(span, ans);
            } else {
                chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
            }
        }

        window.openGallery = openGallery;

        /* ══════════════════════════════════════════════════════
           SLIDE MENU + MULTIPLE CHATS
           ══════════════════════════════════════════════════════ */
        let chatSessions = [];
        let activeChatId = null;

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.innerText = str == null ? '' : str;
            return d.innerHTML;
        }

        function loadChatSessions() {
            try {
                const raw = localStorage.getItem('oc_chats_v1');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    chatSessions = parsed.chats || [];
                    activeChatId = parsed.activeId || null;
                }
            } catch (e) { chatSessions = [];
                activeChatId = null; }
            if (!chatSessions.length) {
                const id = 'chat_' + Date.now();
                chatSessions = [{ id, name: 'Chat 1', html: '' }];
                activeChatId = id;
                saveChatSessions();
            }
            if (!activeChatId || !chatSessions.find(c => c.id === activeChatId)) {
                activeChatId = chatSessions[0].id;
            }
            const active = chatSessions.find(c => c.id === activeChatId);
            if (active && active.html) { chatContainer.innerHTML = active.html; }
            if (chatContainer.children.length === 0) renderWelcomeScreen();
        }

        function saveChatSessions() {
            localStorage.setItem('oc_chats_v1', JSON.stringify({ chats: chatSessions, activeId: activeChatId }));
        }

        function syncActiveChatHtml() {
            const active = chatSessions.find(c => c.id === activeChatId);
            if (active) {
                const clone = chatContainer.cloneNode(true);
                const welcome = clone.querySelector('#welcome-screen');
                if (welcome) welcome.remove();
                active.html = clone.innerHTML;
            }
        }

        function openSlideMenu() {
            syncActiveChatHtml();
            saveChatSessions();
            renderChatList();
            document.getElementById('slide-menu-overlay').style.display = 'block';
            document.getElementById('slide-menu').classList.add('open');
        }

        function closeSlideMenu() {
            document.getElementById('slide-menu-overlay').style.display = 'none';
            document.getElementById('slide-menu').classList.remove('open');
        }

        function renderChatList() {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            chatSessions.forEach(chat => {
                const row = document.createElement('div');
                row.className = 'chat-list-item' + (chat.id === activeChatId ? ' active' : '');
                row.innerHTML = `
                    <span class="chat-list-name" onclick="switchChat('${chat.id}')">${escapeHtml(chat.name)}</span>
                    <div class="chat-dots-wrap">
                        <button class="chat-dots-btn" onclick="event.stopPropagation();toggleChatDotsMenu('${chat.id}')">⋮</button>
                        <div class="chat-dots-menu" id="dots-${chat.id}">
                            <div onclick="event.stopPropagation();renameChatPrompt('${chat.id}')">Rename</div>
                            <div onclick="event.stopPropagation();deleteChatConfirm('${chat.id}')">Delete</div>
                        </div>
                    </div>
                `;
                list.appendChild(row);
            });
        }

        function toggleChatDotsMenu(id) {
            document.querySelectorAll('.chat-dots-menu').forEach(m => { if (m.id !== 'dots-' + id) m.style.display = 'none'; });
            const m = document.getElementById('dots-' + id);
            if (m) m.style.display = (m.style.display === 'block') ? 'none' : 'block';
        }

        function createNewChat() {
            syncActiveChatHtml();
            const id = 'chat_' + Date.now();
            const num = chatSessions.length + 1;
            chatSessions.push({ id, name: 'Chat ' + num, html: '' });
            activeChatId = id;
            chatContainer.innerHTML = '';
            renderWelcomeScreen();
            saveChatSessions();
            renderChatList();
            closeSlideMenu();
        }

        function switchChat(id) {
            if (id === activeChatId) { closeSlideMenu(); return; }
            syncActiveChatHtml();
            activeChatId = id;
            const active = chatSessions.find(c => c.id === id);
            chatContainer.innerHTML = active ? (active.html || '') : '';
            if (chatContainer.children.length === 0) renderWelcomeScreen();
            saveChatSessions();
            renderChatList();
            closeSlideMenu();
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function renameChatPrompt(id) {
            const chat = chatSessions.find(c => c.id === id);
            if (!chat) return;
            const newName = prompt('Rename chat:', chat.name);
            if (newName && newName.trim()) {
                chat.name = newName.trim();
                saveChatSessions();
                renderChatList();
            }
        }

        function deleteChatConfirm(id) {
            if (!confirm('Delete this chat?')) return;
            chatSessions = chatSessions.filter(c => c.id !== id);
            if (!chatSessions.length) {
                const nid = 'chat_' + Date.now();
                chatSessions = [{ id: nid, name: 'Chat 1', html: '' }];
            }
            if (activeChatId === id) {
                activeChatId = chatSessions[0].id;
                chatContainer.innerHTML = chatSessions[0].html || '';
                if (chatContainer.children.length === 0) renderWelcomeScreen();
            }
            saveChatSessions();
            renderChatList();
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.chat-dots-wrap')) {
                document.querySelectorAll('.chat-dots-menu').forEach(m => m.style.display = 'none');
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            loadChatSessions();
        });

        window.addEventListener('beforeunload', () => {
            syncActiveChatHtml();
            saveChatSessions();
        });

        /* ══════════════════════════════════════════════════════
           OPENCLOCK FILE MANAGER
           ══════════════════════════════════════════════════════ */
        let filesDbInstance = null;
        const FILES_DB_NAME = "OpenClockFilesDB";
        const FILES_STORE_NAME = "filesStore";
        let savedFiles = [];

        const filesReq = indexedDB.open(FILES_DB_NAME, 1);
        filesReq.onupgradeneeded = function(e) {
            if (!e.target.result.objectStoreNames.contains(FILES_STORE_NAME)) {
                e.target.result.createObjectStore(FILES_STORE_NAME, { keyPath: 'id' });
            }
        };
        filesReq.onsuccess = function(e) {
            filesDbInstance = e.target.result;
            loadAllFiles();
        };

        function loadAllFiles() {
            if (!filesDbInstance) return;
            const tx = filesDbInstance.transaction([FILES_STORE_NAME], 'readonly');
            const cursorReq = tx.objectStore(FILES_STORE_NAME).openCursor();
            savedFiles = [];
            cursorReq.onsuccess = function(event) {
                const cursor = event.target.result;
                if (cursor) {
                    savedFiles.push(cursor.value);
                    cursor.continue();
                } else renderFileList();
            };
        }

        function persistFile(entry) {
            if (filesDbInstance) {
                filesDbInstance.transaction([FILES_STORE_NAME], 'readwrite').objectStore(FILES_STORE_NAME).put(entry);
            }
        }

        function deleteFileEntry(id) {
            if (filesDbInstance) {
                filesDbInstance.transaction([FILES_STORE_NAME], 'readwrite').objectStore(FILES_STORE_NAME).delete(id);
            }
            savedFiles = savedFiles.filter(f => f.id !== id);
            renderFileList();
        }

        function openFileManager() {
            closeSlideMenu();
            document.getElementById('file-manager-overlay').style.display = 'flex';
            renderFileList();
        }

        function closeFileManager() {
            document.getElementById('file-manager-overlay').style.display = 'none';
        }

        function renderFileList(filterText) {
            const list = document.getElementById('file-manager-list');
            list.innerHTML = '';
            const q = (filterText || '').trim().toLowerCase();
            savedFiles.forEach(f => {
                if (q && !f.name.toLowerCase().includes(q)) return;
                const row = document.createElement('div');
                row.className = 'file-card';
                row.innerHTML = `
                    <img class="file-card-thumb" src="${f.thumb || ''}" alt="" />
                    <div class="file-card-name">${escapeHtml(f.name)}</div>
                    <button class="file-card-download" onclick="downloadFileEntry('${f.id}')">Download</button>
                    <button class="file-card-delete" onclick="deleteFileEntry('${f.id}')">✕</button>
                `;
                list.appendChild(row);
            });
        }

        function downloadFileEntry(id) {
            const f = savedFiles.find(x => x.id === id);
            if (!f || !f.fileData) return;
            const a = document.createElement('a');
            a.href = f.fileData;
            a.download = f.fileName || f.name;
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        let pendingFileThumb = null;
        let pendingFileData = null;
        let pendingFileName = '';

        function openAddFileModal() {
            pendingFileThumb = null; pendingFileData = null; pendingFileName = '';
            document.getElementById('addFileName').value = '';
            document.getElementById('addFileThumbPreview').style.display = 'none';
            document.getElementById('addFileThumbPreview').src = '';
            document.getElementById('addFileChosenName').textContent = '';
            document.getElementById('add-file-modal').style.display = 'flex';
        }

        function closeAddFileModal() { document.getElementById('add-file-modal').style.display = 'none'; }

        function handleFileThumbSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                pendingFileThumb = e.target.result;
                const preview = document.getElementById('addFileThumbPreview');
                preview.src = pendingFileThumb;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function handleActualFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            pendingFileName = file.name;
            document.getElementById('addFileChosenName').textContent = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                pendingFileData = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function acceptAddFile() {
            const name = document.getElementById('addFileName').value.trim();
            if (!name) { alert('Please enter a name!'); return; }
            if (!pendingFileData) { alert('Please add a file!'); return; }
            const entry = {
                id: 'file_' + Date.now(),
                name: name,
                thumb: pendingFileThumb || '',
                fileData: pendingFileData,
                fileName: pendingFileName
            };
            savedFiles.push(entry);
            persistFile(entry);
            renderFileList();
            closeAddFileModal();
        }

        // ─── FILE TRIGGER WORDS ───
        const FILE_TRIGGER_WORDS = ['download', 'install'];

        function checkAndShowFileTrigger() {
            const raw = searchBox.value.trim().toLowerCase();
            if (!raw) return false;
            let hasTrigger = false;
            for (const t of FILE_TRIGGER_WORDS) {
                if (raw.includes(t)) { hasTrigger = true; break; }
            }
            if (!hasTrigger) return false;
            let foundFile = null;
            for (const f of savedFiles) {
                const fname = f.name.toLowerCase();
                if (raw.includes(fname)) { foundFile = f; break; }
            }
            if (!foundFile) return false;
            const typedText = searchBox.value.trim();
            removeWelcomeScreen();
            const userDiv = document.createElement('div');
            userDiv.className = 'user-msg';
            userDiv.innerText = typedText;
            chatContainer.appendChild(userDiv);
            const aiDiv = document.createElement('div');
            aiDiv.className = 'ai-msg';
            aiDiv.innerHTML = `
                <div class="chat-file-card">
                    <img class="chat-file-card-thumb" src="${foundFile.thumb || ''}" alt="" />
                    <div class="chat-file-card-name">${escapeHtml(foundFile.name)}</div>
                    <button class="chat-file-card-download" onclick="downloadFileEntry('${foundFile.id}')">Download</button>
                </div>
            `;
            chatContainer.appendChild(aiDiv);
            searchBox.value = '';
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
            return true;
        }

        function handleEnterWithFileCheck(e) {
            if (e.key === 'Enter') {
                if (checkAndShowFileTrigger()) { e.preventDefault(); return; }
                handleEnter(e);
            }
        }

        function handleSendClickWithFileCheck() {
            if (checkAndShowFileTrigger()) return;
            handleSendClick();
        }

        // ─── Apply config on load ───
        applyConfig();
    </script>
</body>
</html>
