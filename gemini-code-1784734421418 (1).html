<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Originels</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --sub-text: #555555;
            --border-color: #e0e0e0;
            --card-bg: #f9f9f9;
            --logo-color: #bb1919; /* Pure Red ONLY for the name Originel */
            --drawer-bg: #f5f5f5;
            --btn-bg: #000000;
            --btn-text: #ffffff;
        }

        body.dark-theme {
            --bg-color: #121212;
            --text-color: #ffffff;
            --sub-text: #aaaaaa;
            --border-color: #333333;
            --card-bg: #1a1a1a;
            --drawer-bg: #181818;
            --btn-bg: #ffffff;
            --btn-text: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.2s, color 0.2s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 40px;
        }

        /* Header Styling */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            padding: 4px;
        }

        .icon-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Logo Text: ONLY this is Red */
        .logo-text {
            color: var(--logo-color);
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            text-decoration: none;
            cursor: pointer;
        }

        /* Search Section & Menu Drawer */
        .search-container {
            display: none;
            padding: 12px 16px;
            background: var(--drawer-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .search-container.active {
            display: block;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .search-box input {
            flex: 1;
            padding: 10px 14px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            outline: none;
        }

        .search-box button {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-box button svg {
            width: 18px;
            height: 18px;
            fill: var(--btn-text);
        }

        /* Categories List */
        .category-menu {
            list-style: none;
        }

        .category-menu li {
            padding: 12px 8px;
            border-bottom: 1px solid var(--border-color);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-menu li:hover {
            opacity: 0.7;
        }

        .category-menu li svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* AI Smart Answer Box (Black & White Styling) */
        .ai-brain-box {
            background: var(--card-bg);
            border: 2px solid var(--text-color);
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .ai-brain-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 8px;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .ai-brain-header svg {
            width: 18px;
            height: 18px;
            fill: var(--text-color);
        }

        .ai-brain-content {
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-color);
        }

        /* Main Layout */
        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        .filter-badge {
            display: inline-block;
            background: var(--btn-bg);
            color: var(--btn-text);
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
            border-radius: 2px;
        }

        /* Hero Article (Main Top) */
        .article-hero {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .article-hero img {
            width: 100%;
            height: auto;
            max-height: 320px;
            object-fit: cover;
            display: block;
            margin-bottom: 12px;
        }

        .article-hero h2 {
            font-size: 24px;
            line-height: 1.3;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .article-hero p {
            font-size: 15px;
            color: var(--sub-text);
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .meta {
            font-size: 12px;
            color: var(--sub-text);
        }

        .meta span {
            margin-right: 8px;
        }

        .meta .cat-name {
            font-weight: bold;
            color: var(--text-color);
        }

        /* Standard Article Item */
        .article-list-item {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .article-list-item img {
            width: 120px;
            height: 80px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .article-list-item .content {
            flex: 1;
        }

        .article-list-item h3 {
            font-size: 16px;
            line-height: 1.3;
            margin-bottom: 8px;
            font-weight: 700;
        }

        /* Text-Only Article Layout */
        .article-text-only {
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .article-text-only h2 {
            font-size: 22px;
            line-height: 1.3;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .article-text-only p {
            font-size: 15px;
            color: var(--sub-text);
            line-height: 1.5;
            margin-bottom: 10px;
        }

        /* Admin / Settings Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .admin-card {
            background: var(--bg-color);
            color: var(--text-color);
            width: 90%;
            max-width: 500px;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .admin-card h3 {
            margin-bottom: 15px;
            color: var(--text-color);
            font-size: 18px;
            border-bottom: 2px solid var(--text-color);
            padding-bottom: 5px;
        }

        .theme-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .theme-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            font-weight: bold;
            border-radius: 2px;
        }

        .theme-btn.active {
            border-color: var(--text-color);
            background: var(--btn-bg);
            color: var(--btn-text);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 14px;
        }

        .btn-submit {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid var(--border-color);
            padding: 10px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-close {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px;
            width: 100%;
            cursor: pointer;
            margin-top: 6px;
        }

        /* Delete Manager Section */
        .delete-section {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .delete-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed var(--border-color);
            font-size: 13px;
        }

        .delete-item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 280px;
            font-weight: bold;
        }

        .btn-delete {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <button class="icon-btn" id="menuToggle" aria-label="Toggle Menu">
                <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
        </div>
        
        <!-- Only Logo Name is Red -->
        <a class="logo-text" onclick="showCategory('All')">ORIGINELS</a>
        
        <div class="header-right">
            <!-- Home Icon -->
            <button class="icon-btn" onclick="showCategory('All')" aria-label="Home">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </button>
        </div>
    </header>

    <!-- Search Bar & Category Drawer -->
    <div class="search-container" id="searchContainer">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search">
            <button onclick="handleSearch()" aria-label="Search">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
        </div>
        <ul class="category-menu" id="categoryMenuList">
            <!-- Dynamic Categories -->
        </ul>
    </div>

    <!-- Main Content Area -->
    <main>
        <div id="aiBrainContainer"></div>
        <div id="filterStatus"></div>
        <div id="articlesContainer">
            <!-- Articles rendered here -->
        </div>
    </main>

    <!-- Admin & Settings Panel Modal -->
    <div class="modal-overlay" id="adminModal">
        <div class="admin-card">
            <h3>Settings & Theme</h3>
            <div class="theme-selector">
                <button class="theme-btn" id="lightBtn" onclick="setTheme('light')">Light Theme</button>
                <button class="theme-btn" id="darkBtn" onclick="setTheme('dark')">Dark Theme</button>
            </div>

            <h3>Admin Panel (Upload)</h3>
            <form id="articleForm">
                <div class="form-group">
                    <label>Article Title</label>
                    <input type="text" id="postTitle" placeholder="Enter headline..." required>
                </div>
                <div class="form-group">
                    <label>Content / Details</label>
                    <textarea id="postAbout" rows="4" placeholder="Enter article text..."></textarea>
                </div>
                <div class="form-group">
                    <label>Upload Photo (Optional)</label>
                    <input type="file" id="postImage" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Category Name</label>
                    <input type="text" id="postCategory" placeholder="e.g. World, Sports, Tech" required>
                </div>
                <div class="form-group">
                    <label>Date / Time Stamp</label>
                    <input type="text" id="postDate" placeholder="e.g. 23 mins ago | 2026" required>
                </div>
                <div class="form-group">
                    <label>Layout Type</label>
                    <select id="postLayout">
                        <option value="hero">Main Top Article (Large Photo)</option>
                        <option value="standard">Standard Article (Side Photo)</option>
                        <option value="text-only">Direct Large Text (No Photo)</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Upload Article</button>
            </form>

            <!-- Delete Articles Section -->
            <div class="delete-section">
                <h3 style="font-size: 15px;">Manage & Delete Articles</h3>
                <div id="deleteList"></div>
            </div>

            <button type="button" class="btn-close" onclick="closeAdminModal()">Close Panel</button>
        </div>
    </div>

    <script>
        // Default Articles
        

        // App State
        let articles = JSON.parse(localStorage.getItem('news_articles')) || initialArticles;
        let currentCategory = 'All';

        // DOM Elements
        const menuToggle = document.getElementById('menuToggle');
        const searchContainer = document.getElementById('searchContainer');
        const searchInput = document.getElementById('searchInput');
        const categoryMenuList = document.getElementById('categoryMenuList');
        const articlesContainer = document.getElementById('articlesContainer');
        const aiBrainContainer = document.getElementById('aiBrainContainer');
        const adminModal = document.getElementById('adminModal');
        const articleForm = document.getElementById('articleForm');
        const filterStatus = document.getElementById('filterStatus');
        const deleteList = document.getElementById('deleteList');

        // Theme Management (Black & White Theme Options)
        function setTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark-theme');
                document.getElementById('darkBtn').classList.add('active');
                document.getElementById('lightBtn').classList.remove('active');
            } else {
                document.body.classList.remove('dark-theme');
                document.getElementById('lightBtn').classList.add('active');
                document.getElementById('darkBtn').classList.remove('active');
            }
            localStorage.setItem('news_theme', theme);
        }

        // Load Saved Theme
        const savedTheme = localStorage.getItem('news_theme') || 'light';
        setTheme(savedTheme);

        // Toggle Drawer
        menuToggle.addEventListener('click', () => {
            searchContainer.classList.toggle('active');
        });

        // Smart Search & AI Direct Answer Engine
        function handleSearch() {
            const query = searchInput.value.trim().toLowerCase();
            
            if (query === 'edit') {
                renderDeleteList();
                adminModal.classList.add('active');
                searchInput.value = '';
                return;
            }

            if (query === '') return;

            // Find Matching Articles
            const matchedArticles = articles.filter(a => 
                a.title.toLowerCase().includes(query) || 
                a.about.toLowerCase().includes(query) ||
                a.category.toLowerCase().includes(query)
            );

            // Direct AI Answer Output
            if (matchedArticles.length > 0) {
                const topMatch = matchedArticles[0];
                const directAnswer = topMatch.about ? topMatch.about : topMatch.title;
                
                aiBrainContainer.innerHTML = `
                    <div class="ai-brain-box">
                        <div class="ai-brain-header">
                            <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg>
                            AI Answer
                        </div>
                        <div class="ai-brain-content">
                            <strong>Summary:</strong> ${directAnswer}
                        </div>
                    </div>
                `;
            } else {
                aiBrainContainer.innerHTML = `
                    <div class="ai-brain-box">
                        <div class="ai-brain-header">
                            <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg>
                            Direct Answer
                        </div>
                        <div class="ai-brain-content">
                            No direct answers or matching records found for "<strong>${query}</strong>".
                        </div>
                    </div>
                `;
            }

            filterStatus.innerHTML = `<div class="filter-badge">Search: "${query}"</div>`;
            renderArticleList(matchedArticles);
        }

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });

        function closeAdminModal() {
            adminModal.classList.remove('active');
        }

        const arrowSvg = `<svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>`;

        // Dynamic Categories Menu
        function renderCategories() {
            const categories = ['All', ...new Set(articles.map(a => a.category))];
            categoryMenuList.innerHTML = categories.map(cat => `
                <li onclick="showCategory('${cat}')">
                    <span>${cat}</span>
                    ${arrowSvg}
                </li>
            `).join('');
        }

        function showCategory(cat) {
            currentCategory = cat;
            aiBrainContainer.innerHTML = '';
            if (cat === 'All') {
                filterStatus.innerHTML = '';
            } else {
                filterStatus.innerHTML = `<div class="filter-badge">Category: ${cat}</div>`;
            }
            renderArticles();
            searchContainer.classList.remove('active');
        }

        function renderArticles() {
            const filtered = currentCategory === 'All' 
                ? articles 
                : articles.filter(a => a.category.toLowerCase() === currentCategory.toLowerCase());
            
            renderArticleList(filtered);
        }

        function renderArticleList(list) {
            if (list.length === 0) {
                articlesContainer.innerHTML = '<p style="padding: 20px 0; color: var(--sub-text);">No articles found.</p>';
                return;
            }

            articlesContainer.innerHTML = list.map(item => {
                if (item.layout === 'text-only' || !item.image) {
                    return `
                        <article class="article-text-only">
                            <h2>${item.title}</h2>
                            ${item.about ? `<p>${item.about}</p>` : ''}
                            <div class="meta">
                                <span>${item.date}</span> | 
                                <span class="cat-name">${item.category}</span>
                            </div>
                        </article>
                    `;
                } else if (item.layout === 'hero') {
                    return `
                        <article class="article-hero">
                            <img src="${item.image}" alt="News Image">
                            <h2>${item.title}</h2>
                            ${item.about ? `<p>${item.about}</p>` : ''}
                            <div class="meta">
                                <span>${item.date}</span> | 
                                <span class="cat-name">${item.category}</span>
                            </div>
                        </article>
                    `;
                } else {
                    return `
                        <article class="article-list-item">
                            <img src="${item.image}" alt="News Image">
                            <div class="content">
                                <h3>${item.title}</h3>
                                <div class="meta">
                                    <span>${item.date}</span> | 
                                    <span class="cat-name">${item.category}</span>
                                </div>
                            </div>
                        </article>
                    `;
                }
            }).join('');
        }

        // Delete Handler
        function deleteArticle(id) {
            articles = articles.filter(a => a.id !== id);
            localStorage.setItem('news_articles', JSON.stringify(articles));
            renderCategories();
            renderArticles();
            renderDeleteList();
        }

        function renderDeleteList() {
            if (articles.length === 0) {
                deleteList.innerHTML = '<p style="font-size:12px; color:var(--sub-text);">No articles available to delete.</p>';
                return;
            }
            deleteList.innerHTML = articles.map(item => `
                <div class="delete-item">
                    <span class="delete-item-title">${item.title}</span>
                    <button class="btn-delete" onclick="deleteArticle(${item.id})">Delete</button>
                </div>
            `).join('');
        }

        // Form Submit Handler
        articleForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const title = document.getElementById('postTitle').value;
            const about = document.getElementById('postAbout').value;
            const category = document.getElementById('postCategory').value.trim();
            const date = document.getElementById('postDate').value;
            const layout = document.getElementById('postLayout').value;
            const imageInput = document.getElementById('postImage');

            const saveArticle = (imageData) => {
                const newArticle = {
                    id: Date.now(),
                    title,
                    about,
                    image: imageData,
                    category,
                    date,
                    layout
                };

                articles.unshift(newArticle);
                localStorage.setItem('news_articles', JSON.stringify(articles));

                renderCategories();
                renderArticles();
                renderDeleteList();
                closeAdminModal();
                articleForm.reset();
            };

            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveArticle(e.target.result);
                };
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                saveArticle('');
            }
        });

        // Initial Execution
        renderCategories();
        renderArticles();
    </script>
</body>
</html>
